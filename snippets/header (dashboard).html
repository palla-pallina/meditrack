<header class="topbar">

    <div class="topbar__inner">

        <!-- BRAND -->

        <div class="brand" aria-label="MediTrack Dashboard">

            <img
                src="../../draft.png"
                alt="MediTrack Logo"
                class="actual-logo"
                style="height: 50px;"
            >

            <span class="brand__text">

                <strong>
                    MediTrack
                </strong>

                <span id="brandRole">
