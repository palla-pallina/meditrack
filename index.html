<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In | MediTrack</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/x-icon" href="draft.png">

<style>
:root {
    --blue-950: #0b2947;
    --blue-900: #103f70;
    --blue-800: #155a9b;
    --blue-700: #1f70bd;
    --blue-600: #2f84d8;
    --blue-500: #4599e7;
    --blue-100: #eaf4ff;
    --blue-50: #f6faff;

    --white: #ffffff;
    --text: #20354a;
    --muted: #718295;

    --line: #dce8f3;
    --line-strong: #bfd4e8;

    --danger: #c84444;
    --danger-bg: #fff2f2;

    --radius-lg: 24px;
    --radius-md: 14px;
    --radius-sm: 11px;

    --shadow-card:
        0 30px 70px rgba(25, 74, 116, 0.14),
        0 8px 25px rgba(25, 74, 116, 0.06);
}

/* =========================
   RESET
========================= */

* {
    box-sizing: border-box;
}

html {
    min-height: 100%;
}

body {
    margin: 0;
    min-height: 100vh;

    display: grid;
    place-items: center;

    padding: 28px;

    font-family:
        "Inter",
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    color: var(--text);

    background:
        radial-gradient(
            circle at 10% 10%,
            rgba(69, 153, 231, 0.18),
            transparent 28rem
        ),
        radial-gradient(
            circle at 90% 90%,
            rgba(31, 112, 189, 0.11),
            transparent 30rem
        ),
        linear-gradient(
            135deg,
            #ffffff 0%,
            #f7fbff 50%,
            #eef6fd 100%
        );

    position: relative;
    overflow-x: hidden;
}

/* Decorative background circles */

body::before,
body::after {
    content: "";
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
}

body::before {
    width: 280px;
    height: 280px;
    top: -150px;
    right: -90px;
    background: rgba(69, 153, 231, 0.07);
}

body::after {
    width: 220px;
    height: 220px;
    bottom: -120px;
    left: -80px;
    background: rgba(31, 112, 189, 0.06);
}

/* =========================
   CONTAINER
========================= */

.login-container {
    width: min(100%, 430px);
    position: relative;
    z-index: 1;
}

/* =========================
   CARD
========================= */

.login-card {
    padding: 38px;
    border: 1px solid rgba(191, 212, 232, 0.75);
    border-radius: var(--radius-lg);

    background: rgba(255, 255, 255, 0.96);

    box-shadow: var(--shadow-card);

    backdrop-filter: blur(12px);
}

/* =========================
   BRAND
========================= */

.logo {
    margin-bottom: 32px;
    text-align: center;
}

/*
   LOGO PLACEHOLDER

   Replace the contents of .logo-mark with:
   <img src="your-logo.png" alt="MediTrack Logo">
   when your actual logo is ready.
*/

.logo-mark {
    width: 76px;
    height: 76px;

    margin: 0 auto 18px;

    display: grid;
    place-items: center;

    border-radius: 22px;

    color: var(--white);

    background:
        linear-gradient(
            145deg,
            var(--blue-600),
            var(--blue-800)
        );

    box-shadow:
        0 12px 25px rgba(31, 112, 189, 0.24);

    position: relative;
}

/* Medical cross placeholder */

.logo-mark::before,
.logo-mark::after {
    content: "";
    position: absolute;

    background: white;

    border-radius: 4px;
}

.logo-mark::before {
    width: 34px;
    height: 10px;
}

.logo-mark::after {
    width: 10px;
    height: 34px;
}

.logo-mark span {
    position: absolute;

    width: 10px;
    height: 10px;

    border-radius: 50%;

    background: rgba(255, 255, 255, 0.2);
}

.logo h1 {
    margin: 0 0 7px;

    color: #0140c0;

    font-size: clamp(2rem, 5vw, 2.4rem);
    font-weight: 700;

    letter-spacing: -0.045em;
}

.logo p {
    margin: 0;

    color: var(--muted);

    font-size: 0.86rem;
    line-height: 1.5;
}

/* =========================
   FORM
========================= */

.form-group {
    margin-bottom: 19px;
}

label {
    display: block;

    margin-bottom: 8px;

    color: var(--blue-950);

    font-size: 0.84rem;
    font-weight: 700;
}

.input-wrapper {
    position: relative;
}

input {
    width: 100%;
    min-height: 50px;

    padding: 12px 14px;

    border: 1px solid var(--line-strong);
    border-radius: var(--radius-sm);

    background: #ffffff;
    color: var(--text);

    outline: none;

    font: inherit;
    font-size: 0.91rem;
}

input::placeholder {
    color: #9aabbb;
}

input:hover {
    border-color: #91bde2;
}

input:focus {
    border-color: var(--blue-600);

    box-shadow:
        0 0 0 4px rgba(47, 132, 216, 0.10);
}

/* =========================
   PASSWORD TOGGLE
========================= */

.password-input {
    padding-right: 48px;
}

.password-toggle {
    position: absolute;

    right: 5px;
    top: 50%;

    transform: translateY(-50%);

    width: 38px;
    height: 38px;
    min-height: 38px;

    padding: 0;

    border: 0;

    color: var(--muted);
    background: transparent;

    box-shadow: none;

    cursor: pointer;
}

.password-toggle:hover {
    color: var(--blue-700);
    background: var(--blue-50);

    transform: translateY(-50%);
    box-shadow: none;
}

.password-toggle svg {
    width: 18px;
    height: 18px;
}

/* =========================
   LOGIN BUTTON
========================= */

.login-button {
    width: 100%;
    min-height: 50px;

    margin-top: 4px;

    padding: 0 18px;

    border: 0;
    border-radius: var(--radius-sm);

    color: var(--white);

    background: linear-gradient( 135deg, #5fc6ff, #0140c0 );

    box-shadow:
        0 10px 22px rgba(31, 112, 189, 0.20);

    font: inherit;
    font-size: 0.9rem;
    font-weight: 700;

    cursor: pointer;
}

.login-button:hover {
    background:
        linear-gradient(
            135deg,
            var(--blue-700),
            var(--blue-900)
        );

    transform: translateY(-1px);

    box-shadow:
        0 13px 26px rgba(31, 112, 189, 0.25);
}

.login-button:active {
    transform: translateY(0);
}

.login-button:disabled {
    opacity: 0.65;
    cursor: wait;
    transform: none;
}

/* =========================
   FORGOT PASSWORD
========================= */

.forgot {
    margin-top: 18px;
    text-align: center;
}

.forgot a {
    color: var(--blue-700);

    font-size: 0.83rem;
    font-weight: 600;

    text-decoration: none;
}

.forgot a:hover {
    color: var(--blue-900);
    text-decoration: underline;
    text-underline-offset: 3px;
}

/* =========================
   DIVIDER
========================= */

.divider {
    display: flex;
    align-items: center;

    gap: 12px;

    margin: 28px 0 20px;

    color: #9aabbb;

    font-size: 0.72rem;
    font-weight: 600;
}

.divider::before,
.divider::after {
    content: "";

    height: 1px;
    flex: 1;

    background: var(--line);
}

/* =========================
   STATUS
========================= */

.status-box {
    padding: 13px 14px;

    border: 1px solid var(--line);
    border-radius: 12px;

    background: #f9fcff;
}

.status-label {
    display: flex;
    align-items: center;
    gap: 7px;

    margin-bottom: 7px;

    color: var(--blue-800);

    font-size: 0.76rem;
    font-weight: 700;
}

.status-dot {
    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #8ca2b6;
}

#status {
    margin: 0;

    white-space: pre-wrap;
    word-break: break-word;

    color: var(--muted);

    font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Consolas,
        monospace;

    font-size: 0.72rem;
    line-height: 1.5;
}

/* =========================
   FOOTER
========================= */

.login-footer {
    margin-top: 20px;

    text-align: center;

    color: #8b9bab;

    font-size: 0.72rem;
    line-height: 1.5;
}

/* =========================
   ACCESSIBILITY
========================= */

a,
button,
input {
    transition:
        color 160ms ease,
        background-color 160ms ease,
        border-color 160ms ease,
        box-shadow 160ms ease,
        transform 160ms ease;
}

a:focus-visible,
button:focus-visible,
input:focus-visible {
    outline: 3px solid rgba(47, 132, 216, 0.20);
    outline-offset: 3px;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 520px) {
    body {
        padding: 18px;
    }

    .login-card {
        padding: 28px 21px;
        border-radius: 20px;
    }

    .logo {
        margin-bottom: 27px;
    }

    .logo-mark {
        width: 68px;
        height: 68px;
        border-radius: 19px;
    }
}
</style>

</head>

<body>

<div class="login-container">

<div class="login-card">

    <!-- =========================
         BRAND / LOGO
    ========================== -->

    <div class="logo">


            <img
                src="draft.png"
                alt="MediTrack Logo"
                class="actual-logo"
                style="height: 70px;"
            >

        <h1>MediTrack</h1>

        <p>
            Smart Medicine Dispensing System
        </p>

    </div>

    <!--
    <div class="logo">
            <img
                src="../draft.png"
                alt="MediTrack Logo"
                class="actual-logo"
                style="height: 95px;"
            >
    </div>
    -->

    <!-- =========================
         LOGIN FORM
    ========================== -->

    <form id="loginForm">

        <div class="form-group">

            <label for="email">
                Email Address
            </label>

            <div class="input-wrapper">

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

            </div>

        </div>


        <div class="form-group">

            <label for="password">
                Password
            </label>

            <div class="input-wrapper">

                <input
                    type="password"
                    id="password"
                    class="password-input"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

                <button
                    type="button"
                    class="password-toggle"
                    id="passwordToggle"
                    aria-label="Show password"
                    title="Show password"
                >
                    <svg
                        id="eyeIcon"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </button>

            </div>

        </div>


        <button
            type="submit"
            class="login-button"
            id="loginButton"
        >
            Log In
        </button>


        <div class="forgot">

            <a href="forgot_password.html">
                Forgot your password?
            </a>

        </div>

    </form>


    <!-- =========================
         STATUS
    ========================== -->

    <div class="divider">
        <span>SECURE ACCESS</span>
    </div>

    <div class="status-box">

        <div class="status-label">
            <span class="status-dot"></span>
            System Status
        </div>

        <pre id="status">...</pre>

    </div>

</div>


<div class="login-footer">
    MediTrack © Ospital ng Sampaloc
</div>

</div>

<script type="module">

// ============================================================
// Activity Logging
// ============================================================

import {
    logLogin
} from "./private/js/activity_log.js";


// ============================================================
// Firebase SDK
// ============================================================

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";

import {
    getDatabase,
    ref,
    get,
    update
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-database.js";


// ============================================================
// Firebase Configuration
// ============================================================

const firebaseConfig = {
	/* firebase config */
};



// ============================================================
// Initialize Firebase
// ============================================================

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const database = getDatabase(app);


// ============================================================
// DOM Elements
// ============================================================

const form =
    document.getElementById("loginForm");

const status =
    document.getElementById("status");

const loginButton =
    document.getElementById("loginButton");

const password =
    document.getElementById("password");

const passwordToggle =
    document.getElementById("passwordToggle");

const eyeIcon =
    document.getElementById("eyeIcon");


// ============================================================
// Password Visibility Toggle
// ============================================================

passwordToggle.addEventListener(
    "click",
    function () {

        const isPassword =
            password.type === "password";

        password.type =
            isPassword ? "text" : "password";

        passwordToggle.setAttribute(
            "aria-label",
            isPassword
                ? "Hide password"
                : "Show password"
        );

        passwordToggle.setAttribute(
            "title",
            isPassword
                ? "Hide password"
                : "Show password"
        );

        eyeIcon.innerHTML =
            isPassword
                ? `
                    <path d="M3 3l18 18"></path>
                    <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
                    <path d="M9.9 4.3A10.7 10.7 0 0 1 12 4c6.5 0 10 8 10 8a17.3 17.3 0 0 1-3.1 4.1"></path>
                    <path d="M6.2 6.2C3.6 8 2 12 2 12s3.5 8 10 8a10.7 10.7 0 0 0 4.1-.8"></path>
                `
                : `
                    <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                `;
    }
);


// ============================================================
// Login
// ============================================================

form.addEventListener(
    "submit",
    async function(e) {

        e.preventDefault();

        status.textContent =
            "Signing in...";

        loginButton.disabled = true;

        loginButton.textContent =
            "Signing In...";


        const email =
            document
                .getElementById("email")
                .value
                .trim();


        const passwordValue =
            password.value;


        try {

            // ====================================================
            // Authenticate
            // ====================================================

            const credential =
                await signInWithEmailAndPassword(
                    auth,
                    email,
                    passwordValue
                );


            const uid =
                credential.user.uid;


            // ====================================================
            // Read User Profile
            // ====================================================

            const snapshot =
                await get(
                    ref(
                        database,
                        "users/" + uid
                    )
                );


            if (!snapshot.exists()) {

                throw new Error(
                    "User profile not found."
                );

            }


            const user =
                snapshot.val();


            // ====================================================
            // Activate Pending Account
            // ====================================================

            if (
                user.accountStatus === "Pending" &&
                user.mustChangePassword === true
            ) {

                await update(
                    ref(
                        database,
                        "users/" + uid
                    ),
                    {
                        accountStatus: "Active",

                        mustChangePassword: false,

                        activatedAt:
                            new Date().toISOString()
                    }
                );


                // Update local copy

                user.accountStatus =
                    "Active";

                user.mustChangePassword =
                    false;

            }


            // ====================================================
            // Check Account Status
            // ====================================================

            if (
                user.accountStatus !== "Active"
            ) {

                throw new Error(
                    "Your account is not yet active."
                );

            }


            // ====================================================
            // ACTIVITY LOG
            // ====================================================

            await logLogin(
                database,
                auth
            );


            // ====================================================
            // Redirect According to User Type
            // ====================================================

            switch (user.userType) {

                case "Admin":

                    window.location.href =
                        "./private/admin/dashboard.html";

                    break;


                case "Clerk":

                    window.location.href =
                        "./private/clerk/view_records.html";

                    break;


                case "Doctor":

                    window.location.href =
                        "./private/doctor/dashboard.html";

                    break;


                case "Head Nurse":

                    window.location.href =
                        "./private/headnurse/dashboard.html";

                    break;

                    
                case "Pharmacist":

                    window.location.href =
                        "./private/pharmacist/dashboard.html";

                    break;


                default:

                    throw new Error(
                        "Unknown user type."
                    );

            }

        }

        catch(error) {

            console.error(
                "Login error:",
                error
            );


            status.textContent =
                `Code: ${error.code || "UNKNOWN"}\n\n` +
                `Message: ${error.message}`;


            loginButton.disabled = false;

            loginButton.textContent =
                "Log In";

        }

    }
);

</script>

</body>
</html>
