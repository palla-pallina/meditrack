<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MediTrack Login</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;
    background:linear-gradient(135deg,#f3f8fc,#dceefd);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
    color:#2c3e50;
}

.login-container{

    width:100%;
    max-width:420px;

}

.login-card{

    background:#fff;
    padding:40px;
    border-radius:18px;
    box-shadow:0 15px 40px rgba(0,0,0,.08);

}

.logo{

    text-align:center;
    margin-bottom:30px;

}

.logo h1{

    color:#1976d2;
    font-size:2rem;
    margin-bottom:8px;

}

.logo p{

    color:#6b7280;
    font-size:.95rem;

}

.form-group{

    margin-bottom:22px;

}

label{

    display:block;
    font-size:.9rem;
    font-weight:600;
    margin-bottom:8px;
    color:#374151;

}

input{

    width:100%;
    padding:14px 16px;
    border:1px solid #d1d5db;
    border-radius:10px;
    font-size:15px;
    transition:.25s;

}

input:focus{

    outline:none;
    border-color:#1976d2;
    box-shadow:0 0 0 4px rgba(25,118,210,.12);

}

input::placeholder{

    color:#9ca3af;

}

button{

    width:100%;
    border:none;
    padding:15px;
    border-radius:10px;
    background:#1976d2;
    color:white;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    transition:.25s;

}

button:hover{

    background:#1565c0;
    transform:translateY(-2px);

}

button:active{

    transform:translateY(0);

}

.forgot{

    text-align:center;
    margin-top:18px;

}

.forgot a{

    color:#1976d2;
    text-decoration:none;
    font-size:.9rem;
    font-weight:500;

}

.forgot a:hover{

    text-decoration:underline;

}

.status-box{

    margin-top:25px;
    background:#f8fafc;
    border:1px solid #e5e7eb;
    border-left:5px solid #1976d2;
    border-radius:10px;
    padding:15px;

}

.status-box h3{

    margin-bottom:10px;
    font-size:1rem;
    color:#1976d2;

}

#status{

    white-space:pre-wrap;
    word-break:break-word;
    font-size:.9rem;
    color:#374151;
    font-family:Consolas, monospace;

}

@media(max-width:480px){

    .login-card{

        padding:30px 24px;

    }

    .logo h1{

        font-size:1.7rem;

    }

}

</style>

</head>

<body>

<div class="login-container">

    <div class="login-card">

        <div class="logo">
            <h1>MediTrack</h1>
            <p>Smart Medicine Dispensing System</p>
        </div>

        <form id="loginForm">

            <div class="form-group">

                <label>Email Address</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required>

            </div>

            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required>

            </div>

            <button type="submit">
                Log In
            </button>

            <div class="forgot">
                <a href="forgot_password.html">
                    Forgot your password?
                </a>
            </div>

        </form>
        
        <div class="status-box">

            <h3>Status</h3>

            <pre id="status">Waiting...</pre>

        </div>

    </div>

</div>

<script type="module">

// ===============================
// Firebase SDK
// ===============================

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";

import {

    getAuth,
    signInWithEmailAndPassword

} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";

import {

    getDatabase,
    ref,
    get,
    update

} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-database.js";


// ===============================
// Firebase Configuration
// ===============================
const firebaseConfig = {
  apiKey: "AIzaSyBRm3dUt3HreTquM_Ba9JfYmZD2CLVV0Gc",
  authDomain: "meditrack-59cca.firebaseapp.com",
  databaseURL: "https://meditrack-59cca-default-rtdb.asia-southeast1.firebasedatabase.app/",
  projectId: "meditrack-59cca",
  storageBucket: "meditrack-59cca.firebasestorage.app",
  messagingSenderId: "656003988692",
  appId: "1:656003988692:web:badfe96b7d830837a4cf41"
};
// ===============================

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const database = getDatabase(app);

// ===============================

const form = document.getElementById("loginForm");

const status = document.getElementById("status");

// ===============================

form.addEventListener("submit", async function(e){

    e.preventDefault();

    status.textContent = "Signing in...";

    const email = document.getElementById("email").value.trim();

    const password = document.getElementById("password").value;

    try{

        // -----------------------
        // Authenticate
        // -----------------------

        const credential = await signInWithEmailAndPassword(

            auth,
            email,
            password

        );

        const uid = credential.user.uid;

        // -----------------------
        // Read profile
        // -----------------------

        const snapshot = await get(

            ref(database, "users/" + uid)

        );

        if(!snapshot.exists()){

            throw new Error("User profile not found.");

        }

        const user = snapshot.val();

        // First successful login after password setup
        if (
            user.accountStatus === "Pending" &&
            user.mustChangePassword === true
        ) {

            await update(ref(database, "users/" + uid), {

                accountStatus: "Active",
                mustChangePassword: false,
                activatedAt: new Date().toISOString()

            });

            // Update the local copy so the rest of the login flow sees the new values
            user.accountStatus = "Active";
            user.mustChangePassword = false;
        }
        
        // -----------------------
        // Check account status
        // -----------------------

        if(user.accountStatus !== "Active"){

            throw new Error("Your account is not yet active.");

        }

        // -----------------------
        // Redirect
        // -----------------------

        switch(user.userType){

            case "Admin":

                window.location.href =
                "../private/admin/home.html";

                break;

            case "Clerk":

                window.location.href =
                "../private/clerk/view_records.html";

                break;

            case "Head Nurse":

                window.location.href =
                "../private/headnurse/dashboard.html";

                break;

            case "Nurse":

                window.location.href =
                "../private/nurse/dashboard.html";

                break;

            case "Pharmacist":

                window.location.href =
                "../private/pharmacist/dashboard.html";

                break;

            default:

                throw new Error("Unknown user type.");

        }

    }
    catch(error){

        console.error(error);

        status.textContent =
            `Code: ${error.code}\n\nMessage: ${error.message}`;

    }

});

</script>
</body>
</html>
