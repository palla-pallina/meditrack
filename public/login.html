<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MediTrack Login</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="stylesheets/login.css">

</head>

<body>

<div class="login-container">

    <div class="login-card">

        <div class="logo">
            <h1>MediTrack</h1>
            <p>Smart Medicine Dispensing System</p>
        </div>

        <form id="loginForm">

            <div class="form-group">

                <label>Email Address</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required>

            </div>

            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required>

            </div>

            <button type="submit">
                Log In
            </button>

            <div class="forgot">
                <a href="forgot_password.html">
                    Forgot your password?
                </a>
            </div>

        </form>
        
        <div class="status-box">

            <pre id="status">Waiting...</pre>

        </div>

    </div>

</div>

<script type="module">

// ============================================================
// Activity Logging
// ============================================================

import {
    logLogin
} from "../private/js/activity_log.js";


// ============================================================
// Firebase SDK
// ============================================================

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";

import {
    getDatabase,
    ref,
    get,
    update
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-database.js";


// ============================================================
// Firebase Configuration
// ============================================================

const firebaseConfig = {
  apiKey: "AIzaSyBRm3dUt3HreTquM_Ba9JfYmZD2CLVV0Gc",
  authDomain: "meditrack-59cca.firebaseapp.com",
  databaseURL: "https://meditrack-59cca-default-rtdb.asia-southeast1.firebasedatabase.app/",
  projectId: "meditrack-59cca",
  storageBucket: "meditrack-59cca.firebasestorage.app",
  messagingSenderId: "656003988692",
  appId: "1:656003988692:web:badfe96b7d830837a4cf41"
};


// ============================================================
// Initialize Firebase
// ============================================================

const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const database =
    getDatabase(app);


// ============================================================
// DOM Elements
// ============================================================

const form =
    document.getElementById("loginForm");

const status =
    document.getElementById("status");


// ============================================================
// Login
// ============================================================

form.addEventListener(
    "submit",
    async function(e) {

        e.preventDefault();

        status.textContent =
            "Signing in...";


        const email =
            document
                .getElementById("email")
                .value
                .trim();


        const password =
            document
                .getElementById("password")
                .value;


        try {

            // ====================================================
            // Authenticate
            // ====================================================

            const credential =
                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            const uid =
                credential.user.uid;


            // ====================================================
            // Read User Profile
            // ====================================================

            const snapshot =
                await get(
                    ref(
                        database,
                        "users/" + uid
                    )
                );


            if (!snapshot.exists()) {

                throw new Error(
                    "User profile not found."
                );

            }


            const user =
                snapshot.val();


            // ====================================================
            // Activate Pending Account
            // ====================================================

            if (
                user.accountStatus === "Pending" &&
                user.mustChangePassword === true
            ) {

                await update(
                    ref(
                        database,
                        "users/" + uid
                    ),
                    {

                        accountStatus:
                            "Active",

                        mustChangePassword:
                            false,

                        activatedAt:
                            new Date().toISOString()

                    }
                );


                // Update local copy
                user.accountStatus =
                    "Active";

                user.mustChangePassword =
                    false;

            }


            // ====================================================
            // Check Account Status
            // ====================================================

            if (
                user.accountStatus !== "Active"
            ) {

                throw new Error(
                    "Your account is not yet active."
                );

            }


            // ====================================================
            // ACTIVITY LOG
            // ====================================================

            await logLogin(
                database,
                auth
            );


            // ====================================================
            // Redirect According to User Type
            // ====================================================

            switch (
                user.userType
            ) {

                case "Admin":

                    window.location.href =
                        "../private/admin/home.html";

                    break;


                case "Clerk":

                    window.location.href =
                        "../private/clerk/view_records.html";

                    break;


                case "Doctor":

                    window.location.href =
                        "../private/doctor/dashboard.html";

                    break;


                case "Head Nurse":

                    window.location.href =
                        "../private/headnurse/dashboard.html";

                    break;


                case "Nurse":

                    window.location.href =
                        "../private/nurse/dashboard.html";

                    break;


                case "Pharmacist":

                    window.location.href =
                        "../private/pharmacist/dashboard.html";

                    break;


                default:

                    throw new Error(
                        "Unknown user type."
                    );

            }

        }
        catch(error) {

            console.error(
                "Login error:",
                error
            );


            status.textContent =
                `Code: ${error.code || "UNKNOWN"}\n\n` +
                `Message: ${error.message}`;

        }

    }
);

</script>

</body>
</html>
