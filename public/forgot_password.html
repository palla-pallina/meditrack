<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MediTrack - Reset Password</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="stylesheets/forgot_password.css">

</head>

<body>

<div class="reset-container">

    <div class="reset-card">

        <div class="logo">

            <h1>MediTrack</h1>

            <p>Smart Medicine Dispensing System</p>

        </div>

        <div class="description">

            Enter your email address and we'll send you a password reset link if an account exists for it.

        </div>

        <form id="resetForm">

            <div class="form-group">

                <label>Email Address</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email address"
                    required>

            </div>

            <button type="submit">

                Send Reset Link

            </button>

        </form>

        <div class="back-link">

            <a href="login.html">
                ← Back to Login
            </a>

        </div>

        <div class="status-box">

            <h3>Status</h3>

            <pre id="status">Waiting...</pre>

        </div>

    </div>

</div>

<script type="module">

// Firebase SDK
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";

import {
    getAuth,
    sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";

// ----------------------------------
// Firebase Configuration
// ----------------------------------

const firebaseConfig = {
    apiKey: "AIzaSyBRm3dUt3HreTquM_Ba9JfYmZD2CLVV0Gc",
    authDomain: "meditrack-59cca.firebaseapp.com",
    databaseURL: "https://meditrack-59cca-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "meditrack-59cca",
    storageBucket: "meditrack-59cca.firebasestorage.app",
    messagingSenderId: "656003988692",
    appId: "1:656003988692:web:badfe96b7d830837a4cf41"
};

// ----------------------------------

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const form = document.getElementById("resetForm");

const status = document.getElementById("status");

form.addEventListener("submit", async function(e){

    e.preventDefault();

    status.textContent = "Sending reset email...";

    const email = document.getElementById("email").value.trim();

    try{

        await sendPasswordResetEmail(auth, email);

        status.textContent =
            "If an account exists for this email address, a password reset link has been sent.";

        form.reset();

    }
    catch(error){

        console.error(error);

        switch(error.code){

            case "auth/invalid-email":

                status.textContent =
                    "Please enter a valid email address.";

                break;

            case "auth/too-many-requests":

                status.textContent =
                    "Too many attempts. Please try again later.";

                break;

            default:

                status.textContent =
                    "Unable to send the password reset email. Please try again.";

        }

    }

});

</script>

</body>

</html>
