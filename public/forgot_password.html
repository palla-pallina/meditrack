<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MediTrack - Reset Password</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:'Inter',sans-serif;
    background:linear-gradient(135deg,#f3f8fc,#dceefd);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
    color:#2c3e50;

}

.reset-container{

    width:100%;
    max-width:450px;

}

.reset-card{

    background:#ffffff;
    border-radius:18px;
    padding:40px;
    box-shadow:0 15px 40px rgba(0,0,0,.08);

}

.logo{

    text-align:center;
    margin-bottom:25px;

}

.logo h1{

    color:#1976d2;
    font-size:2rem;
    margin-bottom:8px;

}

.logo p{

    color:#6b7280;
    font-size:.95rem;

}

.description{

    text-align:center;
    color:#6b7280;
    line-height:1.6;
    margin-bottom:30px;
    font-size:.95rem;

}

.form-group{

    margin-bottom:22px;

}

label{

    display:block;
    margin-bottom:8px;
    font-size:.9rem;
    font-weight:600;
    color:#374151;

}

input{

    width:100%;
    padding:14px 16px;
    border:1px solid #d1d5db;
    border-radius:10px;
    font-size:15px;
    transition:.25s;

}

input::placeholder{

    color:#9ca3af;

}

input:focus{

    outline:none;
    border-color:#1976d2;
    box-shadow:0 0 0 4px rgba(25,118,210,.12);

}

button{

    width:100%;
    border:none;
    border-radius:10px;
    padding:15px;
    background:#1976d2;
    color:white;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    transition:.25s;

}

button:hover{

    background:#1565c0;
    transform:translateY(-2px);

}

button:active{

    transform:translateY(0);

}

.back-link{

    text-align:center;
    margin-top:20px;

}

.back-link a{

    text-decoration:none;
    color:#1976d2;
    font-weight:500;

}

.back-link a:hover{

    text-decoration:underline;

}

.status-box{

    margin-top:28px;
    background:#f8fafc;
    border:1px solid #e5e7eb;
    border-left:5px solid #1976d2;
    border-radius:10px;
    padding:15px;

}

.status-box h3{

    color:#1976d2;
    margin-bottom:10px;
    font-size:1rem;

}

#status{

    white-space:pre-wrap;
    word-break:break-word;
    font-size:.9rem;
    color:#374151;
    font-family:Consolas, monospace;

}

@media(max-width:480px){

    .reset-card{

        padding:30px 24px;

    }

    .logo h1{

        font-size:1.7rem;

    }

}

</style>

</head>

<body>

<div class="reset-container">

    <div class="reset-card">

        <div class="logo">

            <h1>MediTrack</h1>

            <p>Smart Medicine Dispensing System</p>

        </div>

        <div class="description">

            Enter your email address and we'll send you a password reset link if an account exists for it.

        </div>

        <form id="resetForm">

            <div class="form-group">

                <label>Email Address</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email address"
                    required>

            </div>

            <button type="submit">

                Send Reset Link

            </button>

        </form>

        <div class="back-link">

            <a href="login.html">
                ← Back to Login
            </a>

        </div>

        <div class="status-box">

            <h3>Status</h3>

            <pre id="status">Waiting...</pre>

        </div>

    </div>

</div>

<script type="module">

// Firebase SDK
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";

import {
    getAuth,
    sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";

// ----------------------------------
// Firebase Configuration
// ----------------------------------

const firebaseConfig = {
    apiKey: "AIzaSyBRm3dUt3HreTquM_Ba9JfYmZD2CLVV0Gc",
    authDomain: "meditrack-59cca.firebaseapp.com",
    databaseURL: "https://meditrack-59cca-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "meditrack-59cca",
    storageBucket: "meditrack-59cca.firebasestorage.app",
    messagingSenderId: "656003988692",
    appId: "1:656003988692:web:badfe96b7d830837a4cf41"
};

// ----------------------------------

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const form = document.getElementById("resetForm");

const status = document.getElementById("status");

form.addEventListener("submit", async function(e){

    e.preventDefault();

    status.textContent = "Sending reset email...";

    const email = document.getElementById("email").value.trim();

    try{

        await sendPasswordResetEmail(auth, email);

        status.textContent =
            "If an account exists for this email address, a password reset link has been sent.";

        form.reset();

    }
    catch(error){

        console.error(error);

        switch(error.code){

            case "auth/invalid-email":

                status.textContent =
                    "Please enter a valid email address.";

                break;

            case "auth/too-many-requests":

                status.textContent =
                    "Too many attempts. Please try again later.";

                break;

            default:

                status.textContent =
                    "Unable to send the password reset email. Please try again.";

        }

    }

});

</script>

</body>

</html>
