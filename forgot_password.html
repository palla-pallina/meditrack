<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reset Password | MediTrack</title>

<link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
>
<link rel="icon" type="image/x-icon" href="draft.png">

<style>

    :root {
        --blue-950: #0b2947;
        --blue-900: #103f70;
        --blue-800: #155a9b;
        --blue-700: #1f70bd;
        --blue-600: #2f84d8;
        --blue-500: #4599e7;
        --blue-100: #eaf4ff;
        --blue-50: #f6faff;

        --white: #ffffff;
        --text: #20354a;
        --muted: #718295;

        --line: #dce8f3;
        --line-strong: #bfd4e8;

        --radius-lg: 24px;
        --radius-md: 14px;
        --radius-sm: 11px;

        --shadow-card:
            0 30px 70px rgba(25, 74, 116, 0.14),
            0 8px 25px rgba(25, 74, 116, 0.06);
    }


    /* =========================
       RESET
    ========================== */

    * {
        box-sizing: border-box;
    }


    html {
        min-height: 100%;
    }


    body {
        margin: 0;
        min-height: 100vh;

        display: grid;
        place-items: center;

        padding: 28px;

        font-family:
            "Inter",
            system-ui,
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            sans-serif;

        color: var(--text);

        background:
            radial-gradient(
                circle at 10% 10%,
                rgba(69, 153, 231, 0.18),
                transparent 28rem
            ),
            radial-gradient(
                circle at 90% 90%,
                rgba(31, 112, 189, 0.11),
                transparent 30rem
            ),
            linear-gradient(
                135deg,
                #ffffff 0%,
                #f7fbff 50%,
                #eef6fd 100%
            );

        position: relative;
        overflow-x: hidden;
    }


    /* Decorative background */

    body::before,
    body::after {
        content: "";

        position: fixed;

        border-radius: 50%;

        pointer-events: none;

        z-index: 0;
    }


    body::before {
        width: 280px;
        height: 280px;

        top: -150px;
        right: -90px;

        background:
            rgba(69, 153, 231, 0.07);
    }


    body::after {
        width: 220px;
        height: 220px;

        bottom: -120px;
        left: -80px;

        background:
            rgba(31, 112, 189, 0.06);
    }


    /* =========================
       CONTAINER
    ========================== */

    .reset-container {
        width: min(100%, 430px);

        position: relative;

        z-index: 1;
    }


    /* =========================
       CARD
    ========================== */

    .reset-card {
        padding: 38px;

        border:
            1px solid rgba(191, 212, 232, 0.75);

        border-radius: var(--radius-lg);

        background:
            rgba(255, 255, 255, 0.96);

        box-shadow:
            var(--shadow-card);

        backdrop-filter: blur(12px);
    }


    /* =========================
       LOGO
    ========================== */

    .logo {
        margin-bottom: 28px;

        text-align: center;
    }


    /*
        LOGO PLACEHOLDER

        Replace this with your actual logo later:

        <img
            src="assets/images/meditrack-logo.png"
            alt="MediTrack Logo"
            class="actual-logo"
        >
    */

    .logo-mark {
        width: 76px;
        height: 76px;

        margin: 0 auto 18px;

        display: grid;
        place-items: center;

        border-radius: 22px;

        background:
            linear-gradient(
                145deg,
                var(--blue-600),
                var(--blue-800)
            );

        box-shadow:
            0 12px 25px rgba(31, 112, 189, 0.24);

        position: relative;
    }


    /* Medical cross */

    .logo-mark::before,
    .logo-mark::after {
        content: "";

        position: absolute;

        background: #ffffff;

        border-radius: 4px;
    }


    .logo-mark::before {
        width: 34px;
        height: 10px;
    }


    .logo-mark::after {
        width: 10px;
        height: 34px;
    }


    .logo-mark span {
        position: absolute;

        width: 10px;
        height: 10px;

        border-radius: 50%;

        background:
            rgba(255, 255, 255, 0.20);
    }


    .logo h1 {
        margin: 0 0 7px;

        color: #0140c0;

        font-size:
            clamp(2rem, 5vw, 2.4rem);

        font-weight: 700;

        letter-spacing: -0.045em;
    }


    .logo p {
        margin: 0;

        color: var(--muted);

        font-size: 0.86rem;

        line-height: 1.5;
    }


    /* =========================
       DESCRIPTION
    ========================== */

    .description {
        margin-bottom: 25px;

        padding:
            13px 15px;

        border:
            1px solid var(--line);

        border-radius: 12px;

        background:
            var(--blue-50);

        color: var(--muted);

        font-size: 0.82rem;

        line-height: 1.6;

        text-align: center;
    }


    /* =========================
       FORM
    ========================== */

    .form-group {
        margin-bottom: 19px;
    }


    label {
        display: block;

        margin-bottom: 8px;

        color: var(--blue-950);

        font-size: 0.84rem;

        font-weight: 700;
    }


    .input-wrapper {
        position: relative;
    }


    input {
        width: 100%;

        min-height: 50px;

        padding:
            12px 14px;

        border:
            1px solid var(--line-strong);

        border-radius: var(--radius-sm);

        background:
            var(--white);

        color: var(--text);

        outline: none;

        font: inherit;

        font-size: 0.91rem;
    }


    input::placeholder {
        color: #9aabbb;
    }


    input:hover {
        border-color: #91bde2;
    }


    input:focus {
        border-color:
            var(--blue-600);

        box-shadow:
            0 0 0 4px
            rgba(47, 132, 216, 0.10);
    }


    /* =========================
       BUTTON
    ========================== */

    button {
        width: 100%;

        min-height: 50px;

        padding: 0 18px;

        border: 0;

        border-radius:
            var(--radius-sm);

        color:
            var(--white);

        background:
            linear-gradient(
                135deg,
                var(--blue-600),
                var(--blue-800)
            );

        box-shadow:
            0 10px 22px
            rgba(31, 112, 189, 0.20);

        font: inherit;

        font-size: 0.9rem;

        font-weight: 700;

        cursor: pointer;

        transition:
            color 160ms ease,
            background-color 160ms ease,
            border-color 160ms ease,
            box-shadow 160ms ease,
            transform 160ms ease;
    }


    button:hover {
        background:
            linear-gradient(
                135deg,
                var(--blue-700),
                var(--blue-900)
            );

        transform:
            translateY(-1px);

        box-shadow:
            0 13px 26px
            rgba(31, 112, 189, 0.25);
    }


    button:active {
        transform:
            translateY(0);
    }


    button:disabled {
        opacity: 0.65;

        cursor: wait;

        transform: none;
    }


    /* =========================
       BACK TO LOGIN
    ========================== */

    .back-link {
        margin-top: 20px;

        text-align: center;
    }


    .back-link a {
        color:
            var(--blue-700);

        font-size: 0.83rem;

        font-weight: 600;

        text-decoration: none;

        transition:
            color 160ms ease;
    }


    .back-link a:hover {
        color:
            var(--blue-900);

        text-decoration: underline;

        text-underline-offset: 3px;
    }


    /* =========================
       DIVIDER
    ========================== */

    .divider {
        display: flex;

        align-items: center;

        gap: 12px;

        margin:
            28px 0 20px;

        color: #9aabbb;

        font-size: 0.72rem;

        font-weight: 600;
    }


    .divider::before,
    .divider::after {
        content: "";

        height: 1px;

        flex: 1;

        background:
            var(--line);
    }


    /* =========================
       STATUS
    ========================== */

    .status-box {
        padding:
            13px 14px;

        border:
            1px solid var(--line);

        border-radius: 12px;

        background:
            #f9fcff;
    }


    .status-label {
        display: flex;

        align-items: center;

        gap: 7px;

        margin-bottom: 7px;

        color:
            var(--blue-800);

        font-size: 0.76rem;

        font-weight: 700;
    }


    .status-dot {
        width: 7px;
        height: 7px;

        border-radius: 50%;

        background:
            #8ca2b6;
    }


    #status {
        margin: 0;

        white-space: pre-wrap;

        word-break: break-word;

        color:
            var(--muted);

        font-family:
            ui-monospace,
            SFMono-Regular,
            Menlo,
            Consolas,
            monospace;

        font-size: 0.72rem;

        line-height: 1.5;
    }


    /* =========================
       FOOTER
    ========================== */

    .reset-footer {
        margin-top: 20px;

        text-align: center;

        color: #8b9bab;

        font-size: 0.72rem;

        line-height: 1.5;
    }


    /* =========================
       ACCESSIBILITY
    ========================== */

    a,
    button,
    input {
        transition:
            color 160ms ease,
            background-color 160ms ease,
            border-color 160ms ease,
            box-shadow 160ms ease,
            transform 160ms ease;
    }


    a:focus-visible,
    button:focus-visible,
    input:focus-visible {
        outline:
            3px solid
            rgba(47, 132, 216, 0.20);

        outline-offset: 3px;
    }


    /* =========================
       MOBILE
    ========================== */

    @media (max-width: 520px) {

        body {
            padding: 18px;
        }


        .reset-card {
            padding:
                28px 21px;

            border-radius:
                20px;
        }


        .logo {
            margin-bottom: 25px;
        }


        .logo-mark {
            width: 68px;
            height: 68px;

            border-radius: 19px;
        }


        .description {
            font-size: 0.8rem;
        }

    }

</style>

</head>

<body>

<div class="reset-container">

<div class="reset-card">


    <!-- =========================
         BRAND
    ========================== -->

    <div class="logo">

        <!--
            LOGO PLACEHOLDER

            Replace with your actual logo when ready.
        -->

            <img
                src="draft.png"
                alt="MediTrack Logo"
                class="actual-logo"
                style="height: 70px;"
            >

        <h1>MediTrack</h1>

        <p>
            Smart Medicine Dispensing System
        </p>

    </div>


    <!-- =========================
         DESCRIPTION
    ========================== -->

    <div class="description">
        Enter your email address and we'll send you
        a password reset link if an account exists
        for it.
    </div>


    <!-- =========================
         RESET FORM
    ========================== -->

    <form id="resetForm">

        <div class="form-group">

            <label for="email">
                Email Address
            </label>

            <div class="input-wrapper">

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email address"
                    autocomplete="email"
                    required
                >

            </div>

        </div>


        <button
            type="submit"
            id="resetButton"
        >
            Send Reset Link
        </button>

    </form>


    <!-- =========================
         BACK LINK
    ========================== -->

    <div class="back-link">

        <a href="index.html">
            ← Back to Login
        </a>

    </div>


    <!-- =========================
         STATUS
    ========================== -->

    <div class="divider">
        <span>ACCOUNT RECOVERY</span>
    </div>


    <div class="status-box">

        <div class="status-label">

            <span class="status-dot"></span>

            System Status

        </div>

        <pre id="status">Waiting for request...</pre>

    </div>

</div>


<div class="reset-footer">
    MediTrack © Ospital ng Sampaloc
</div>

</div>

<script type="module">

// ============================================================
// Firebase SDK
// ============================================================

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";

import {
    getAuth,
    sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";


// ============================================================
// Firebase Configuration
// ============================================================

const firebaseConfig = {
	/* firebase config */
};

// ============================================================
// Initialize Firebase
// ============================================================

const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);


// ============================================================
// DOM Elements
// ============================================================

const form =
    document.getElementById("resetForm");

const status =
    document.getElementById("status");

const resetButton =
    document.getElementById("resetButton");


// ============================================================
// Password Reset
// ============================================================

form.addEventListener(
    "submit",
    async function(e) {

        e.preventDefault();


        status.textContent =
            "Sending reset email...";

        resetButton.disabled = true;

        resetButton.textContent =
            "Sending...";


        const email =
            document
                .getElementById("email")
                .value
                .trim();


        try {

            await sendPasswordResetEmail(
                auth,
                email
            );


            status.textContent =
                "If an account exists for this email address, a password reset link has been sent.";


            form.reset();


            resetButton.textContent =
                "Reset Link Sent";


        }

        catch(error) {

            console.error(
                "Password reset error:",
                error
            );


            switch(error.code) {

                case "auth/invalid-email":

                    status.textContent =
                        "Please enter a valid email address.";

                    break;


                case "auth/too-many-requests":

                    status.textContent =
                        "Too many attempts. Please try again later.";

                    break;


                default:

                    status.textContent =
                        "Unable to send the password reset email. Please try again.";

            }


            resetButton.disabled = false;

            resetButton.textContent =
                "Send Reset Link";

        }

    }
);

</script>

</body>
</html>
