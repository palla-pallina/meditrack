/* =====================================================
   HTML ESCAPE
===================================================== */

function escapeHtml(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   SEND REFILL NOTIFICATION TO HEAD NURSE
===================================================== */

async function sendRefillNotification(
    compartment
){

    if(
        !compartment ||
        !compartment.refill_required
    ){

        throw new Error(
            "This dispenser does not currently require a refill."
        );

    }


    /* =================================================
       LOAD HEAD NURSES
    ================================================= */

    const usersSnapshot =
        await get(
            ref(
                db,
                "users"
            )
        );


    if(
        !usersSnapshot.exists()
    ){

        throw new Error(
            "No users were found."
        );

    }


    const headNurses = [];


    usersSnapshot.forEach(
        userSnapshot => {

            const user =
                userSnapshot.val() || {};


            const userType =
                String(
                    user.userType || ""
                )
                .trim()
                .toLowerCase();


            const accountStatus =
                String(
                    user.accountStatus || ""
                )
                .trim()
                .toLowerCase();


            /*
               Only notify active Head Nurse accounts.
            */

            if(
                userType === "head nurse" &&
                (
                    !accountStatus ||
                    accountStatus === "active"
                )
            ){

                headNurses.push({

                    uid:
                        userSnapshot.key,

                    name:
                        [
                            user.firstName || "",
                            user.lastName || ""
                        ]
                        .join(" ")
                        .trim() ||
                        user.name ||
                        "Head Nurse"

                });

            }

        }
    );


    if(
        headNurses.length === 0
    ){

        throw new Error(
            "No active Head Nurse accounts were found."
        );

    }


    /* =================================================
       CREATE NOTIFICATION
    ================================================= */

    const notificationId =
        "REFILL-" +
        compartment.compartment_id +
        "-" +
        Date.now();


    const now =
        new Date().toISOString();


    const requiredSlots =
        Number(
            compartment.required_slots || 0
        );


    const slotsUsed =
        Number(
            compartment.slots_used || 0
        );


    const refillInterval =
        Number(
            compartment.refill_interval_days || 0
        );


    const notification = {

        notification_id:
            notificationId,

        type:
            "dispenser_refill",

        title:
            "Dispenser Refill Required",

        message:
            `${compartment.compartment_name || compartment.compartment_id} requires a refill for ${compartment.patient_name || "the assigned patient"}.`,

        dispenser_unit:
            compartment.dispenser_unit ||
            DISPENSER_UNIT,

        compartment_id:
            compartment.compartment_id,

        compartment_name:
            compartment.compartment_name ||
            compartment.compartment_id,

        patient_id:
            compartment.patient_id ||
            "",

        patient_name:
            compartment.patient_name ||
            "",

        ward:
            compartment.ward ||
            "",

        room:
            compartment.room ||
            "",

        required_slots:
            requiredSlots,

        slots_used:
            slotsUsed,

        refill_interval_days:
            refillInterval,

        status:
            "Unread",

        created_at:
            now,

        updated_at:
            now

    };


    /* =================================================
       SAVE NOTIFICATION FOR EACH HEAD NURSE
    ================================================= */

    const updates = {};


    headNurses.forEach(
        headNurse => {

            updates[
                `notifications/${headNurse.uid}/${notificationId}`
            ] = {

                ...notification,

                recipient_uid:
                    headNurse.uid,

                recipient_name:
                    headNurse.name

            };

        }
    );


    await update(
        ref(db),
        updates
    );


    /* =================================================
       MARK REFILL REQUEST
       ON THE CAROUSEL
    ================================================= */

    await update(
        ref(
            db,
            "dispenser_unit/" +
            DISPENSER_UNIT +
            "/" +
            compartment.compartment_id
        ),
        {

            refill_notification_sent:
                true,

            refill_notification_id:
                notificationId,

            refill_notification_status:
                "Pending",

            refill_notification_sent_at:
                now

        }
    );


    return notificationId;

}


/* =====================================================
   STATUS
===================================================== */

function getStatus(
    compartment
){

    const inventory =
        Number(
            compartment.inventory_amount || 0
        );


    /*
       Use the stored status if available.
    */

    if(
        compartment.status
    ){

        return compartment.status;

    }


    if(
        inventory === 0
    ){

        return "Empty";

    }


    if(
        inventory <= 2
    ){

        return "Low Stock";

    }


    if(
        inventory <= 7
    ){

        return "Normal";

    }


    if(
        inventory <= 9
    ){

        return "Nearly Full";

    }


    return "Full";

}



/* =====================================================
   STATUS BADGE
===================================================== */

function getStatusBadge(
    status
){

    const normalized =
        String(
            status || ""
        )
        .toLowerCase();


    let className =
        "badge-normal";


    if(
        normalized === "empty"
    ){

        className =
            "badge-empty";

    }
    else if(
        normalized.includes(
            "low"
        )
    ){

        className =
            "badge-low";

    }
    else if(
        normalized.includes(
            "refill"
        )
    ){

        className =
            "badge-refill";

    }
    else if(
        normalized === "full"
    ){

        className =
            "badge-full";

    }


    return `

        <span class="badge ${className}">

            ${escapeHtml(status)}

        </span>

    `;

}



/* =====================================================
   GET SLOT COUNT
===================================================== */

function getSlotCount(
    compartment
){

    if(
        !compartment.slots
    ){

        return 0;

    }


    return Object.keys(
        compartment.slots
    ).length;

}



/* =====================================================
   GET MEDICATIONS
===================================================== */

function getMedications(
    compartment
){

    const medications = {};


    /*
       Read medications from physical slots.
    */

    if(
        compartment.slots
    ){

        Object.values(
            compartment.slots
        )
        .forEach(
            slot => {

                if(
                    !slot.medicines
                ){

                    return;

                }


                Object.values(
                    slot.medicines
                )
                .forEach(
                    medicine => {

                        const id =
                            medicine.medication_id ||
                            medicine.medication_name ||
                            Math.random();


                        if(
                            !medications[id]
                        ){

                            medications[id] = {

                                medication_name:
                                    medicine.medication_name ||
                                    "Unknown",

                                brand_name:
                                    medicine.brand_name ||
                                    "",

                                dosage:
                                    medicine.dosage ||
                                    "",

                                form:
                                    medicine.form ||
                                    ""

                            };

                        }

                    }
                );

            }
        );

    }


    /*
       Backward compatibility with older
       compartment records.
    */

    if(
        Object.keys(
            medications
        ).length === 0 &&
        compartment.medication_name
    ){

        medications[
            compartment.medication_id ||
            compartment.medication_name
        ] = {

            medication_name:
                compartment.medication_name,

            brand_name:
                compartment.brand_name ||
                "",

            dosage:
                compartment.dosage ||
                "",

            form:
                compartment.form ||
                ""

        };

    }


    return Object.values(
        medications
    );

}



/* =====================================================
   GET MEDICATION HTML
===================================================== */

function getMedicationHtml(
    compartment
){

    const medications =
        getMedications(
            compartment
        );


    if(
        medications.length === 0
    ){

        return "-";

    }


    return `

        <ul class="medication-list">

            ${
                medications
                .map(
                    medicine => `

                        <li>

                            <strong>

                                ${escapeHtml(
                                    medicine.medication_name
                                )}

                            </strong>

                            ${
                                medicine.dosage
                                ?
                                ` - ${escapeHtml(
                                    medicine.dosage
                                )}`
                                :
                                ""
                            }

                            ${
                                medicine.brand_name
                                ?
                                `<br>
                                <small>
                                    ${escapeHtml(
                                        medicine.brand_name
                                    )}
                                </small>`
                                :
                                ""
                            }

                        </li>

                    `
                )
                .join("")
            }

        </ul>

    `;

}



/* =====================================================
   GET WARD / ROOM
===================================================== */

function getWardRoom(
    compartment
){

    let ward =
        compartment.ward ||
        "";


    let room =
        compartment.room ||
        "";


    /*
       If ward / room aren't stored directly,
       inspect the first slot medication.
    */

    if(
        (
            !ward ||
            !room
        ) &&
        compartment.slots
    ){

        const slots =
            Object.values(
                compartment.slots
            );


        for(
            const slot of slots
        ){

            if(
                slot.medicines
            ){

                const medicines =
                    Object.values(
                        slot.medicines
                    );


                if(
                    medicines.length > 0
                ){

                    /*
                       Ward and room normally live
                       on prescription_items rather
                       than the medicine stored in
                       the carousel.

                       They are therefore not assumed
                       here.
                    */

                    break;

                }

            }

        }

    }


    if(
        !ward &&
        !room
    ){

        return "-";

    }


    if(
        ward &&
        room
    ){

        return `

            ${escapeHtml(ward)}

            <br>

            <small>
                Room ${escapeHtml(room)}
            </small>

        `;

    }


    if(ward){

        return escapeHtml(
            ward
        );

    }


    return `Room ${
        escapeHtml(room)
    }`;

}



/* =====================================================
   GET SLOT PROGRESS
===================================================== */

function getSlotProgress(
    compartment
){

    const slots =
        getSlotCount(
            compartment
        );


    const percentage =
        Math.min(
            100,
            (
                slots /
                MAX_SLOTS
            ) * 100
        );


    return `

        <strong>

            ${slots}/${MAX_SLOTS}

        </strong>


        <div class="slot-progress">

            <div
                class="slot-progress-bar"
                style="width:${percentage}%">

            </div>

        </div>

    `;

}

/* =====================================================
   REFILL INFORMATION
===================================================== */

function getRefillHtml(
    compartment
){

    const refillRequired =
        compartment.refill_required === true;


    if(
        !refillRequired
    ){

        return `

            <span class="badge badge-normal">

                Not Required

            </span>

        `;

    }


    const interval =
        compartment.refill_interval_days;


    const nextDate =
        compartment.next_refill_date;


    return `

        <span class="badge badge-refill">

            Required

        </span>


        ${
            interval
            ?

            `

                <br>

                <small>

                    Every
                    ${escapeHtml(interval)}
                    day(s)

                </small>

            `

            :

            ""

        }


        ${
            nextDate

            ?

            `

                <br>

                <small>

                    Next:
                    ${escapeHtml(nextDate)}

                </small>

            `

            :

            ""

        }

    `;

}
/* =====================================================
   LOAD CAROUSELS
===================================================== */

async function loadCompartments(){

    table.innerHTML = "";

    carouselData = [];

    try{

        const snapshot =
            await get(
                ref(
                    db,
                    "dispenser_unit/" +
                    DISPENSER_UNIT
                )
            );


        /*
           Always display Carousel 1-5.
        */

        for(
            let i = 1;
            i <= MAX_CAROUSELS;
            i++
        ){

            const id =
                "MD-C" +
                String(i)
                    .padStart(
                        2,
                        "0"
                    );


            let compartment = {

                dispenser_unit:
                    DISPENSER_UNIT,

                compartment_id:
                    id,

                compartment_name:
                    "Carousel " + i,

                patient_id:
                    null,

                patient_name:
                    null,

                inventory_amount:
                    0,

                maximum_capacity:
                    MAX_SLOTS,

                status:
                    "Empty"

            };


            if(
                snapshot.exists()
            ){

                const child =
                    snapshot.child(id);


                if(
                    child.exists()
                ){

                    compartment = {

                        ...compartment,

                        ...child.val()

                    };

                }

            }


            carouselData.push(
                compartment
            );

        }


        /*
           Display the current dispenser
           information first.
        */

        updateSummary();

        renderTable(
            carouselData
        );


        /*
           Automatically send refill requests
           for any carousel that requires a refill.
           
           This function will NOT send another
           notification if the carousel already
           has a Pending refill request.
        */

        await autoRequestRefills();


        /*
           Refresh the table after automatic
           refill requests have been sent.
        */

        await loadCompartmentsWithoutAutoRefill();


        /*
           Only update the message element if
           it exists.
        */

        if(message){

            message.className =
                "message success";


            message.textContent =
                "Dispenser information loaded successfully.";

        }

    }
    catch(error){

        console.error(
            "Error loading dispenser information:",
            error
        );


        if(message){

            message.className =
                "message error";


            message.textContent =
                "Failed to load dispenser information: " +
                error.message;

        }

    }

}

/* =====================================================
   SUMMARY
===================================================== */

function updateSummary(){

    const total =
        MAX_CAROUSELS;


    const assigned =
        carouselData.filter(
            carousel =>
                carousel.patient_id
        ).length;


    const available =
        total -
        assigned;


    const refill =
        carouselData.filter(
            carousel =>
                carousel.refill_required === true
        ).length;


    const empty =
        carouselData.filter(
            carousel =>
                Number(
                    carousel.inventory_amount || 0
                ) === 0
        ).length;


    totalCarousels.textContent =
        total;


    assignedCarousels.textContent =
        assigned;


    availableCarousels.textContent =
        available;


    refillCarousels.textContent =
        refill;


    emptyCarousels.textContent =
        empty;

}



/* =====================================================
   RENDER TABLE
===================================================== */

function renderTable(
    data
){

    table.innerHTML =
        "";


    if(
        data.length === 0
    ){

        table.innerHTML = `

            <tr>

                <td colspan="10">

                    No carousels found.

                </td>

            </tr>

        `;

        return;

    }


    data.forEach(
        compartment => {

            const row =
                document.createElement(
                    "tr"
                );


            const assigned =
                Boolean(
                    compartment.patient_id
                );


            const status =
                getStatus(
                    compartment
                );


            const medications =
                getMedications(
                    compartment
                );


            const medicationSearchText =
                medications
                .map(
                    medicine =>
                        [

                            medicine.medication_name,

                            medicine.brand_name,

                            medicine.dosage,

                            medicine.form

                        ]
                        .join(" ")
                )
                .join(" ");


            row.dataset.search =
                [

                    compartment.dispenser_unit,

                    compartment.compartment_id,

                    compartment.compartment_name,

                    compartment.patient_name,

                    compartment.patient_id,

                    compartment.ward,

                    compartment.room,

                    medicationSearchText,

                    status

                ]
                .join(" ")
                .toLowerCase();


            row.innerHTML = `

                <td>

                    ${escapeHtml(
                        compartment.dispenser_unit
                    )}

                </td>


                <td>

                    <strong>

                        ${escapeHtml(
                            compartment.compartment_name ||
                            compartment.compartment_id
                        )}

                    </strong>

                    <br>

                    <small>

                        ${escapeHtml(
                            compartment.compartment_id
                        )}

                    </small>

                </td>


                <td>

                    ${
                        assigned

                        ?

                        `

                            <div class="patient-name">

                                ${escapeHtml(
                                    compartment.patient_name ||
                                    "Unknown Patient"
                                )}

                            </div>

                            <small>

                                ID:
                                ${escapeHtml(
                                    compartment.patient_id
                                )}

                            </small>

                        `

                        :

                        `

                            <span class="badge badge-normal">

                                Available

                            </span>

                        `

                    }

                </td>


                <td>

                    ${
                        assigned

                        ?

                        getWardRoom(
                            compartment
                        )

                        :

                        "-"

                    }

                </td>


                <td>

                    ${
                        assigned

                        ?

                        getMedicationHtml(
                            compartment
                        )

                        :

                        "-"

                    }

                </td>


                <td>

                    ${
                        assigned

                        ?

                        getSlotProgress(
                            compartment
                        )

                        :

                        `

                            <strong>
                                0/${MAX_SLOTS}
                            </strong>

                        `

                    }

                </td>


                <td>

                    ${
                        assigned

                        ?

                        getRefillHtml(
                            compartment
                        )

                        :

                        "-"

                    }

                </td>


                <td>

                    <strong>

                        ${Number(
                            compartment.inventory_amount || 0
                        )}

                        /

                        ${MAX_SLOTS}

                    </strong>

                </td>


                <td>

                    ${getStatusBadge(
                        status
                    )}

                </td>


                <td class="actions-cell">

                    <button
                        type="button"
                        class="action-button view-button"
                        onclick="viewCompartment(
                            '${escapeHtml(
                                compartment.dispenser_unit
                            )}',
                            '${escapeHtml(
                                compartment.compartment_id
                            )}'
                        )">

                        View

                    </button>


                    ${
                        compartment.refill_required === true

                        ?

                        `

                            <button
                                type="button"
                                class="action-button refill-button"
                                onclick="viewRefill(
                                    '${escapeHtml(
                                        compartment.dispenser_unit
                                    )}',
                                    '${escapeHtml(
                                        compartment.compartment_id
                                    )}'
                                )">

                                Refill

                            </button>

                        `

                        :

                        ""

                    }


                    <button
                        type="button"
                        class="action-button delete-button"
                        onclick="deleteCompartment(
                            '${escapeHtml(
                                compartment.dispenser_unit
                            )}',
                            '${escapeHtml(
                                compartment.compartment_id
                            )}'
                        )">

                        Delete

                    </button>

                </td>

            `;


            table.appendChild(
                row
            );

        }
    );


    applySearch();

}



/* =====================================================
   SEARCH
===================================================== */

function applySearch(){

    const filter =
        searchInput.value
            .trim()
            .toLowerCase();


    const rows =
        table.getElementsByTagName(
            "tr"
        );


    for(
        const row of rows
    ){

        const searchText =
            row.dataset.search ||
            row.innerText ||
            "";


        row.style.display =

            searchText
                .toLowerCase()
                .includes(
                    filter
                )

            ?

            ""

            :

            "none";

    }

}


searchBtn.addEventListener(
    "click",
    applySearch
);

searchInput.addEventListener(
    "input",
    applySearch
);


searchInput.addEventListener(
    "keyup",
    event => {

        if(
            event.key === "Enter"
        ){

            applySearch();

        }

    }
);

){

};

/* =====================================================
   REQUEST REFILL
===================================================== */

async function autoRequestRefills() {

    const requiredCarousels = carouselData.filter(compartment =>
        compartment.refill_required === true &&
        compartment.refill_notification_status !== "Pending"
    );

    if (requiredCarousels.length === 0) {
        return;
    }

    console.log(
        `Found ${requiredCarousels.length} dispenser carousel(s) requiring refill.`
    );

    for (const compartment of requiredCarousels) {

        try {

            console.log(
                `Automatically requesting refill for ${compartment.compartment_id}...`
            );

            await sendRefillNotification(compartment);

            console.log(
                `Refill notification sent for ${compartment.compartment_id}.`
            );

        } catch (error) {

            console.error(
                `Failed to automatically request refill for ${compartment.compartment_id}:`,
                error
            );

        }
    }

}

async function loadCompartmentsWithoutAutoRefill(){

    try{

        const snapshot =
            await get(
                ref(
                    db,
                    `dispenser_unit/${DISPENSER_UNIT}`
                )
            );


        const data =
            snapshot.exists()
                ? snapshot.val()
                : {};


        carouselData = [];


        for(
            let i = 1;
            i <= MAX_CAROUSELS;
            i++
        ){

            const carouselId =
                `MD-C0${i}`;


            const stored =
                data[carouselId] || {};


            carouselData.push({

                dispenser_unit:
                    DISPENSER_UNIT,

                compartment_id:
                    carouselId,

                compartment_name:
                    `Carousel ${i}`,

                patient_id:
                    null,

                patient_name:
                    null,

                inventory_amount:
                    0,

                maximum_capacity:
                    MAX_SLOTS,

                status:
                    "Empty",

                ...stored

            });

        }


        updateSummary();


        /*
           IMPORTANT:
           Pass carouselData to renderTable().
        */

        renderTable(
            carouselData
        );

    }
    catch(error){

        console.error(
            "Error refreshing dispenser information:",
            error
        );

    }

}


/* =====================================================
   DELETE
===================================================== */

window.deleteCompartment =
async function(
    unit,
    id
){

    const compartment =
        carouselData.find(
            item =>
                item.compartment_id === id
        );


    if(!compartment){

        alert(
            "Carousel not found."
        );

        return;

    }


    let confirmationMessage =

        "Delete " +

        (
            compartment.compartment_name ||
            id
        ) +

        "?";


    if(
        compartment.patient_id
    ){

        confirmationMessage +=

            "\n\nPatient: " +

            (
                compartment.patient_name ||
                "Unknown Patient"
            ) +

            "\n\n" +

            "This will remove the patient's " +

            "carousel assignment.";

    }


    if(
        !confirm(
            confirmationMessage
        )
    ){

        return;

    }


    try{

        /*
           Delete the entire carousel.
        */

        await remove(

            ref(

                db,

                "dispenser_unit/" +

                unit +

                "/" +

                id

            )

        );


        /*
           Remove carousel assignment from
           prescription items.
        */

        if(
            compartment.patient_id
        ){

            const updates = {};


            const prescriptionSnapshot =
                await get(
                    ref(
                        db,
                        "prescription_items"
                    )
                );


            if(
                prescriptionSnapshot.exists()
            ){

                prescriptionSnapshot.forEach(
                    child => {

                        const item =
                            child.val();


                        if(
                            item.patient_id ===
                            compartment.patient_id
                        ){

                            updates[
                                "prescription_items/" +
                                child.key +
                                "/carousel_id"
                            ] =
                                null;


                            updates[
                                "prescription_items/" +
                                child.key +
                                "/carousel_name"
                            ] =
                                null;

                        }

                    }
                );

            }


            if(
                Object.keys(
                    updates
                ).length > 0
            ){

                /*
                   Firebase update cannot reliably
                   use undefined. null removes
                   the values.
                */


                await update(
                    ref(db),
                    updates
                );

            }

        }


        alert(
            "Carousel deleted successfully."
        );


        await loadCompartments();

    }
    catch(error){

        console.error(
            error
        );


        alert(

            "Failed to delete carousel:\n\n" +

            error.message

        );

    }

};



/* =====================================================
   INITIALIZE
===================================================== */

loadCompartments();


</script>
