async function loadPatients() {

    patients = [];

    const snapshot = await get(
        ref(database, "patients")
    );

    if (!snapshot.exists()) {
        return;
    }

    snapshot.forEach(child => {

        const p = child.val();

        // Exclude discharged patients
        if (
            String(p.dischargeStatus || "")
                .trim()
                .toLowerCase() === "discharged"
        ) {
            return;
        }

        patients.push({
            id: child.key,
            ...p
        });

    });
}

async function loadDoctors() {

    physicians = [];

    const snapshot = await get(
        ref(database, "users")
    );

    if (!snapshot.exists()) {
        return;
    }

    snapshot.forEach(child => {

        const user = child.val();

        // Only Doctors
        if (user.userType !== "Doctor") {
            return;
        }

        // Exclude disabled doctor accounts
        if (
            String(user.accountStatus || "")
                .trim()
                .toLowerCase() === "disabled"
        ) {
            return;
        }

        physicians.push({
            id: child.key,
            ...user
        });

    });
}

function renderPatientResults(keyword = "") {

    const searchTerm =
        keyword
            .toLowerCase()
            .trim();

    patientResults.innerHTML = "";

    const matches =
        patients.filter(patient => {

            const name =
                String(patient.fullName || "")
                    .toLowerCase();

            return name.includes(searchTerm);

        });


    if (matches.length === 0) {

        patientResults.innerHTML = `
            <div style="padding:10px;">
                No patients found.
            </div>
        `;

        patientResults.style.display = "block";

        return;
    }


    matches.forEach(patient => {

        const div =
            document.createElement("div");

        div.style.padding = "10px";
        div.style.cursor = "pointer";
        div.style.borderBottom = "1px solid #eee";

        div.innerHTML = `
            <strong>
                ${patient.fullName || "Unnamed Patient"}
            </strong>
        `;


        div.addEventListener("click", function () {

            patientSearch.value =
                patient.fullName || "";

            patientHidden.value =
                patient.id;

            patientResults.style.display =
                "none";

        });


        patientResults.appendChild(div);

    });


    patientResults.style.display =
        "block";
}

);

/* =====================================================
   FORMAT ADMINISTRATION TIME
===================================================== */

function formatAdministrationTime(time){

    if(!time){
        return "-";
    }

    const value =
        String(time).trim();

    const match =
        value.match(
            /^(\d{1,2}):(\d{2})$/
        );

    if(!match){
        return value;
    }

    let hours =
        parseInt(
            match[1],
            10
        );

    const minutes =
        match[2];

    if(
        hours < 0 ||
        hours > 23
    ){
        return value;
    }

    const period =
        hours >= 12
            ? "PM"
            : "AM";

    const hour12 =
        hours % 12 || 12;

    return `${hour12}:${minutes} ${period}`;
}

        }
    );

}

/* =====================================================
   DUPLICATE PRESCRIPTION CHECK
===================================================== */

async function checkDuplicatePrescriptionItems(patientId, newItems) {

    const itemsSnapshot = await get(
        ref(database, "prescription_items")
    );

    if (!itemsSnapshot.exists()) {
        return [];
    }

    const duplicates = [];

    for (const newItem of newItems) {

        if (
            !newItem.medication_id ||
            !newItem.start_date ||
            !newItem.end_date
        ) {
            continue;
        }

        const newStart = new Date(
            `${newItem.start_date}T00:00:00`
        );

        const newEnd = new Date(
            `${newItem.end_date}T23:59:59`
        );

        itemsSnapshot.forEach(child => {

            const existingItem = child.val();

            // Same patient
            if (existingItem.patient_id !== patientId) {
                return;
            }

            // Same medication
            if (
                existingItem.medication_id !==
                newItem.medication_id
            ) {
                return;
            }

            // Same dosage
            if (
                String(existingItem.dosage || "")
                    .trim()
                    .toLowerCase() !==
                String(newItem.dosage || "")
                    .trim()
                    .toLowerCase()
            ) {
                return;
            }

            // Same route
            if (
                String(existingItem.route || "")
                    .trim()
                    .toLowerCase() !==
                String(newItem.route || "")
                    .trim()
                    .toLowerCase()
            ) {
                return;
            }

            if (
                !existingItem.start_date ||
                !existingItem.end_date
            ) {
                return;
            }

            const existingStart = new Date(
                `${existingItem.start_date}T00:00:00`
            );

            const existingEnd = new Date(
                `${existingItem.end_date}T23:59:59`
            );

            // Date ranges overlap
            const datesOverlap =
                newStart <= existingEnd &&
                newEnd >= existingStart;

            if (datesOverlap) {

                duplicates.push({
                    medication:
                        existingItem.medication_name ||
                        newItem.medication_name,

                    dosage:
                        existingItem.dosage ||
                        newItem.dosage,

                    route:
                        existingItem.route ||
                        newItem.route,

                    startDate:
                        existingItem.start_date,

                    endDate:
                        existingItem.end_date
                });
            }
        });
    }

    return duplicates;
}

    "submit",
    async function (e) {

        e.preventDefault();


        // =====================================================
        // Validate Medications
        // =====================================================

        if (
            prescriptionItems.length === 0
        ) {

            alert(
                "Please add at least one medication."
            );

            return;

        }


        // =====================================================
        // Check Authenticated User
        // =====================================================

        if (!currentUser) {

            alert(
                "Your session has expired. Please log in again."
            );

            return;

        }


        // =====================================================
        // Get Patient
        // =====================================================

        const patientSelect =
            document.getElementById("patient");

        const patientId =
            patientSelect.value;

        if (!patientId) {

            alert(
                "Please select a patient from the search results."
            );

            patientSearch.focus();

            return;
        }

        // =====================================================
        // Check For Duplicate Prescriptions
        // =====================================================

        try {

            const duplicates =
                await checkDuplicatePrescriptionItems(
                    patientId,
                    prescriptionItems
                );


            if (duplicates.length > 0) {

                const duplicateMessage =
                    duplicates
                        .map(item =>
                            `${item.medication} ${item.dosage} (${item.route})\n` +
                            `Existing prescription: ${item.startDate} to ${item.endDate}`
                        )
                        .join("\n\n");


                alert(
                    "Duplicate prescription detected.\n\n" +
                    duplicateMessage +
                    "\n\n" +
                    "The prescription was not saved."
                );


                return;

            }

        }
        catch (error) {

            console.error(
                "Duplicate prescription check failed:",
                error
            );


            alert(
                "Unable to verify existing prescriptions. " +
                "The prescription was not saved."
            );


            return;

        }


        // =====================================================
        // Build Payload
        // =====================================================

        const physicianSelect =
            document.getElementById("physician");

        const physicianUid =
            physicianSelect.value;

        if (!physicianUid) {

            alert(
                "Please select a prescribing physician from the search results."
            );

            physicianSearch.focus();

            return;
        }


        const physicianName = physicianSearch.value.trim();


        const patientName = patientSearch.value.trim();


        const payload = {

            patient_id:
                patientId,

            physician_uid:
                physicianUid,

            physician_name:
                physicianName,

            notes:
                document
                    .getElementById("notes")
                    .value,

            items:
                prescriptionItems

        };


        const statusElement =
            document.getElementById("status");


        statusElement.textContent =
            "Saving prescription...";


        try {

            // =================================================
            // Save Prescription Through PHP
            // =================================================

            const response =
                await fetch(
                    "add_prescription.php",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(
                                payload
                            )
                    }
                );


            // =================================================
            // Read PHP Response
            // =================================================

            const result =
                await response.json();


            console.log(
                "Prescription response:",
                result
            );


            // =================================================
            // Validate Save
            // =================================================

            if (
                !response.ok ||
                result.success !== true
            ) {

                throw new Error(
                    result.message ||
                    "Failed to save prescription."
                );

            }


            // =================================================
            // Get Prescription ID
            // =================================================

            const prescriptionId =
                result.prescription_id;


            // =================================================
            // Prepare Medication Details For Log
            // =================================================

            const medicationsForLog =
                prescriptionItems.map(
                    item => ({

                        medicationId:
                            item.medication_id,

                        medicationName:
                            item.medication_name,

                        dosage:
                            item.dosage,

                        route:
                            item.route,

                        frequency:
                            item.frequency,

                        administrationTimes:
                            item.administration_times,

                        startDate:
                            item.start_date,

                        endDate:
                            item.end_date

                    })
                );


            // =================================================
            // Log Prescription Creation
            // =================================================

            try {

                await logPrescriptionCreated(
                    database,
                    auth,
                    {

                        prescriptionId:
                            prescriptionId,

                        patientId:
                            patientId,

                        patientName:
                            patientName,

                        physicianUid:
                            physicianUid,

                        physicianName:
                            physicianName,

                        medications:
                            medicationsForLog

                    }
                );

            }
            catch (logError) {

                console.error(
                    "Prescription activity logging failed:",
                    logError
                );

            }


            // =================================================
            // Redirect
            // =================================================

            window.location.href =
                "view_prescriptions.html";

        }
        catch (error) {

            console.error(
                "Error saving prescription:",
                error
            );


            statusElement.textContent =
                "Failed to save prescription.\n\n" +
                error.message;


            alert(
                error.message
            );

        }

    }
);
</script>

</body>
</html>
