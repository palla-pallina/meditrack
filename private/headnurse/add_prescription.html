<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>New Prescription</title>
</head>
<body>

<a href="dashboard.html">Back to Dashboard</a>

<h2>Create Prescription</h2>

<form id="prescriptionForm">

<h3>Prescription Information</h3>

<label>Patient</label><br>
<select id="patient" required></select>

<br><br>

<label>Prescribing Physician</label><br>
<input
type="text"
id="physician"
required>

<br><br>

<label>General Notes</label><br>
<textarea id="notes"></textarea>

<hr>

<h3>Add Medication</h3>

<label>Medication</label><br>
<select id="medication"></select>

<br><br>

<label>Dosage</label><br>
<input type="text" id="dosage">

<br><br>

<label>Route</label><br>
<select id="route">

<option value="oral">Oral</option>
<option value="iv">IV</option>
<option value="im">IM</option>
<option value="subcutaneous">Subcutaneous</option>
<option value="topical">Topical</option>
<option value="inhalation">Inhalation</option>

</select>

<br><br>

<label>Frequency</label><br>
<input
type="text"
id="frequency"
placeholder="Every 8 hours">

<br><br>

<label>Administration Times</label><br>

<input type="time" id="time">

<button
type="button"
id="addTime">

Add Time

</button>

<ul id="timeList"></ul>

<br>

<label>Start Date</label><br>
<input type="date" id="startDate">

<br><br>

<label>End Date</label><br>
<input type="date" id="endDate">

<br><br>

<button
type="button"
id="addMedication">

Add Medication

</button>

<hr>

<h3>Medication List</h3>

<table border="1">

<thead>

<tr>

<th>Medication</th>

<th>Dosage</th>

<th>Frequency</th>

<th>Times</th>

<th>Action</th>

</tr>

</thead>

<tbody id="medicationTable">

</tbody>

</table>

<br>

<button type="submit">

Save Prescription

</button>

</form>

<pre id="status"></pre>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";

import {

getDatabase,
ref,
get

}
from "https://www.gstatic.com/firebasejs/10.13.2/firebase-database.js";

const firebaseConfig={
    apiKey: "AIzaSyBRm3dUt3HreTquM_Ba9JfYmZD2CLVV0Gc",
    authDomain: "meditrack-59cca.firebaseapp.com",
    databaseURL: "https://meditrack-59cca-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "meditrack-59cca",
    storageBucket: "meditrack-59cca.firebasestorage.app",
    messagingSenderId: "656003988692",
    appId: "1:656003988692:web:badfe96b7d830837a4cf41"
};

const app=initializeApp(firebaseConfig);

const database=getDatabase(app);

let medications=[];

let selectedTimes=[];

let prescriptionItems=[];

loadPatients();

loadMedications();

async function loadPatients(){

const snapshot=

await get(ref(database,"patients"));

const patient=document.getElementById("patient");

patient.innerHTML="";

snapshot.forEach(child=>{

const p=child.val();

patient.innerHTML+=

`<option value="${child.key}">

${p.fullName}

</option>`;

});

}

async function loadMedications(){

const snapshot=

await get(ref(database,"medications"));

const medication=document.getElementById("medication");

medication.innerHTML="";

snapshot.forEach(child=>{

const m=child.val();

medications.push({

id:child.key,

...m

});

medication.innerHTML+=`

<option value="${child.key}">

${m.generic_name}

</option>

`;

});

}

document
.getElementById("addTime")
.onclick=function(){

const t=document
.getElementById("time")
.value;

if(!t)return;

selectedTimes.push(t);

renderTimes();

};

function renderTimes(){

const ul=

document.getElementById("timeList");

ul.innerHTML="";

selectedTimes.forEach(time=>{

ul.innerHTML+=

`<li>${time}</li>`;

});

}

document
.getElementById("addMedication")
.onclick=function(){

const medId=

document.getElementById("medication").value;

const med=

medications.find(

m=>m.id===medId

);

prescriptionItems.push({

medication_id:med.id,

medication_name:med.generic_name,

dosage:

document
.getElementById("dosage")
.value,

route:

document
.getElementById("route")
.value,

frequency:

document
.getElementById("frequency")
.value,

administration_times:

[...selectedTimes],

start_date:

document
.getElementById("startDate")
.value,

end_date:

document
.getElementById("endDate")
.value

});

selectedTimes=[];

renderTimes();

renderMedications();

};

function renderMedications(){

const tbody=

document.getElementById("medicationTable");

tbody.innerHTML="";

prescriptionItems.forEach((item,index)=>{

tbody.innerHTML+=`

<tr>

<td>${item.medication_name}</td>

<td>${item.dosage}</td>

<td>${item.frequency}</td>

<td>${item.administration_times.join(", ")}</td>

<td>

<button

type="button"

onclick="removeMedication(${index})">

Remove

</button>

</td>

</tr>

`;

});

}

window.removeMedication=function(index){

prescriptionItems.splice(index,1);

renderMedications();

}

document
.getElementById("prescriptionForm")
.addEventListener("submit",
async function(e){

e.preventDefault();

const payload={

patient_id:

document
.getElementById("patient")
.value,

physician:

document
.getElementById("physician")
.value,

notes:

document
.getElementById("notes")
.value,

items:

prescriptionItems

};

const response=

await fetch(

"add_prescription.php",

{

method:"POST",

headers:{

"Content-Type":

"application/json"

},

body:

JSON.stringify(payload)

}

);

const result=

await response.json();

document
.getElementById("status")
.textContent=

JSON.stringify(result,null,4);

});

</script>

</body>
</html>
