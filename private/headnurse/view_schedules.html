<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MediTrack | Medication Schedule Dashboard</title>

<link rel="stylesheet" href="stylesheets/view_schedules.css">

</head>

<body>

<header>

    <div>
        <h1>Medication Schedule Dashboard</h1>
        <div>Monitor and manage all assigned medication schedules</div>
    </div>

    <div class="actions">
        <a href="dashboard.html" class="btn btn-secondary">
            Dashboard
        </a>

        <a href="assign_schedule.html" class="btn btn-primary">
            + Assign Schedule
        </a>
    </div>

</header>

<div class="container">

    <div class="toolbar">

        <input
            type="text"
            id="search"
            placeholder="Search patient, medication, nurse, ward, or room">

        <select id="statusFilter">
            <option value="">All Status</option>
            <option value="Scheduled">Scheduled</option>
            <option value="Given">Given</option>
            <option value="Missed">Missed</option>
            <option value="Delayed">Delayed</option>
            <option value="Refused">Refused</option>
        </select>

        <select id="sortFilter">
            <option value="today">Today</option>
            <option value="upcoming">Upcoming</option>
            <option value="past">Past</option>
            <option value="recent" selected>Recent</option>
        </select>

        <button id="refreshBtn" class="btn btn-primary">
            Refresh
        </button>

    </div>

    <div class="card">

        <table>

            <thead>
                <tr>
                    <th>Patient</th>
                    <th>Location</th>
                    <th>Medication</th>
                    <th>Dosage</th>
                    <th>Route</th>
                    <th>Nurse</th>
                    <th>Scheduled Time</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="table">
                <tr>
                    <td colspan="9" class="empty">
                        Loading schedules...
                    </td>
                </tr>
            </tbody>

        </table>

    </div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";

import {
    getDatabase,
    ref,
    get,
    remove
}
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyBRm3dUt3HreTquM_Ba9JfYmZD2CLVV0Gc",
    authDomain: "meditrack-59cca.firebaseapp.com",
    databaseURL: "https://meditrack-59cca-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "meditrack-59cca",
    storageBucket: "meditrack-59cca.firebasestorage.app",
    messagingSenderId: "656003988692",
    appId: "1:656003988692:web:badfe96b7d830837a4cf41"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const table = document.getElementById("table");

let schedules = [];

await loadSchedules();

async function loadSchedules(){

    table.innerHTML = `
        <tr>
            <td colspan="9" class="empty">
                Loading schedules...
            </td>
        </tr>
    `;

    const snapshot =
    await get(ref(db,"medication_schedule"));

    schedules = [];

    if(snapshot.exists()){

        snapshot.forEach(child=>{

            schedules.push({
                id:child.key,
                ...child.val()
            });

        });

    }

    applyFilters();

}

function badgeClass(status){

    switch(status){

        case "Scheduled": return "scheduled";
        case "Given": return "given";
        case "Missed": return "missed";
        case "Delayed": return "delayed";
        case "Refused": return "refused";
        default: return "scheduled";

    }

}

function renderTable(data){

    table.innerHTML = "";

    if(data.length === 0){

        table.innerHTML = `
            <tr>
                <td colspan="9" class="empty">
                    No schedules found.
                </td>
            </tr>
        `;

        return;

    }

    data.forEach(schedule=>{

        const tr = document.createElement("tr");

        tr.innerHTML = `
            <td>
                <strong>${schedule.patient_name || ""}</strong>
            </td>

            <td>
                ${schedule.assigned_area || "-"}
                <br>
                <small>Room ${schedule.room || "-"}</small>
            </td>

            <td>
                <strong>${schedule.medication_name || ""}</strong>
            </td>

            <td>${schedule.dosage || "-"}</td>

            <td>${schedule.route || "-"}</td>

            <td>${schedule.nurse_name || "-"}</td>

            <td>
                ${formatDateTime(schedule.scheduled_time)}
            </td>

            <td>
                <span class="badge ${badgeClass(schedule.status)}">
                    ${schedule.status}
                </span>
            </td>

            <td>
                <div class="action-group">

                    <button class="action-btn view">
                        View
                    </button>

                    <button class="action-btn delete">
                        Delete
                    </button>

                </div>
            </td>
        `;

        tr.querySelector(".view")
        .addEventListener("click",()=>{

            location.href =
            "view_schedule.html?id=" +
            encodeURIComponent(schedule.id);

        });

        tr.querySelector(".delete")
        .addEventListener("click",()=>{

            deleteSchedule(schedule.id);

        });

        table.appendChild(tr);

    });

}

function formatDateTime(value){

    if(!value) return "-";

    // If value is only a time (HH:MM)
    if(/^\\d{2}:\\d{2}$/.test(value)){

        const [h, m] = value.split(":").map(Number);

        const period = h >= 12 ? "PM" : "AM";
        const hour12 = h % 12 || 12;

        return `${hour12}:${String(m).padStart(2,"0")} ${period}`;

    }

    // If value is a full datetime
    const d = new Date(value);

    if(isNaN(d.getTime())){

        return value;

    }

    return d.toLocaleString([],{
        year:"numeric",
        month:"short",
        day:"numeric",
        hour:"numeric",
        minute:"2-digit"
    });

}

async function deleteSchedule(id){

    if(!confirm("Delete this schedule?")){
        return;
    }

    await remove(ref(db,"medication_schedule/"+id));

    await loadSchedules();

}

function applyFilters(){

    const keyword =
    document.getElementById("search")
    .value.toLowerCase().trim();

    const status =
    document.getElementById("statusFilter").value;

    const sort =
    document.getElementById("sortFilter").value;

    let filtered = schedules.filter(schedule=>{

        const text = [
            schedule.patient_name,
            schedule.medication_name,
            schedule.nurse_name,
            schedule.assigned_area,
            schedule.room
        ]
        .join(" ")
        .toLowerCase();

        const matchText =
        text.includes(keyword);

        const matchStatus =
        !status || schedule.status === status;

        return matchText && matchStatus;

    });

    const now = new Date();

    if(sort === "today"){

        filtered = filtered.filter(s=>{

            const d = new Date(s.scheduled_time);

            return d.toDateString() === now.toDateString();

        });

        filtered.sort(
            (a,b)=>
            new Date(a.scheduled_time) -
            new Date(b.scheduled_time)
        );

    }
    else if(sort === "upcoming"){

        filtered = filtered.filter(
            s=>new Date(s.scheduled_time) >= now
        );

        filtered.sort(
            (a,b)=>
            new Date(a.scheduled_time) -
            new Date(b.scheduled_time)
        );

    }
    else if(sort === "past"){

        filtered = filtered.filter(
            s=>new Date(s.scheduled_time) < now
        );

        filtered.sort(
            (a,b)=>
            new Date(b.scheduled_time) -
            new Date(a.scheduled_time)
        );

    }
    else if(sort === "recent"){

        filtered.sort(
            (a,b)=>
            new Date(b.created_at || b.scheduled_time) -
            new Date(a.created_at || a.scheduled_time)
        );

    }

    renderTable(filtered);

}

document
.getElementById("search")
.addEventListener("input",applyFilters);

document
.getElementById("statusFilter")
.addEventListener("change",applyFilters);

document
.getElementById("sortFilter")
.addEventListener("change",applyFilters);

document
.getElementById("refreshBtn")
.addEventListener("click",loadSchedules);

</script>

</body>
</html>
