<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>View Medication Schedule</title>

<link rel="stylesheet" href="stylesheets/view_schedule.css">
</head>

<body>

<h2>Medication Schedule Details</h2>

<a href="view_schedules.html">← Back to Schedules</a>

<hr>

<table border="1" cellpadding="8">

<tr>
    <td><strong>Patient</strong></td>
    <td id="patient">Loading...</td>
</tr>

<tr>
    <td><strong>Ward</strong></td>
    <td id="assignedArea"></td>
</tr>

<tr>
    <td><strong>Room</strong></td>
    <td id="room"></td>
</tr>

<tr>
    <td><strong>Medication</strong></td>
    <td id="medication"></td>
</tr>

<tr>
    <td><strong>Dosage</strong></td>
    <td id="dosage"></td>
</tr>

<tr>
    <td><strong>Route</strong></td>
    <td id="route"></td>
</tr>

<tr>
    <td><strong>Assigned Nurse</strong></td>
    <td id="nurse"></td>
</tr>

<tr>
    <td><strong>Scheduled Time</strong></td>
    <td id="scheduledTime"></td>
</tr>

<tr>
    <td><strong>Status</strong></td>
    <td id="status"></td>
</tr>

<tr>
    <td><strong>Date Created</strong></td>
    <td id="createdAt"></td>
</tr>

</table>

<br>

<button id="deleteBtn">
    Delete Schedule
</button>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";

import {
    getDatabase, 
    ref, 
    get, 
    remove
}
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";

//--------------------------------------
// Firebase Config
//--------------------------------------

const firebaseConfig = {
    apiKey: "AIzaSyBRm3dUt3HreTquM_Ba9JfYmZD2CLVV0Gc",
    authDomain: "meditrack-59cca.firebaseapp.com",
    databaseURL: "https://meditrack-59cca-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "meditrack-59cca",
    storageBucket: "meditrack-59cca.firebasestorage.app",
    messagingSenderId: "656003988692",
    appId: "1:656003988692:web:badfe96b7d830837a4cf41"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

//--------------------------------------
// Get Schedule ID
//--------------------------------------

const params = new URLSearchParams(window.location.search);
const scheduleId = params.get("id");

if(!scheduleId){

    alert("No schedule selected.");

    window.location.href = "view_schedules.html";

}

//--------------------------------------
// Load Schedule
//--------------------------------------

async function loadSchedule(){

    try{

        const snapshot =
        await get(ref(db, "medication_schedule/" + scheduleId));

        if(!snapshot.exists()){

            alert("Schedule not found.");

            window.location.href = "view_schedules.html";

            return;

        }

        const schedule = snapshot.val();

        document.getElementById("patient").textContent =
        schedule.patient_name || "";

        document.getElementById("assignedArea").textContent =
        schedule.assigned_area || "-";

        document.getElementById("room").textContent =
        schedule.room || "-";

        document.getElementById("medication").textContent =
        schedule.medication_name || "";

        document.getElementById("dosage").textContent =
        schedule.dosage || "";

        document.getElementById("route").textContent =
        schedule.route || "";

        document.getElementById("nurse").textContent =
        schedule.nurse_name || "";

        document.getElementById("scheduledTime").textContent =
        schedule.scheduled_time
            ? (schedule.scheduled_time).toLocaleString()
            : "";

        document.getElementById("status").textContent =
        schedule.status || "";

        document.getElementById("createdAt").textContent =
        schedule.created_at
            ? new Date(schedule.created_at).toLocaleString()
            : "-";

    }
    catch(error){

        alert(error.message);

    }

}

loadSchedule();

//-------------------------------------- 
// Delete Button 
// -------------------------------------- 

document.getElementById("deleteBtn") 
.addEventListener("click", async function(){

    if(!confirm("Delete this schedule?")){ 
        return; 
    } 
    
    try{ await remove( 
        ref(db, "medication_schedule/" + scheduleId) 
    ); 
    
    alert("Schedule deleted successfully."); 
    
    window.location.href = "view_schedules.html"; 
    } 
    catch(error){ 
        alert(error.message); 
    } 
});

</script>

</body>
</html>
