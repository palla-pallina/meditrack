<script type="module">


/* =====================================================
   FIREBASE
===================================================== */

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";


import {
    getDatabase,
    ref,
    get,
    remove
}
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";

import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {
	/* firebase config */
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

/* =====================================================
   HEAD NURSE ACCESS VALIDATION
===================================================== */

document.body.style.visibility = "hidden";

async function validateHeadNurseAccess() {
    try {
        const user = await new Promise((resolve, reject) => {
            let unsubscribe = () => {};

            unsubscribe = onAuthStateChanged(
                auth,
                (authenticatedUser) => {
                    unsubscribe();
                    resolve(authenticatedUser);
                },
                (error) => {
                    unsubscribe();
                    reject(error);
                }
            );
        });

        // Redirect if the user is not authenticated.
        if (!user) {
            window.location.replace("../../index.html");
            return false;
        }

        // Retrieve the user's account information.
        const userSnapshot = await get(
            ref(db, `users/${user.uid}`)
        );

        // Redirect if the account does not exist.
        if (!userSnapshot.exists()) {
            window.location.replace("../../index.html");
            return false;
        }

        const userData = userSnapshot.val();

        // Allow Head Nurse accounts only.
        if (userData.userType !== "Head Nurse") {
            window.location.replace("../../index.html");
            return false;
        }

        // Access granted.
        document.body.style.visibility = "visible";

        return true;

    } catch (error) {
        console.error(
            "Head Nurse account validation failed:",
            error
        );

        window.location.replace("../../index.html");
        return false;
    }
}

if (!(await validateHeadNurseAccess())) {
    throw new Error("Unauthorized access.");
}

/* =====================================================
   GET SCHEDULE ID
===================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );


const scheduleId =
    params.get("id");


if(!scheduleId){

    alert(
        "No schedule selected."
    );

    window.location.href =
        "view_schedules.html";

}


/* =====================================================
   FORMAT SCHEDULED DATES
===================================================== */

function formatScheduledDates(
    dates
){

    if(
        !dates
    ){

        return "-";

    }


    /*
        Firebase may return the dates
        as an array or an object.
    */

    let dateList = [];


    if(
        Array.isArray(dates)
    ){

        dateList =
            dates.filter(
                date =>
                    date
            );

    }
    else if(
        typeof dates === "object"
    ){

        dateList =
            Object.values(
                dates
            )
            .filter(
                date =>
                    date
            );

    }


    if(
        dateList.length === 0
    ){

        return "-";

    }


    /*
        Remove duplicates.
    */

    dateList =
        [
            ...new Set(
                dateList
            )
        ];


    /*
        Sort chronologically.
    */

    dateList.sort(
        (a, b) =>
            new Date(a) -
            new Date(b)
    );


    /*
        Display the complete
        generated date range.
    */

    if(
        dateList.length === 1
    ){

        return dateList[0];

    }


    return `${dateList[0]} - ${
        dateList[dateList.length - 1]
    }`;

}


/* =====================================================
   FORMAT ADMINISTRATION TIME
===================================================== */

function formatAdministrationTime(time){

    if(!time){
        return "-";
    }

    const value =
        String(time).trim();

    /*
        Expected format:
        HH:MM

        Examples:
        05:00 -> 5:00 AM
        08:00 -> 8:00 AM
        12:00 -> 12:00 PM
        13:00 -> 1:00 PM
        18:00 -> 6:00 PM
        21:00 -> 9:00 PM
    */

    const match =
        value.match(
            /^(\d{1,2}):(\d{2})$/
        );

    if(!match){
        return value;
    }

    let hours =
        parseInt(
            match[1],
            10
        );

    const minutes =
        match[2];

    if(
        hours < 0 ||
        hours > 23
    ){
        return value;
    }

    const period =
        hours >= 12
            ? "PM"
            : "AM";

    const hour12 =
        hours % 12 || 12;

    return `${hour12}:${minutes} ${period}`;
}

/* =====================================================
   LOAD SCHEDULE
===================================================== */

async function loadSchedule(){

    try{

        const snapshot =
            await get(
                ref(
                    db,
                    "medication_schedule/" +
                    scheduleId
                )
            );


        if(
            !snapshot.exists()
        ){

            alert(
                "Schedule not found."
            );

            window.location.href =
                "view_schedules.html";

            return;

        }


        const schedule =
            snapshot.val();


        /* =================================================
           PATIENT
        ================================================= */

        document
            .getElementById(
                "patient"
            )
            .textContent =
                schedule.patient_name ||
                "-";


        /* =================================================
           WARD
        ================================================= */

        document
            .getElementById(
                "assignedArea"
            )
            .textContent =
                schedule.assigned_area ||
                "-";


        /* =================================================
           ROOM
        ================================================= */

        document
            .getElementById(
                "room"
            )
            .textContent =
                schedule.room ||
                "-";


        /* =================================================
           MEDICATION
        ================================================= */

        document
            .getElementById(
                "medication"
            )
            .textContent =
                schedule.medication_name ||
                "-";


        /* =================================================
           DOSAGE
        ================================================= */

        document
            .getElementById(
                "dosage"
            )
            .textContent =
                schedule.dosage ||
                "-";


        /* =================================================
           ROUTE
        ================================================= */

        document
            .getElementById(
                "route"
            )
            .textContent =
                schedule.route ||
                "-";


        /* =================================================
           NURSE
        ================================================= */

        document
            .getElementById(
                "nurse"
            )
            .textContent =
                schedule.nurse_name ||
                "-";


        /* =================================================
           SCHEDULED DATES
        ================================================= */

        document
            .getElementById(
                "scheduledDates"
            )
            .textContent =
                formatScheduledDates(
                    schedule.scheduled_dates
                );


        /* =================================================*
            SCHEDULED TIME
        ================================================= */

        document
            .getElementById(
                "scheduledTime"
            )
            .textContent =
                formatAdministrationTime(
                    schedule.scheduled_time
                );


        /* =================================================
           STATUS
        ================================================= */

        document
            .getElementById(
                "status"
            )
            .textContent =
                schedule.status ||
                "-";


        /* =================================================
           CREATED AT
        ================================================= */

        document
            .getElementById(
                "createdAt"
            )
            .textContent =
                schedule.created_at
                    ? new Date(
                        schedule.created_at
                    ).toLocaleString()
                    : "-";

    }
    catch(error){

        console.error(
            "Error loading schedule:",
            error
        );

        alert(
            error.message
        );

    }

}


/* =====================================================
   LOAD
===================================================== */

loadSchedule();


/* =====================================================
   DELETE BUTTON
===================================================== */

document
    .getElementById(
        "deleteBtn"
    )
    .addEventListener(
        "click",
        async function(){

            if(
                !confirm(
                    "Delete this schedule?"
                )
            ){

                return;

            }


            try{

                await remove(
                    ref(
                        db,
                        "medication_schedule/" +
                        scheduleId
                    )
                );


                alert(
                    "Schedule deleted successfully."
                );


                window.location.href =
                    "view_schedules.html";

            }
            catch(error){

                console.error(
                    "Error deleting schedule:",
                    error
                );

                alert(
                    error.message
                );

            }

        }
    );

</script>

</body>
