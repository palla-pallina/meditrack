<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Assign Medication Schedule</title>

<link rel="stylesheet" href="stylesheets/assign_schedule.css">
</head>

<body>

<a href="dashboard.html">Dashboard</a>

<h2>Assign Medication Schedule</h2>
<label>Required fields are marked with an asterisk &#x28;<span style="color:red;">*</span>&#41;</label>
<br><br>
<form id="scheduleForm">

<!-- ========================= -->
<!-- PATIENT -->
<!-- ========================= -->
<fieldset>

<legend><strong>Patient</strong> <span style="color:red;">*</span></legend>

<label>Select Patient</label><br>

<select id="patientSelect" required>

<option value="">Loading patients...</option>

</select>

<br><br>

<label>Assigned Ward</label><br>

<input
type="text"
id="assignedArea"
readonly>

<br><br>

<label>Room</label><br>

<input
type="text"
id="room"
readonly>

</fieldset>

<br>

<!-- ========================= -->
<!-- NURSE -->
<!-- ========================= -->
<fieldset>

<legend><strong>Nurse</strong></legend>

<label>Assign Nurse <span style="color:red;">*</span></label><br>

<select id="nurse" required>

<option value="">Loading nurses...</option>

</select>

</fieldset>

<br>

<!-- ========================= -->
<!-- MEDICATION -->
<!-- ========================= -->
<fieldset>

<legend><strong>Medication</strong></legend>

<label>Select Medication <span style="color:red;">*</span></label><br>

<select id="prescriptionItem" required>

<option value="">Select patient first</option>

</select>

<br><br>

<label>Medication Name</label><br>

<input
type="text"
id="medicationName"
readonly>

<br><br>

<label>Dosage</label><br>

<input
type="text"
id="dosage"
readonly>

<br><br>

<label>Route</label><br>

<input
type="text"
id="route"
readonly>

</fieldset>

<br>

<!-- ========================= -->
<!-- SCHEDULE -->
<!-- ========================= -->
<fieldset>

<legend><strong>Schedule</strong></legend>

<label>Administration Time <span style="color:red;">*</span></label><br>

<select id="scheduledTime" required>

<option value="">Select medication first</option>

</select>

<br><br>

<label>Status</label><br>

<input
type="text"
id="status"
value="Scheduled"
readonly>

</fieldset>

<br>

<button type="submit">

Assign Schedule

</button>

</form>

<pre id="result"></pre>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";

import {
getDatabase,
ref,
get
}
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyBRm3dUt3HreTquM_Ba9JfYmZD2CLVV0Gc",
    authDomain: "meditrack-59cca.firebaseapp.com",
    databaseURL: "https://meditrack-59cca-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "meditrack-59cca",
    storageBucket: "meditrack-59cca.firebasestorage.app",
    messagingSenderId: "656003988692",
    appId: "1:656003988692:web:badfe96b7d830837a4cf41"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const patientSelect =
document.getElementById("patientSelect");

const prescriptionSelect =
document.getElementById("prescriptionItem");

const assignedArea =
document.getElementById("assignedArea");

const room =
document.getElementById("room");

const medicationName =
document.getElementById("medicationName");

const dosage =
document.getElementById("dosage");

const route =
document.getElementById("route");

const scheduledTime =
document.getElementById("scheduledTime");

let patients = {};
let patientPrescriptionItems = {};

// Load initial data
await loadEligiblePatients();
await loadNurses();

// ======================================
// 1 & 2. Load patients with prescriptions
//    and without assigned schedules
// ======================================

async function loadEligiblePatients(){

    const patientsSnap =
        await get(
            ref(db, "patients")
        );


    const prescriptionsSnap =
        await get(
            ref(db, "prescriptions")
        );


    const itemsSnap =
        await get(
            ref(db, "prescription_items")
        );


    const schedulesSnap =
        await get(
            ref(db, "medication_schedule")
        );


    patientSelect.innerHTML =
        '<option value="">Select Patient</option>';


    // =================================================
    // CHECK REQUIRED DATA
    // =================================================

    if(
        !patientsSnap.exists() ||
        !prescriptionsSnap.exists() ||
        !itemsSnap.exists()
    ){

        return;

    }


    const prescriptions =
        prescriptionsSnap.val();


    // =================================================
    // BUILD MAP OF SCHEDULED TIMES
    // =================================================

    const scheduledMap = {};


    if(
        schedulesSnap.exists()
    ){

        schedulesSnap.forEach(
            scheduleSnap => {

                const data =
                    scheduleSnap.val();


                const itemId =
                    data.prescription_item_id;


                const time =
                    data.scheduled_time;


                if(
                    !itemId ||
                    !time
                ){

                    return;

                }


                if(
                    !scheduledMap[itemId]
                ){

                    scheduledMap[itemId] =
                        new Set();

                }


                scheduledMap[itemId].add(
                    time
                );

            }
        );

    }


    // =================================================
    // BUILD PATIENT → ACTIVE PRESCRIPTION ITEMS
    // =================================================

    const map = {};


    itemsSnap.forEach(
        itemSnap => {

            const item =
                itemSnap.val();


            const itemId =
                itemSnap.key;


            const prescriptionId =
                item.prescription_id;


            const patientId =
                item.patient_id;


            // -----------------------------------------
            // Validate required references
            // -----------------------------------------

            if(
                !prescriptionId ||
                !patientId
            ){

                return;

            }


            // -----------------------------------------
            // Find parent prescription
            // -----------------------------------------

            const prescription =
                prescriptions[prescriptionId];


            if(!prescription){

                return;

            }


            // -----------------------------------------
            // ONLY ACTIVE PRESCRIPTIONS
            // -----------------------------------------

            const prescriptionStatus =
                String(
                    prescription.status ||
                    ""
                )
                .trim()
                .toLowerCase();


            if(
                prescriptionStatus !== "active"
            ){

                return;

            }


            // -----------------------------------------
            // Get administration times
            // -----------------------------------------

            const allTimes =
                Array.isArray(
                    item.administration_times
                )
                ? item.administration_times
                : [];


            const scheduledTimes =
                scheduledMap[itemId] ||
                new Set();


            // -----------------------------------------
            // Keep only unscheduled times
            // -----------------------------------------

            const remainingTimes =
                allTimes.filter(
                    time =>
                        !scheduledTimes.has(time)
                );


            // If every administration time
            // has already been scheduled,
            // don't include this item.

            if(
                remainingTimes.length === 0
            ){

                return;

            }


            // -----------------------------------------
            // Create patient entry
            // -----------------------------------------

            if(
                !map[patientId]
            ){

                map[patientId] = [];

            }


            map[patientId].push({

                id: itemId,

                ...item,

                administration_times:
                    remainingTimes

            });

        }
    );


    // =================================================
    // POPULATE PATIENT DROPDOWN
    // =================================================

    Object.keys(map).forEach(
        patientId => {

            const patient =
                patientsSnap
                    .child(patientId)
                    .val();


            if(!patient){

                return;

            }


            patients[patientId] =
                patient;


            patientPrescriptionItems[patientId] =
                map[patientId];


            const option =
                document.createElement(
                    "option"
                );


            option.value =
                patientId;


            option.textContent =
                patient.fullName ||
                patient.name ||
                patientId;


            patientSelect.appendChild(
                option
            );

        }
    );

}

// ======================================
// 3,4,5. Patient selected
// ======================================

patientSelect.addEventListener("change", () => {

    const patientId =
    patientSelect.value;

    const patient =
    patients[patientId];

    prescriptionSelect.innerHTML =
    '<option value="">Select Medication</option>';

    medicationName.value = "";
    dosage.value = "";
    route.value = "";

    scheduledTime.innerHTML =
    '<option value="">Select medication first</option>';

    if(!patient){

        assignedArea.value = "";
        room.value = "";

        return;

    }

    // Auto-fill ward and room
    assignedArea.value =
    patient.assignedArea || "";

    room.value =
    patient.room || "";

    // Load medications
    const items =
    patientPrescriptionItems[patientId] || [];

    items.forEach(item => {

        prescriptionSelect.innerHTML += `
            <option value="${item.id}">
                ${item.medication_name}
            </option>
        `;

    });

});

// ======================================
// 6 & 7. Medication selected
// ======================================

prescriptionSelect.addEventListener("change", () => {

    const patientId =
    patientSelect.value;

    const items =
    patientPrescriptionItems[patientId] || [];

    const item =
    items.find(i => i.id === prescriptionSelect.value);

    if(!item){

        medicationName.value = "";
        dosage.value = "";
        route.value = "";

        scheduledTime.innerHTML =
        '<option value="">Select medication first</option>';

        return;

    }

    medicationName.value =
    item.medication_name || "";

    dosage.value =
    item.dosage || "";

    route.value =
    item.route || "";

    // Populate administration times
    scheduledTime.innerHTML =
    '<option value="">Select Time</option>';

    (item.administration_times || []).forEach(time => {

        scheduledTime.innerHTML += `
            <option value="${time}">
                ${time}
            </option>
        `;

    });

});

// ======================================
// Load nurses
// ======================================

async function loadNurses(){

    const snapshot =
    await get(ref(db,"users"));

    const select =
    document.getElementById("nurse");

    select.innerHTML =
    '<option value="">Select Nurse</option>';

    if(!snapshot.exists()) return;

    snapshot.forEach(user => {

        const u = user.val();

        if(
            u.userType === "Nurse" ||
            u.userType === "Head Nurse"
        ){

            select.innerHTML += `
                <option value="${user.key}">
                    ${u.fullName}
                </option>
            `;

        }

    });

}

// ======================================
// Save schedule
// ======================================

document
.getElementById("scheduleForm")
.addEventListener("submit", async function(e){

    e.preventDefault();

    const payload = {

        prescription_item_id:
            prescriptionSelect.value,

        nurse_uid:
            document.getElementById("nurse").value,

        scheduled_time:
            scheduledTime.value,

        dosage:
            dosage.value,

        route:
            route.value,

        status:
            "Scheduled",

        assigned_area:
            assignedArea.value,

        room:
            room.value

    };    
    
    const response =
    await fetch("assign_schedule.php",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify(payload)

    });

    const result =
    await response.json();

    document
    .getElementById("result")
    .textContent =
    JSON.stringify(result,null,4);

if(result.success){

        alert("Medication schedule assigned successfully.");

        // Redirect to the newly created schedule
        window.location.href =
            `view_schedule.html?id=${encodeURIComponent(result.schedule_id)}`;

    }

});

</script>

</body>
</html>
