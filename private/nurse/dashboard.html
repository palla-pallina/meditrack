<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Medication Schedules</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:'Inter',sans-serif;
    background:#f4f8fc;
    color:#374151;

}

/* Header */

header{

    background:#1976d2;
    color:white;
    padding:18px 40px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    box-shadow:0 3px 12px rgba(0,0,0,.08);

}

.logo h2{

    font-size:1.6rem;

}

.logo span{

    opacity:.9;

}

.logout-btn{

    background:white;
    color:#1976d2;

    border:none;

    padding:10px 20px;

    border-radius:8px;

    font-weight:600;

    cursor:pointer;

}

.logout-btn:hover{

    background:#eef6ff;

}

/* Main */

main{

    max-width:1400px;

    margin:40px auto;

    padding:0 25px;

}

.page-header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    flex-wrap:wrap;

    gap:20px;

    margin-bottom:25px;

}

.page-header h1{

    color:#1976d2;

    margin-bottom:8px;

}

.page-header p{

    color:#6b7280;

}

/* Toolbar */

.toolbar{

    display:flex;

    gap:15px;

    flex-wrap:wrap;

    margin-bottom:25px;

}

.toolbar input,
.toolbar select{

    padding:12px 15px;

    border:1px solid #d1d5db;

    border-radius:8px;

    font-size:15px;

}

.toolbar input{

    flex:1;
    min-width:280px;

}

/* Buttons */

.btn{

    border:none;

    border-radius:8px;

    padding:12px 20px;

    cursor:pointer;

    text-decoration:none;

    font-weight:600;

    transition:.25s;

}

.btn-primary{

    background:#1976d2;
    color:white;

}

.btn-primary:hover{

    background:#1565c0;

}

.btn-secondary{

    background:#eef2f7;

    color:#374151;

}

.btn-secondary:hover{

    background:#dde5ef;

}

/* Table */

.table-card{

    background:white;

    border-radius:16px;

    overflow:hidden;

    box-shadow:0 10px 25px rgba(0,0,0,.06);

}

table{

    width:100%;

    border-collapse:collapse;

}

thead{

    background:#1976d2;

    color:white;

}

th{

    padding:16px;

    text-align:left;

}

td{

    padding:15px;

    border-bottom:1px solid #edf2f7;

}

tbody tr:nth-child(even){

    background:#fafcff;

}

tbody tr:hover{

    background:#eef6ff;

}

/* Action Button */

.action-btn{

    background:#1976d2;

    color:white;

    border:none;

    border-radius:6px;

    padding:8px 15px;

    cursor:pointer;

}

.action-btn:hover{

    background:#1565c0;

}

/* Status Badges */

.badge{

    display:inline-block;

    padding:6px 12px;

    border-radius:20px;

    color:white;

    font-size:.82rem;

    font-weight:600;

}

.scheduled{

    background:#1976d2;

}

.given{

    background:#16a34a;

}

.missed{

    background:#dc2626;

}

.delayed{

    background:#f59e0b;

}

.refused{

    background:#6b7280;

}

/* Mobile */

@media(max-width:900px){

    .page-header{

        flex-direction:column;

        align-items:flex-start;

    }

    .table-card{

        overflow-x:auto;

    }

    table{

        min-width:900px;

    }

}
</style>
</head>

<body>

<header>

    <div class="logo">

        <h2>MediTrack</h2>

        <span>Nurse Dashboard</span>

    </div>

    <button id="logoutBtn" id="logoutBtn" class="logout-btn">

        Log Out

    </button>

</header>

<main>

    <section class="page-header">

        <div>

            <h1>My Medication Schedules</h1>

            <p>

                View your assigned medication administration schedules.

            </p>

        </div>

    </section>

    <section class="toolbar">

        <input
            type="text"
            id="search"
            placeholder="Search patient or medication">

        <select id="statusFilter">

            <option value="">All Status</option>
            <option value="Scheduled">Scheduled</option>
            <option value="Given">Given</option>
            <option value="Missed">Missed</option>
            <option value="Delayed">Delayed</option>
            <option value="Refused">Refused</option>

        </select>

        <button id="searchBtn" class="btn btn-primary">

            Search

        </button>

    </section>

    <section class="table-card">

        <table>

            <thead>

                <tr>

                    <th>Patient</th>
                    <th>Medication</th>
                    <th>Scheduled Time</th>
                    <th>Dosage</th>
                    <th>Status</th>
                    <th>Action</th>

                </tr>

            </thead>

            <tbody id="table">

                <tr>

                    <td colspan="6">

                        Loading...

                    </td>

                </tr>

            </tbody>

        </table>

    </section>

</main>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";

//import { requireRole }
//from "../../public/auth_guard.js";

import {
getAuth,
onAuthStateChanged,
signOut
}
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

import {

getDatabase,
ref,
query,
orderByChild,
equalTo,
get

}
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";

const firebaseConfig={
    apiKey: "AIzaSyBRm3dUt3HreTquM_Ba9JfYmZD2CLVV0Gc",
    authDomain: "meditrack-59cca.firebaseapp.com",
    databaseURL: "https://meditrack-59cca-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "meditrack-59cca",
    storageBucket: "meditrack-59cca.firebasestorage.app",
    messagingSenderId: "656003988692",
    appId: "1:656003988692:web:badfe96b7d830837a4cf41"
};

const app=initializeApp(firebaseConfig);

const auth=getAuth(app);

document.getElementById("logoutBtn")
.addEventListener("click", async () => {

    try {

        await signOut(auth);

        window.location.href = "../../public/login.html";

    }
    catch(error) {

        alert(error.message);

    }

});

const db=getDatabase(app);

const table=document.getElementById("table");

let schedules=[];

onAuthStateChanged(auth, async (user) => {

    console.log("Auth user:", user);

    if (!user) {

        location.href="../../public/login.html";
        return;

    }

    try{

        await loadSchedules(user.uid);

    }
    catch(error){

        console.error(error);

        table.innerHTML=
        `<tr><td colspan="6">${error.message}</td></tr>`;

    }

});

async function loadSchedules(uid){

    try{

        console.log("Current UID:", uid);

        const q = query(
            ref(db,"medication_schedule"),
            orderByChild("nurse_uid"),
            equalTo(uid)
        );

        const snapshot = await get(q);

        console.log("Exists:", snapshot.exists());
        console.log(snapshot.val());

        schedules=[];

        if(snapshot.exists()){

            snapshot.forEach(child=>{

                console.log(child.key, child.val());

                schedules.push({
                    id:child.key,
                    ...child.val()
                });

            });

        }

        renderTable(schedules);

    }
    catch(error){

        console.error(error);

        table.innerHTML=
        `<tr><td colspan="6">${error.message}</td></tr>`;

    }

}

function renderTable(data){

table.innerHTML="";

if(data.length===0){

table.innerHTML=

"<tr><td colspan='6'>No assigned schedules.</td></tr>";

return;

}

data.sort(

(a,b)=>

new Date(a.scheduled_time)-

new Date(b.scheduled_time)

);

data.forEach(schedule=>{

const tr=document.createElement("tr");

tr.innerHTML=`

<td>${schedule.patient_name}</td>

<td>${schedule.medication_name}</td>

<td>

${new Date(schedule.scheduled_time).toLocaleString()}

</td>

<td>

${schedule.dosage}

</td>

<td>

<span class="badge ${schedule.status.toLowerCase()}">

    ${schedule.status}

</span>

</td>

<td>

<button class="action-btn viewBtn">

    View

</button>

</td>
`;

tr.querySelector(".viewBtn")

.addEventListener("click",()=>{

location.href=

"view_schedule.html?id="+

encodeURIComponent(schedule.id);

});

table.appendChild(tr);

});

}

function search(){

const keyword=

document

.getElementById("search")

.value

.toLowerCase()

.trim();

const status=

document

.getElementById("statusFilter")

.value;

const filtered=

schedules.filter(schedule=>{

const textMatch=

schedule.patient_name

.toLowerCase()

.includes(keyword)

||

schedule.medication_name

.toLowerCase()

.includes(keyword);

const statusMatch=

status===""

||

schedule.status===status;

return textMatch && statusMatch;

});

renderTable(filtered);

}

document

.getElementById("searchBtn")

.addEventListener("click",search);

document

.getElementById("search")

.addEventListener("keyup",search);

document

.getElementById("statusFilter")

.addEventListener("change",search);

</script>

</body>
</html>
