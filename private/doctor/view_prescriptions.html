<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Prescription Records</title>

<link rel="stylesheet" href="stylesheets/view_prescriptions.css">
</head>

<body>

<h2>Prescription Records</h2>

<a href="dashboard.html">Dashboard</a>
<a href="add_prescription.html">New Prescription</a>

<hr>

<input
type="text"
id="search"
placeholder="Search patient or physician">

<button id="searchBtn">
Search
</button>

<div class="prescription-controls">

    <label for="statusFilter">
        Sort by Status:
    </label>

    <select id="statusFilter">

        <option value="Active" selected>
            Active
        </option>

        <option value="Done">
            Done
        </option>

        <option value="On Hold">
            On Hold
        </option>

    </select>


    <label for="dateSort">
        Date:
    </label>

    <select id="dateSort">

        <option value="recent" selected>
            Recent
        </option>

        <option value="oldest">
            Oldest
        </option>

    </select>


    <label for="physicianFilter">
        Prescribing Physician:
    </label>

    <select id="physicianFilter">

        <option value="All" selected>
            All
        </option>

    </select>

</div>

<hr>

<table border="1" cellpadding="8">

<thead>

<tr>

<th>Patient</th>
<th>Prescribing Physician</th>
<th>Status</th>
<th>Medications</th>
<th>Actions</th>

</tr>

</thead>

<tbody id="table">

<tr>

<td colspan="5">

Loading...

</td>

</tr>

</tbody>

</table>

<script type="module">

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";


import {
    getDatabase,
    ref,
    get,
    set,
    remove
}
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";


const firebaseConfig = {
    apiKey: "AIzaSyBRm3dUt3HreTquM_Ba9JfYmZD2CLVV0Gc",
    authDomain: "meditrack-59cca.firebaseapp.com",
    databaseURL: "https://meditrack-59cca-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "meditrack-59cca",
    storageBucket: "meditrack-59cca.firebasestorage.app",
    messagingSenderId: "656003988692",
    appId: "1:656003988692:web:badfe96b7d830837a4cf41"
};


const app =
    initializeApp(
        firebaseConfig
    );


const database =
    getDatabase(app);


const table =
    document.getElementById(
        "table"
    );


let prescriptions = [];


// =====================================================
// INITIAL LOAD
// =====================================================

document
    .getElementById("statusFilter")
    .addEventListener(
        "change",
        applyPrescriptionFilters
    );


document
    .getElementById("dateSort")
    .addEventListener(
        "change",
        applyPrescriptionFilters
    );


document
    .getElementById("physicianFilter")
    .addEventListener(
        "change",
        applyPrescriptionFilters
    );


document
    .getElementById("searchBtn")
    .addEventListener(
        "click",
        search
    );


document
    .getElementById("search")
    .addEventListener(
        "keyup",
        event => {

            if (
                event.key === "Enter"
            ) {

                search();

            }

        }
    );


loadPrescriptions();

// =====================================================
// LOAD PRESCRIPTIONS
// =====================================================


function getTodayLocalDate() {
    const now = new Date();

    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, "0");
    const day = String(now.getDate()).padStart(2, "0");

    return `${year}-${month}-${day}`;
}


async function loadPrescriptions() {

    const prescriptionsSnapshot = await get(
        ref(database, "prescriptions")
    );

    const itemsSnapshot = await get(
        ref(database, "prescription_items")
    );

    const prescriptionData =
        prescriptionsSnapshot.exists()
            ? prescriptionsSnapshot.val()
            : {};

    const prescriptionItems = itemsSnapshot.exists()
        ? itemsSnapshot.val()
        : {};

    const groupedItems = {};

    // Group prescription items by prescription_id
    Object.entries(prescriptionItems).forEach(
        ([itemId, item]) => {

            const prescriptionId = item.prescription_id;

            if (!prescriptionId) return;

            if (!groupedItems[prescriptionId]) {
                groupedItems[prescriptionId] = [];
            }

            groupedItems[prescriptionId].push({
                ...item,
                itemId
            });
        }
    );

    const today = getTodayLocalDate();

    // Check expired prescriptions
    for (
        const [prescriptionId, prescription]
        of Object.entries(prescriptionData)
    ) {

        const items = groupedItems[prescriptionId] || [];

        if (items.length === 0) {
            continue;
        }

        /*
         * A prescription is considered Done only when
         * ALL medication items have an end date and
         * every end date is before today.
         */
        const isDone = items.every(item => {

            if (!item.end_date) {
                return false;
            }

            const endDate = String(item.end_date).substring(0, 10);

            return endDate < today;
        });

        if (isDone && prescription.status !== "Done") {

            await set(
                ref(database, `prescriptions/${prescriptionId}/status`),
                "Done"
            );

            prescription.status = "Done";
        }
    }

    /*
     * Build the final prescription list.
     */
    prescriptions = Object.entries(prescriptionData).map(
        ([prescriptionId, prescription]) => {

            const items =
                groupedItems[prescriptionId] || [];

            return {
                id: prescriptionId,
                ...prescription,
                items
            };

        }
    );

    window.allPrescriptions = prescriptions;

    populatePhysicianFilter();

    applyPrescriptionFilters();
}

// =====================================================
// POPULATE PHYSICIAN FILTER
// =====================================================

function populatePhysicianFilter() {

    const select =
        document.getElementById(
            "physicianFilter"
        );


    // Keep "All"
    select.innerHTML = `

        <option value="All" selected>
            All
        </option>

    `;


    const physicians =
        new Set();


    prescriptions.forEach(
        prescription => {

            const physician =
                String(
                    prescription.physician_name ||
                    ""
                ).trim();


            if (
                physician
            ) {

                physicians.add(
                    physician
                );

            }

        }
    );


    const sortedPhysicians =
        [...physicians].sort(
            (a, b) =>
                a.localeCompare(
                    b
                )
        );


    sortedPhysicians.forEach(
        physician => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                physician;


            option.textContent =
                physician;


            select.appendChild(
                option
            );

        }
    );

}

// =====================================================
// FILTER AND SORT PRESCRIPTIONS
// =====================================================

function applyPrescriptionFilters() {

    const statusFilter =
        document.getElementById(
            "statusFilter"
        ).value;


    const dateSort =
        document.getElementById(
            "dateSort"
        ).value;


    const physicianFilter =
        document.getElementById(
            "physicianFilter"
        ).value;


    const keyword =
        document
            .getElementById(
                "search"
            )
            .value
            .toLowerCase()
            .trim();


    let filtered =
        [
            ...prescriptions
        ];


    // =================================================
    // SEARCH
    // =================================================

    if (
        keyword
    ) {

        filtered =
            filtered.filter(
                prescription => {

                    const patient =
                        String(
                            prescription.patient_name ||
                            ""
                        )
                        .toLowerCase();


                    const physician =
                        String(
                            prescription.physician_name ||
                            ""
                        )
                        .toLowerCase();


                    return (

                        patient.includes(
                            keyword
                        )

                        ||

                        physician.includes(
                            keyword
                        )

                    );

                }
            );

    }


    // =================================================
    // STATUS FILTER
    // =================================================

    if (
        statusFilter !== "All"
    ) {

        filtered =
            filtered.filter(
                prescription => {

                    const status =
                        String(
                            prescription.status ||
                            "Active"
                        )
                        .trim()
                        .toLowerCase();


                    return (
                        status ===
                        statusFilter
                            .toLowerCase()
                    );

                }
            );

    }


    // =================================================
    // PHYSICIAN FILTER
    // =================================================

    if (
        physicianFilter !== "All"
    ) {

        filtered =
            filtered.filter(
                prescription => {

                    const physician =
                        String(
                            prescription.physician_name ||
                            ""
                        ).trim();


                    return (
                        physician ===
                        physicianFilter
                    );

                }
            );

    }


    // =================================================
    // DATE SORT
    // =================================================

    filtered.sort(
        (a, b) => {

            const dateA =
                new Date(
                    a.created_at || 0
                ).getTime();


            const dateB =
                new Date(
                    b.created_at || 0
                ).getTime();


            if (
                dateSort === "oldest"
            ) {

                return dateA - dateB;

            }


            // Default: Recent
            return dateB - dateA;

        }
    );


    renderTable(
        filtered
    );

}

// =====================================================
// RENDER TABLE
// =====================================================


function renderTable(data) {

    table.innerHTML = "";


    if (data.length === 0) {

        table.innerHTML = `

            <tr>

                <td colspan="5">

                    No prescriptions found.

                </td>

            </tr>

        `;

        return;

    }


    data.forEach(
        prescription => {

            const tr =
                document.createElement(
                    "tr"
                );


            /*
             * Use the already-loaded items.
             */

            const count =
                prescription.items
                ? prescription.items.length
                : 0;


            tr.innerHTML = `

                <td>

                    ${
                        prescription.patient_name ||
                        "-"
                    }

                </td>


                <td>

                    ${
                        prescription.physician_name ||
                        "-"
                    }

                </td>


                <td>

                    ${
                        prescription.status ||
                        "-"
                    }

                </td>


                <td>

                    ${count}

                </td>


                <td>

                    <button
                        class="viewBtn">

                        View Details

                    </button>


                    <button
                        class="editBtn">

                        Edit

                    </button>


                    <button
                        class="deleteBtn">

                        Delete

                    </button>

                </td>

            `;


            /*
             * EDIT
             */

            tr.querySelector(
                ".editBtn"
            )
            .addEventListener(
                "click",
                () => {

                    location.href =
                        "edit_prescription.html?id=" +
                        encodeURIComponent(
                            prescription.id
                        );

                }
            );


            /*
             * VIEW DETAILS
             */

            tr.querySelector(
                ".viewBtn"
            )
            .addEventListener(
                "click",
                () => {

                    toggleDetails(
                        tr,
                        prescription
                    );

                }
            );


            /*
             * DELETE
             */

            tr.querySelector(
                ".deleteBtn"
            )
            .addEventListener(
                "click",
                () => {

                    deletePrescription(
                        prescription.id
                    );

                }
            );


            table.appendChild(
                tr
            );

        }
    );

}

// =====================================================
// VIEW PRESCRIPTION DETAILS
// =====================================================

function toggleDetails(
    row,
    prescription
){

    const next =
        row.nextElementSibling;


    /*
     * Close details if already open.
     */

    if(
        next &&
        next.classList.contains(
            "detailsRow"
        )
    ){

        next.remove();

        return;

    }


    let html = `

        <table
            border="1"
            width="100%"
        >

            <tr>

                <th>
                    Medication
                </th>

                <th>
                    Dosage
                </th>

                <th>
                    Route
                </th>

                <th>
                    Frequency
                </th>

                <th>
                    Administration Times
                </th>

                <th>
                    Start
                </th>

                <th>
                    End
                </th>

                <th>
                    Status
                </th>

            </tr>

    `;


    /*
     * Render the prescription items
     * already loaded by loadPrescriptions().
     */

    if(
        prescription.items &&
        prescription.items.length > 0
    ){

        prescription.items.forEach(
            item => {

                html += `

                    <tr>

                        <td>

                            ${item.medication_name || "-"}

                        </td>


                        <td>

                            ${item.dosage || "-"}

                        </td>


                        <td>

                            ${item.route || "-"}

                        </td>


                        <td>

                            ${item.frequency || "-"}

                        </td>


                        <td>

                            ${
                                item.administration_times
                                ?

                                item.administration_times.join(
                                    "<br>"
                                )

                                :

                                "-"
                            }

                        </td>


                        <td>

                            ${item.start_date || "-"}

                        </td>


                        <td>

                            ${item.end_date || "-"}

                        </td>


                        <td>

                            ${item.status || "-"}

                        </td>

                    </tr>

                `;

            }
        );

    }
    else{

        html += `

            <tr>

                <td colspan="5">

                    No prescription items found.

                </td>

            </tr>

        `;

    }


    html += `
        </table>
    `;


    const detailRow =
        document.createElement(
            "tr"
        );


    detailRow.className =
        "detailsRow";


    detailRow.innerHTML = `

        <td colspan="5">

            ${html}

        </td>

    `;


    row.parentNode.insertBefore(

        detailRow,

        row.nextSibling

    );

}


// =====================================================
// DELETE PRESCRIPTION
// =====================================================

async function deletePrescription(
    id
){

    if(
        !confirm(
            "Delete this prescription?"
        )
    ){

        return;

    }


    try{

        /*
         * Find all items belonging
         * to this prescription.
         */

        const itemSnapshot =
            await get(
                ref(
                    database,
                    "prescription_items"
                )
            );


        if(
            itemSnapshot.exists()
        ){

            const promises = [];


            itemSnapshot.forEach(
                item => {

                    const data =
                        item.val();


                    if(
                        data.prescription_id === id
                    ){

                        promises.push(

                            remove(

                                ref(

                                    database,

                                    "prescription_items/" +
                                    item.key

                                )

                            )

                        );

                    }

                }
            );


            await Promise.all(
                promises
            );

        }


        /*
         * Delete the parent prescription.
         */

        await remove(

            ref(

                database,

                "prescriptions/" +
                id

            )

        );


        alert(
            "Prescription deleted."
        );


        loadPrescriptions();

    }
    catch(error){

        console.error(
            "Failed to delete prescription:",
            error
        );


        alert(

            "Failed to delete prescription:\n\n" +

            error.message

        );

    }

}

// =====================================================
// SEARCH
// =====================================================

function search() {

    applyPrescriptionFilters();

}


</script>

</body>
</html>
