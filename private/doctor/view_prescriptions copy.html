<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Prescription Records</title>

<link rel="stylesheet" href="stylesheets/view_prescriptions.css">
</head>

<body>

<h2>Prescription Records</h2>

<a href="dashboard.html">Dashboard</a>
<a href="add_prescription.html">New Prescription</a>

<hr>

<input
type="text"
id="search"
placeholder="Search patient or physician">

<button id="searchBtn">
Search
</button>

<div class="prescription-controls">

    <label for="statusFilter">Status:</label>
    <select id="statusFilter">
        <option value="Active" selected>Active</option>
        <option value="Done">Done</option>
        <option value="All">All</option>
    </select>

    <label for="physicianSort">Assigned Physician:</label>
    <select id="physicianSort">
        <option value="none" selected>Default</option>
        <option value="asc">A–Z</option>
        <option value="desc">Z–A</option>
    </select>

    <label for="statusSort">Sort Status:</label>
    <select id="statusSort">
        <option value="none" selected>Default</option>
        <option value="asc">A–Z</option>
        <option value="desc">Z–A</option>
    </select>

</div>

<hr>

<table border="1" cellpadding="8">

<thead>

<tr>

<th>Patient</th>
<th>Status</th>
<th>Medications</th>
<th>Actions</th>

</tr>

</thead>

<tbody id="table">

<tr>

<td colspan="4">

Loading...

</td>

</tr>

</tbody>

</table>

<script type="module">

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";


import {
    getDatabase,
    ref,
    get,
    set,
    remove
}
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";


const firebaseConfig = {
    apiKey: "AIzaSyBRm3dUt3HreTquM_Ba9JfYmZD2CLVV0Gc",
    authDomain: "meditrack-59cca.firebaseapp.com",
    databaseURL: "https://meditrack-59cca-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "meditrack-59cca",
    storageBucket: "meditrack-59cca.firebasestorage.app",
    messagingSenderId: "656003988692",
    appId: "1:656003988692:web:badfe96b7d830837a4cf41"
};


const app =
    initializeApp(
        firebaseConfig
    );


const database =
    getDatabase(app);


// =====================================================
// GLOBAL DATA
// =====================================================

let prescriptions = [];


// =====================================================
// INITIAL LOAD
// =====================================================

document
    .getElementById("statusFilter")
    .addEventListener(
        "change",
        applyPrescriptionFilters
    );


document
    .getElementById("physicianSort")
    .addEventListener(
        "change",
        applyPrescriptionFilters
    );


document
    .getElementById("statusSort")
    .addEventListener(
        "change",
        applyPrescriptionFilters
    );


document
    .getElementById("searchBtn")
    .addEventListener(
        "click",
        search
    );


document
    .getElementById("search")
    .addEventListener(
        "keyup",
        event => {

            if (
                event.key === "Enter"
            ) {

                search();

            }

        }
    );


loadPrescriptions();


// =====================================================
// GET TODAY'S DATE
// =====================================================

function getTodayLocalDate() {

    const now =
        new Date();


    const year =
        now.getFullYear();


    const month =
        String(
            now.getMonth() + 1
        ).padStart(
            2,
            "0"
        );


    const day =
        String(
            now.getDate()
        ).padStart(
            2,
            "0"
        );


    return `${year}-${month}-${day}`;

}


// =====================================================
// LOAD PRESCRIPTIONS
// =====================================================

async function loadPrescriptions() {

    try {

        const prescriptionsSnapshot =
            await get(
                ref(
                    database,
                    "prescriptions"
                )
            );


        const itemsSnapshot =
            await get(
                ref(
                    database,
                    "prescription_items"
                )
            );


        const prescriptionData =
            prescriptionsSnapshot.exists()
                ? prescriptionsSnapshot.val()
                : {};


        const prescriptionItems =
            itemsSnapshot.exists()
                ? itemsSnapshot.val()
                : {};


        const groupedItems = {};


        // ---------------------------------------------
        // GROUP PRESCRIPTION ITEMS
        // ---------------------------------------------

        Object.entries(
            prescriptionItems
        ).forEach(
            ([itemId, item]) => {

                const prescriptionId =
                    item.prescription_id;


                if (!prescriptionId) {
                    return;
                }


                if (
                    !groupedItems[prescriptionId]
                ) {

                    groupedItems[prescriptionId] = [];

                }


                groupedItems[prescriptionId].push({

                    ...item,

                    itemId

                });

            }
        );


        const today =
            getTodayLocalDate();


        // ---------------------------------------------
        // CHECK EXPIRED PRESCRIPTIONS
        // ---------------------------------------------

        for (
            const [
                prescriptionId,
                prescription
            ]
            of Object.entries(
                prescriptionData
            )
        ) {

            const items =
                groupedItems[prescriptionId] || [];


            if (
                items.length === 0
            ) {

                continue;

            }


            /*
             * A prescription is marked Done only when
             * ALL of its medication items have an
             * end_date and ALL end dates are before today.
             *
             * Example:
             *
             * End date: 2026-09-15
             * Today:    2026-09-16
             *
             * Result: Done
             *
             * End date: 2026-09-16
             * Today:    2026-09-16
             *
             * Result: Still Active
             */

            const isDone =
                items.every(
                    item => {

                        if (
                            !item.end_date
                        ) {

                            return false;

                        }


                        const endDate =
                            String(
                                item.end_date
                            ).substring(
                                0,
                                10
                            );


                        return endDate < today;

                    }
                );


            if (
                isDone &&
                prescription.status !== "Done"
            ) {

                await set(

                    ref(
                        database,
                        `prescriptions/${prescriptionId}/status`
                    ),

                    "Done"

                );


                prescription.status =
                    "Done";

            }

        }


        // ---------------------------------------------
        // BUILD PRESCRIPTION LIST
        // ---------------------------------------------

        prescriptions =
            Object.entries(
                prescriptionData
            ).map(
                ([prescriptionId, prescription]) => {

                    return {

                        id:
                            prescriptionId,

                        ...prescription,

                        items:
                            groupedItems[
                                prescriptionId
                            ] || []

                    };

                }
            );


        // Store globally as well
        window.allPrescriptions =
            prescriptions;


        // ---------------------------------------------
        // DEFAULT VIEW
        // ---------------------------------------------

        /*
         * The statusFilter should have
         * value="Active" in the HTML.
         *
         * Therefore Active prescriptions
         * are displayed when the page opens.
         */

        applyPrescriptionFilters();

    }
    catch (error) {

        console.error(
            "Failed to load prescriptions:",
            error
        );


        alert(
            "Failed to load prescriptions:\n\n" +
            error.message
        );

    }

}


// =====================================================
// FILTER + SORT
// =====================================================

function applyPrescriptionFilters() {

    const statusFilter =
        document.getElementById(
            "statusFilter"
        ).value;


    const physicianSort =
        document.getElementById(
            "physicianSort"
        ).value;


    const statusSort =
        document.getElementById(
            "statusSort"
        ).value;


    const keyword =
        document
            .getElementById(
                "search"
            )
            .value
            .toLowerCase()
            .trim();


    let filteredPrescriptions =
        [
            ...(window.allPrescriptions || [])
        ];


    // ---------------------------------------------
    // SEARCH
    // ---------------------------------------------

    if (
        keyword
    ) {

        filteredPrescriptions =
            filteredPrescriptions.filter(
                prescription => {

                    const patient =
                        String(
                            prescription.patient_name ||
                            ""
                        )
                        .toLowerCase();


                    const physician =
                        String(
                            prescription.physician_name ||
                            prescription.assigned_physician ||
                            prescription.physician ||
                            prescription.doctor_name ||
                            ""
                        )
                        .toLowerCase();


                    return (

                        patient.includes(
                            keyword
                        )

                        ||

                        physician.includes(
                            keyword
                        )

                    );

                }
            );

    }


    // ---------------------------------------------
    // STATUS FILTER
    // ---------------------------------------------

    if (
        statusFilter !== "All"
    ) {

        filteredPrescriptions =
            filteredPrescriptions.filter(
                prescription => {

                    const status =
                        String(
                            prescription.status ||
                            "Active"
                        )
                        .toLowerCase();


                    return (
                        status ===
                        statusFilter.toLowerCase()
                    );

                }
            );

    }


    // ---------------------------------------------
    // SORT BY PHYSICIAN
    // ---------------------------------------------

    if (
        physicianSort !== "none"
    ) {

        filteredPrescriptions.sort(
            (a, b) => {

                const physicianA =
                    String(
                        a.assigned_physician ||
                        a.physician_name ||
                        a.physician ||
                        a.doctor_name ||
                        ""
                    )
                    .toLowerCase();


                const physicianB =
                    String(
                        b.assigned_physician ||
                        b.physician_name ||
                        b.physician ||
                        b.doctor_name ||
                        ""
                    )
                    .toLowerCase();


                const result =
                    physicianA.localeCompare(
                        physicianB
                    );


                return physicianSort === "asc"
                    ? result
                    : -result;

            }
        );

    }


    // ---------------------------------------------
    // SORT BY STATUS
    // ---------------------------------------------

    if (
        statusSort !== "none"
    ) {

        filteredPrescriptions.sort(
            (a, b) => {

                const statusA =
                    String(
                        a.status ||
                        "Active"
                    )
                    .toLowerCase();


                const statusB =
                    String(
                        b.status ||
                        "Active"
                    )
                    .toLowerCase();


                const result =
                    statusA.localeCompare(
                        statusB
                    );


                return statusSort === "asc"
                    ? result
                    : -result;

            }
        );

    }


    renderTable(
        filteredPrescriptions
    );

}


// =====================================================
// RENDER TABLE
// =====================================================

function renderTable(
    prescriptionList
) {
    const tbody =
        document.getElementById("table");


    if (!tbody) {

        console.error(
            "Table body #prescriptionsTable tbody was not found."
        );

        return;

    }


    tbody.innerHTML = "";


    if (
        prescriptionList.length === 0
    ) {

        tbody.innerHTML = `

            <tr>

                <td colspan="4">

                    No prescriptions found.

                </td>

            </tr>

        `;

        return;

    }


    prescriptionList.forEach(
        prescription => {

            const tr =
                document.createElement(
                    "tr"
                );


            tr.innerHTML = `

                <td>

                    ${
                        prescription.patient_name ||
                        "Unknown"
                    }

                </td>


                <td>

                    ${
                        prescription.status ||
                        "Active"
                    }

                </td>


                <td>

                    ${
                        prescription.items.length
                    }

                </td>


                <td>

                    <button
                        class="viewBtn"
                        data-id="${prescription.id}"
                    >
                        View
                    </button>


                    <button
                        class="deleteBtn"
                        data-id="${prescription.id}"
                    >
                        Delete
                    </button>

                </td>

            `;


            // -----------------------------------------
            // VIEW BUTTON
            // -----------------------------------------

            tr
                .querySelector(
                    ".viewBtn"
                )
                .addEventListener(
                    "click",
                    () => {

                        toggleDetails(
                            tr,
                            prescription
                        );

                    }
                );


            // -----------------------------------------
            // DELETE BUTTON
            // -----------------------------------------

            tr
                .querySelector(
                    ".deleteBtn"
                )
                .addEventListener(
                    "click",
                    () => {

                        deletePrescription(
                            prescription.id
                        );

                    }
                );


            tbody.appendChild(
                tr
            );

        }
    );

}


// =====================================================
// VIEW PRESCRIPTION DETAILS
// =====================================================

function toggleDetails(
    row,
    prescription
) {

    const next =
        row.nextElementSibling;


    // ---------------------------------------------
    // CLOSE DETAILS
    // ---------------------------------------------

    if (
        next &&
        next.classList.contains(
            "detailsRow"
        )
    ) {

        next.remove();

        return;

    }


    let html = `

        <table
            border="1"
            width="100%"
        >

            <tr>

                <th>
                    Medication
                </th>

                <th>
                    Dosage
                </th>

                <th>
                    Route
                </th>

                <th>
                    Frequency
                </th>

                <th>
                    Administration Times
                </th>

                <th>
                    Start
                </th>

                <th>
                    End
                </th>

                <th>
                    Status
                </th>

            </tr>

    `;


    // ---------------------------------------------
    // PRESCRIPTION ITEMS
    // ---------------------------------------------

    if (
        prescription.items &&
        prescription.items.length > 0
    ) {

        prescription.items.forEach(
            item => {

                const administrationTimes =
                    Array.isArray(
                        item.administration_times
                    )

                    ?

                    item.administration_times.join(
                        "<br>"
                    )

                    :

                    (
                        item.administration_times ||
                        "-"
                    );


                html += `

                    <tr>

                        <td>
                            ${
                                item.medication_name ||
                                "-"
                            }
                        </td>


                        <td>
                            ${
                                item.dosage ||
                                "-"
                            }
                        </td>


                        <td>
                            ${
                                item.route ||
                                "-"
                            }
                        </td>


                        <td>
                            ${
                                item.frequency ||
                                "-"
                            }
                        </td>


                        <td>
                            ${
                                administrationTimes
                            }
                        </td>


                        <td>
                            ${
                                item.start_date ||
                                "-"
                            }
                        </td>


                        <td>
                            ${
                                item.end_date ||
                                "-"
                            }
                        </td>


                        <td>
                            ${
                                item.status ||
                                "-"
                            }
                        </td>

                    </tr>

                `;

            }
        );

    }
    else {

        html += `

            <tr>

                <td colspan="8">

                    No prescription items found.

                </td>

            </tr>

        `;

    }


    html += `

        </table>

    `;


    const detailRow =
        document.createElement(
            "tr"
        );


    detailRow.className =
        "detailsRow";


    detailRow.innerHTML = `

        <td colspan="4">

            ${html}

        </td>

    `;


    row.parentNode.insertBefore(
        detailRow,
        row.nextSibling
    );

}


// =====================================================
// DELETE PRESCRIPTION
// =====================================================

async function deletePrescription(
    id
) {

    if (
        !confirm(
            "Delete this prescription?"
        )
    ) {

        return;

    }


    try {

        // -----------------------------------------
        // FIND PRESCRIPTION ITEMS
        // -----------------------------------------

        const itemSnapshot =
            await get(
                ref(
                    database,
                    "prescription_items"
                )
            );


        if (
            itemSnapshot.exists()
        ) {

            const promises = [];


            itemSnapshot.forEach(
                item => {

                    const data =
                        item.val();


                    if (
                        data.prescription_id === id
                    ) {

                        promises.push(

                            remove(
                                ref(
                                    database,
                                    "prescription_items/" +
                                    item.key
                                )
                            )

                        );

                    }

                }
            );


            await Promise.all(
                promises
            );

        }


        // -----------------------------------------
        // DELETE PARENT PRESCRIPTION
        // -----------------------------------------

        await remove(

            ref(
                database,
                "prescriptions/" +
                id
            )

        );


        alert(
            "Prescription deleted."
        );


        // Reload data
        await loadPrescriptions();

    }
    catch (error) {

        console.error(
            "Failed to delete prescription:",
            error
        );


        alert(

            "Failed to delete prescription:\n\n" +
            error.message

        );

    }

}


// =====================================================
// SEARCH
// =====================================================

function search() {

    /*
     * Search is handled inside
     * applyPrescriptionFilters().
     *
     * This means the search works together
     * with the status filter and sorting.
     */

    applyPrescriptionFilters();

}

</script>


</body>
</html>
