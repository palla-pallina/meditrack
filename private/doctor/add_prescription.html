<script type="module">

import {

} from "../js/activity_log.js";

getDatabase,
ref,

push,
set

}

const firebaseConfig = {
	/* firebase config */

/* =====================================================
   AUTHENTICATION

let currentUser = null;
let currentUserProfile = null;

let medications = [];
let patients = [];
let selectedTimes = [];

let prescriptionItems = [];

/* =====================================================
   DATE RESTRICTIONS
===================================================== */

const startDateInput =
    document.getElementById("startDate");

const endDateInput =
    document.getElementById("endDate");


function getTodayDate() {

    const today = new Date();

    const year =
        today.getFullYear();

    const month =
        String(today.getMonth() + 1)
            .padStart(2, "0");

    const day =
        String(today.getDate())
            .padStart(2, "0");

    return `${year}-${month}-${day}`;
}


/*
 * Prevent past dates from being selected.
 */
function initializeDateRestrictions() {

    const today =
        getTodayDate();

    startDateInput.min =
        today;

    endDateInput.min =
        today;

}


/*
 * End date cannot be earlier than
 * the selected start date.
 */
startDateInput.addEventListener(
    "change",
    function () {

        const startDate =
            this.value;

        if (!startDate) {

            endDateInput.min =
                getTodayDate();

            return;

        }

        endDateInput.min =
            startDate;


        /*
         * Clear the existing end date
         * if it is now invalid.
         */
        if (
            endDateInput.value &&
            endDateInput.value < startDate
        ) {

            endDateInput.value = "";

        }

    }
);


initializeDateRestrictions();

onAuthStateChanged(auth, async (user) => {

    if (!user) {

        currentUser = null;
        currentUserProfile = null;

        alert(
            "Your session has expired. Please log in again."
        );

        window.location.href = "../../index.html";

        return;
    }

    currentUser = user;

    try {

        const snapshot = await get(
            ref(database, "users/" + user.uid)
        );

        if (!snapshot.exists()) {

            console.error(
                "Authenticated doctor profile not found."
            );

            await auth.signOut();

            window.location.href = "../../index.html";

            return;
        }

        currentUserProfile = snapshot.val();

        /* =================================================
           VERIFY DOCTOR ACCOUNT
        ================================================= */

        if (
            currentUserProfile.userType !== "Doctor"
        ) {

            alert(
                "Only doctors can create prescriptions."
            );

            await auth.signOut();

            window.location.href =
                "../../index.html";

            return;
        }

        if (
            String(
                currentUserProfile.accountStatus || ""
            )
            .trim()
            .toLowerCase() === "disabled"
        ) {

            alert(
                "Your doctor account is disabled."
            );

            await auth.signOut();

            window.location.href =
                "../../index.html";

            return;
        }

        /* =================================================
           AUTOFILL CURRENT DOCTOR
        ================================================= */

        const physicianSearch =
            document.getElementById(
                "physicianSearch"
            );

        const physicianHidden =
            document.getElementById(
                "physician"
            );

        physicianSearch.value =
            currentUserProfile.fullName || "";

        physicianHidden.value =
            user.uid;

        /* =================================================
           LOAD PAGE DATA
        ================================================= */

        await Promise.all([
            loadPatients(),
            loadMedications()
        ]);

        console.log(
            "Authenticated doctor:",
            user.uid,
            currentUserProfile.fullName
        );

    }
    catch (error) {

        console.error(
            "Authentication initialization failed:",
            error
        );

        alert(
            "Unable to initialize your session. Please log in again."
        );

    }

});

function calculateAdministrationTimes(){

    const frequency =
    document.getElementById("frequency").value;

    const scheduleMap = {

        "OD": ["08:00"],

        "OD HS": ["21:00"],

        "OD AC": ["05:00"],

        "OD LUNCH": ["13:00"],

        "BID": ["08:00", "18:00"],

        "TID": ["08:00", "13:00", "18:00"],

        "Q12": ["08:00", "20:00"]

    };

    selectedTimes =
    scheduleMap[frequency] || [];

    renderTimes();

}

async function loadPatients() {

    patients = [];

    const snapshot = await get(
        ref(database, "patients")
    );

    if (!snapshot.exists()) {
        return;
    }

    snapshot.forEach(child => {

        const p = child.val();

        // Exclude discharged patients
        if (
            String(p.dischargeStatus || "")
                .trim()
                .toLowerCase() === "discharged"
        ) {
            return;
        }

        patients.push({
            id: child.key,
            ...p
        });

    });
}

/* =====================================================
   PATIENT SEARCH
===================================================== */

const patientSearch =
    document.getElementById("patientSearch");

const patientResults =
    document.getElementById("patientResults");

const patientHidden =
    document.getElementById("patient");


function renderPatientResults(keyword = "") {

    const searchTerm =
        keyword
            .toLowerCase()
            .trim();

    patientResults.innerHTML = "";

    const matches =
        patients.filter(patient => {

            const name =
                String(patient.fullName || "")
                    .toLowerCase();

            return name.includes(searchTerm);

        });


    if (matches.length === 0) {

        patientResults.innerHTML = `
            <div style="padding:10px;">
                No patients found.
            </div>
        `;

        patientResults.style.display = "block";

        return;
    }


    matches.forEach(patient => {

        const div =
            document.createElement("div");

        div.style.padding = "10px";
        div.style.cursor = "pointer";
        div.style.borderBottom = "1px solid #eee";

        div.innerHTML = `
            <strong>
                ${patient.fullName || "Unnamed Patient"}
            </strong>
        `;


        div.addEventListener("click", function () {

            patientSearch.value =
                patient.fullName || "";

            patientHidden.value =
                patient.id;

            patientResults.style.display =
                "none";

        });


        patientResults.appendChild(div);

    });


    patientResults.style.display =
        "block";
}


patientSearch.addEventListener(
    "input",
    function () {

        /*
         * Clear the selected UID whenever
         * the user changes the search text.
         */
        patientHidden.value = "";

        renderPatientResults(
            this.value
        );

    }
);


patientSearch.addEventListener(
    "focus",
    function () {

        renderPatientResults(
            this.value
        );

    }
);

document.addEventListener("click", function (event) {

    if (
        !patientSearch.contains(event.target) &&
        !patientResults.contains(event.target)
    ) {
        patientResults.style.display = "none";
    }

});

async function loadMedications(){

    medications=[];

    const snapshot=
    await get(ref(database,"medications"));

    snapshot.forEach(child=>{

        medications.push({

            id:child.key,

            ...child.val()

        });

    });

}

const searchInput =
document.getElementById("medicationSearch");

const results =
document.getElementById("searchResults");

searchInput.addEventListener("input", function(){

    const keyword =
    this.value
    .toLowerCase()
    .trim();

    results.innerHTML="";

    if(keyword===""){

        results.style.display="none";

        return;

    }

    const matches =
    medications.filter(m=>

        m.generic_name
        .toLowerCase()
        .includes(keyword)

        ||

        (m.brand_name||"")
        .toLowerCase()
        .includes(keyword)

    );

    if(matches.length===0){

        results.innerHTML=`

        <div
        style="padding:10px;cursor:pointer;">

        Medication not found.

        <br><br>

        <button
        id="showAddMedication">

        Add New Medication

        </button>

        </div>

        `;

        results.style.display="block";

        document
        .getElementById("showAddMedication")
        .onclick=function(){

            document
            .getElementById("newMedicationPanel")
            .style.display="block";

            document
            .getElementById("newGeneric")

            searchInput.value;

        };

        return;

    }

    matches.forEach(m=>{

        const div=
        document.createElement("div");

        div.style.padding="10px";

        div.style.cursor="pointer";

        div.innerHTML=`

        <b>${m.generic_name}</b>

        ${m.brand_name
        ? "("+m.brand_name+")"

        `;

        div.onclick=function(){

            document
            .getElementById("medication")
            .value=m.id;

            searchInput.value=m.generic_name;

            results.style.display="none";

        };

        results.appendChild(div);

.getElementById("saveMedication")
.onclick = async function () {

    const genericName =
        document
            .getElementById("newGeneric")

            .trim();


    if (genericName === "") {

        alert(
            "Generic name is required."
        );

        return;
    }


    try {

        // =====================================================
        // Create Medication Reference
        // =====================================================

        const medRef =
            push(
                ref(
                    database,
                    "medications"
                )
            );


        const medicationId =
            medRef.key;


        // =====================================================
        // Medication Data
        // =====================================================

        const medication = {

            medication_id:
                medicationId,

            generic_name:
                genericName,

            brand_name:
                document
                    .getElementById("newBrand")
                    .value
                    .trim(),

            drug_class:
                document
                    .getElementById("newDrugClass")
                    .value
                    .trim(),

            form:
                document
                    .getElementById("newForm")
                    .value,

            created_at:
                new Date().toISOString()

        };


        // =====================================================
        // Save Medication
        // =====================================================

        await set(
            medRef,
            medication
        );


        // =====================================================
        // Activity Log
        // =====================================================

        try {

            await logMedicineCreated(
                database,
                auth,
                {

                    medicationId:
                        medicationId,

                    genericName:

                    brandName:
                        medication.brand_name,

                        medication.drug_class,

results.style.display = "none";
results.innerHTML = "";

.getElementById("cancelMedication")

/* =====================================================
   FORMAT ADMINISTRATION TIME
===================================================== */

function formatAdministrationTime(time){

    if(!time){
        return "-";
    }

    const value =
        String(time).trim();

    const match =
        value.match(
            /^(\d{1,2}):(\d{2})$/
        );

    if(!match){
        return value;
    }

    let hours =
        parseInt(
            match[1],
            10
        );

    const minutes =
        match[2];

    if(
        hours < 0 ||
        hours > 23
    ){
        return value;
    }

    const period =
        hours >= 12
            ? "PM"
            : "AM";

    const hour12 =
        hours % 12 || 12;

    return `${hour12}:${minutes} ${period}`;
}

function renderTimes(){

    const ul =
        document.getElementById(
            "timeList"
        );

    ul.innerHTML = "";

    selectedTimes.forEach(
        time => {

            const li =
                document.createElement(
                    "li"
                );

            li.textContent =
                formatAdministrationTime(
                    time
                );

            ul.appendChild(li);

        }
    );

}

document
.getElementById("frequency")
.addEventListener("change", calculateAdministrationTimes);

/* =====================================================
   GENERATE SCHEDULED DATES
===================================================== */

function generateScheduledDates(startDate, endDate) {

    if (!startDate || !endDate) {

        return [];

    }

    const dates = [];

    const current =
        new Date(
            `${startDate}T00:00:00`
        );

    const end =
        new Date(
            `${endDate}T00:00:00`
        );


    while (current <= end) {

        const year =
            current.getFullYear();

        const month =
            String(
                current.getMonth() + 1
            ).padStart(2, "0");

        const day =
            String(
                current.getDate()
            ).padStart(2, "0");


        dates.push(
            `${year}-${month}-${day}`
        );


        current.setDate(
            current.getDate() + 1
        );

    }

    return dates;

}

document
.getElementById("addMedication")
.onclick = function () {

    const medId =
        document
            .getElementById("medication")
            .value;


    const med =
        medications.find(
            m => m.id === medId
        );


    if (!med) {

        alert(
            "Select a medication first."
        );

        return;

    }


    const dosage =
        document
            .getElementById("dosage")
            .value
            .trim();


    const frequency =
        document
            .getElementById("frequency")
            .value;


    const startDate =
        document
            .getElementById("startDate")
            .value;


    const endDate =
        document
            .getElementById("endDate")
            .value;


    /* =================================================
       VALIDATION
    ================================================= */

    if (!dosage) {

        alert(
            "Dosage is required."
        );

        return;

    }


    if (!frequency) {

        alert(
            "Frequency is required."
        );

        return;

    }


    if (!startDate) {

        alert(
            "Start date is required."
        );

        return;

    }


    if (!endDate) {

        alert(
            "End date is required."
        );

        return;

    }


    const today =
        getTodayDate();


    if (startDate < today) {

        alert(
            "Start date cannot be in the past."
        );

        return;

    }


    if (endDate < today) {

        alert(
            "End date cannot be in the past."
        );

        return;

    }


    if (endDate < startDate) {

        alert(
            "End date cannot be earlier than the start date."
        );

        return;

    }


    if (selectedTimes.length === 0) {

        alert(
            "Please select a valid frequency."
        );

        return;

    }


    /* =================================================
       GENERATE SCHEDULED DATES
    ================================================= */

    const scheduledDates =
        generateScheduledDates(
            startDate,
            endDate
        );


    /* =================================================
       ADD PRESCRIPTION ITEM
    ================================================= */

    prescriptionItems.push({

        medication_id:
            med.id,

        medication_name:
            med.generic_name,

        dosage:
            dosage,

        route:
            document
                .getElementById("route")
                .value,

        frequency:
            frequency,

        administration_times:
            [...selectedTimes],

        start_date:
            startDate,

        end_date:
            endDate,

        scheduled_dates:
            scheduledDates

    });


    /* =================================================
       CLEAR MEDICATION INPUTS
    ================================================= */

    document
        .getElementById("dosage")
        .value = "";

    document
        .getElementById("frequency")
        .value = "";

    document
        .getElementById("startDate")
        .value = "";

    document
        .getElementById("endDate")
        .value = "";

    document
        .getElementById("medication")
        .value = "";

    document
        .getElementById("medicationSearch")
        .value = "";


    selectedTimes = [];

    renderTimes();

    initializeDateRestrictions();

    renderMedications();

};

function renderMedications() {

    const tbody =
        document.getElementById(
            "medicationTable"
        );

    tbody.innerHTML = "";


    prescriptionItems.forEach(
        (item, index) => {

            const scheduledDates =
                item.scheduled_dates || [];


            const formattedDates =
                scheduledDates
                    .map(date => {

                        const dateObject =
                            new Date(
                                `${date}T00:00:00`
                            );


                        return dateObject.toLocaleDateString(
                            "en-US",
                            {
                                month: "short",
                                day: "numeric",
                                year: "numeric"
                            }
                        );

                    })
                    .join("<br>");


            tbody.innerHTML += `

                <tr>

                    <td>
                        ${item.medication_name}
                    </td>

                    <td>
                        ${item.dosage}
                    </td>

                    <td>
                        ${item.frequency}
                    </td>

                    <td>
                        ${item.administration_times
                            .map(formatAdministrationTime)
                            .join(", ")}
                    </td>

                    <td>

                        <div
                            style="
                                max-height:120px;
                                overflow-y:auto;
                                line-height:1.6;
                            "
                        >
                            ${
                                formattedDates || "-"
                            }
                        </div>

                    </td>

                    <td>

                        <button
                            type="button"
                            onclick="removeMedication(${index})"
                        >
                            Remove
                        </button>

                    </td>

                </tr>

            `;

        }
    );

}

window.removeMedication=function(index){

prescriptionItems.splice(index,1);

renderMedications();

}

/* =====================================================
   DUPLICATE PRESCRIPTION CHECK
===================================================== */

async function checkDuplicatePrescriptionItems(patientId, newItems) {

    const itemsSnapshot = await get(
        ref(database, "prescription_items")
    );

    if (!itemsSnapshot.exists()) {
        return [];
    }

    const duplicates = [];

    for (const newItem of newItems) {

        if (
            !newItem.medication_id ||
            !newItem.start_date ||
            !newItem.end_date
        ) {
            continue;
        }

        const newStart = new Date(
            `${newItem.start_date}T00:00:00`
        );

        const newEnd = new Date(
            `${newItem.end_date}T23:59:59`
        );

        itemsSnapshot.forEach(child => {

            const existingItem = child.val();

            // Same patient
            if (existingItem.patient_id !== patientId) {
                return;
            }

            // Same medication
            if (
                existingItem.medication_id !==
                newItem.medication_id
            ) {
                return;
            }

            // Same dosage
            if (
                String(existingItem.dosage || "")
                    .trim()
                    .toLowerCase() !==
                String(newItem.dosage || "")
                    .trim()
                    .toLowerCase()
            ) {
                return;
            }

            // Same route
            if (
                String(existingItem.route || "")
                    .trim()
                    .toLowerCase() !==
                String(newItem.route || "")
                    .trim()
                    .toLowerCase()
            ) {
                return;
            }

            if (
                !existingItem.start_date ||
                !existingItem.end_date
            ) {
                return;
            }

            const existingStart = new Date(
                `${existingItem.start_date}T00:00:00`
            );

            const existingEnd = new Date(
                `${existingItem.end_date}T23:59:59`
            );

            // Date ranges overlap
            const datesOverlap =
                newStart <= existingEnd &&
                newEnd >= existingStart;

            if (datesOverlap) {

                duplicates.push({
                    medication:
                        existingItem.medication_name ||
                        newItem.medication_name,

                    dosage:
                        existingItem.dosage ||
                        newItem.dosage,

                    route:
                        existingItem.route ||
                        newItem.route,

                    startDate:
                        existingItem.start_date,

                    endDate:
                        existingItem.end_date
                });
            }
        });
    }

    return duplicates;
}

document
.getElementById("prescriptionForm")
.addEventListener(
    "submit",
    async function (e) {

        e.preventDefault();


        // =====================================================
        // Validate Medications
        // =====================================================

        if (
            prescriptionItems.length === 0
        ) {

            alert(
                "Please add at least one medication."
            );

            return;

        }


        // =====================================================
        // Check Authenticated User
        // =====================================================

        if (!currentUser) {

            alert(
                "Your session has expired. Please log in again."
            );

            return;

        }


        // =====================================================
        // Get Patient
        // =====================================================

        const patientSelect =
            document.getElementById("patient");

        const patientId =
            patientSelect.value;

        if (!patientId) {

            alert(
                "Please select a patient from the search results."
            );

            patientSearch.focus();

            return;
        }

        // =====================================================
        // Check For Duplicate Prescriptions
        // =====================================================

        try {

            const duplicates =
                await checkDuplicatePrescriptionItems(
                    patientId,
                    prescriptionItems
                );


            if (duplicates.length > 0) {

                const duplicateMessage =
                    duplicates
                        .map(item =>
                            `${item.medication} ${item.dosage} (${item.route})\n` +
                            `Existing prescription: ${item.startDate} to ${item.endDate}`
                        )
                        .join("\n\n");


                alert(
                    "Duplicate prescription detected.\n\n" +
                    duplicateMessage +
                    "\n\n" +
                    "The prescription was not saved."
                );


                return;

            }

        }
        catch (error) {

            console.error(
                "Duplicate prescription check failed:",
                error
            );


            alert(
                "Unable to verify existing prescriptions. " +
                "The prescription was not saved."
            );


            return;

        }


        // =====================================================
        // Build Payload
        // =====================================================

        const physicianUid =
            document.getElementById("physician").value;

        const physicianName =
            document
                .getElementById("physicianSearch")
                .value
                .trim();

        if (!physicianUid || !physicianName) {

            alert(
                "Unable to determine the currently logged-in doctor."
            );

            return;
        }


        const patientName = patientSearch.value.trim();


        const payload = {

            patient_id:
                patientId,

            physician_uid:
                physicianUid,

            physician_name:
                physicianName,

            notes:
                document
                    .getElementById("notes")
                    .value,

            items:
                prescriptionItems

        };


        const statusElement =
            document.getElementById("status");


        statusElement.textContent =
            "Saving prescription...";


        try {

            // =================================================
            // Save Prescription Through PHP
            // =================================================

            const response =
                await fetch(
                    "add_prescription.php",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(
                                payload
                            )
                    }
                );


            // =================================================
            // Read PHP Response
            // =================================================

            const result =
                await response.json();


            console.log(
                "Prescription response:",
                result
            );


            // =================================================
            // Validate Save
            // =================================================

            if (
                !response.ok ||
                result.success !== true
            ) {

                throw new Error(
                    result.message ||
                    "Failed to save prescription."
                );

            }


            // =================================================
            // Get Prescription ID
            // =================================================

            const prescriptionId =
                result.prescription_id;


            // =================================================
            // Prepare Medication Details For Log
            // =================================================

            const medicationsForLog =
                prescriptionItems.map(
                    item => ({

                        medicationId:
                            item.medication_id,

                        medicationName:
                            item.medication_name,

                        dosage:
                            item.dosage,

                        route:
                            item.route,

                        frequency:
                            item.frequency,

                        administrationTimes:
                            item.administration_times,

                        startDate:
                            item.start_date,

                        endDate:
                            item.end_date

                    })
                );


            // =================================================
            // Log Prescription Creation
            // =================================================

            try {

                await logPrescriptionCreated(
                    database,
                    auth,
                    {

                        prescriptionId:
                            prescriptionId,

                        patientId:
                            patientId,

                        patientName:
                            patientName,

                        physicianUid:
                            physicianUid,

                        physicianName:
                            physicianName,

                        medications:
                            medicationsForLog

                    }
                );

            }
            catch (logError) {

                console.error(
                    "Prescription activity logging failed:",
                    logError
                );

            }


            // =================================================
            // Redirect
            // =================================================

            window.location.href =
                "view_prescriptions.html";

        }
        catch (error) {

            console.error(
                "Error saving prescription:",
                error
            );


            statusElement.textContent =
                "Failed to save prescription.\n\n" +
                error.message;


            alert(
                error.message
            );

        }

    }
);
</script>
