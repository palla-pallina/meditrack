<!DOCTYPE html>
<html lang="en">
    
<head>
<meta charset="UTF-8">
<title>New Prescription</title>

<link rel="stylesheet" href="stylesheets/add_prescription.css">
</head>

<body>

<a href="dashboard.html">Back to Dashboard</a>

<h2>Create Prescription</h2>

<form id="prescriptionForm">

<h3>Prescription Information</h3>

<label>Patient</label><br>
<select id="patient" required></select>

<br><br>

<label>Prescribing Physician</label><br>

<input
    type="text"
    id="physician"
    readonly
    required>

<input
    type="hidden"
    id="physicianUid">

<br><br>

<label>General Notes</label><br>
<textarea id="notes"></textarea>

<hr>

<h3>Add Medication</h3>

<label>Search Medication</label><br>

<input
    type="text"
    id="medicationSearch"
    placeholder="Type generic or brand name">

<div
    id="searchResults"
    style="
        border:1px solid #ccc;
        max-height:180px;
        overflow-y:auto;
        display:none;">
</div>

<input
    type="hidden"
    id="medication">    

<div id="newMedicationPanel" style="display:none; border:1px solid #ccc; padding:15px; margin-top:15px;">

<h4>Add New Medication to Database</h4>

<label>Generic Name</label><br>
<input type="text" id="newGeneric"><br><br>

<label>Brand Name</label><br>
<input type="text" id="newBrand"><br><br>

<label>Drug Class</label><br>
<input type="text" id="newDrugClass"><br><br>

<label>Dosage Form</label><br>

<select id="newForm">

<option>Tablet</option>
<option>Capsule</option>
<option>Injection</option>
<option>Syrup</option>
<option>Cream</option>
<option>Inhaler</option>
<option>Other</option>

</select>

<br><br>

<button
type="button"
id="saveMedication">

Save New Medication

</button>

<button
    type="button"
    id="cancelMedication">

    Cancel

</button>

</div>

<br><br>

<label>Dosage</label><br>
<input type="text" id="dosage">

<br><br>

<label>Route</label><br>
<select id="route">

<option value="oral">Oral</option>
<option value="iv">IV</option>
<option value="im">IM</option>
<option value="subcutaneous">Subcutaneous</option>
<option value="topical">Topical</option>
<option value="inhalation">Inhalation</option>

</select>

<br><br>

<label>Frequency</label><br>

<select id="frequency">

    <option value="">Select frequency</option>

    <option value="OD">OD (once daily)</option>

    <option value="OD HS">OD HS (once daily at bedtime)</option>

    <option value="OD AC">OD AC (once daily before meals)</option>

    <option value="OD LUNCH">OD (once daily) at lunch</option>

    <option value="BID">BID (twice daily)</option>

    <option value="TID">TID (three times daily)</option>

    <option value="Q12">Q12 (every 12 hours)</option>

</select>

<br><br>

<label>Calculated Administration Times</label>
<ul id="timeList"></ul>

<br>

<label>Start Date</label><br>
<input type="date" id="startDate">

<br><br>

<label>End Date</label><br>
<input type="date" id="endDate">

<br><br>

<button
type="button"
id="addMedication">

Add Medication

</button>

<hr>

<h3>Medication List</h3>

<table border="1">

<thead>

<tr>

<th>Medication</th>

<th>Dosage</th>

<th>Frequency</th>

<th>Times</th>

<th>Action</th>

</tr>

</thead>

<tbody id="medicationTable">

</tbody>

</table>

<br>

<button type="submit">

Save Prescription

</button>

</form>

<pre id="status"></pre>

<script type="module">
import {
    logPrescriptionCreated
} from "../js/activity_log.js";

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";

import {

getDatabase,
ref,
get,
push,
set

}
from "https://www.gstatic.com/firebasejs/10.13.2/firebase-database.js";

import {
    getAuth,
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";

const firebaseConfig={
    apiKey: "AIzaSyBRm3dUt3HreTquM_Ba9JfYmZD2CLVV0Gc",
    authDomain: "meditrack-59cca.firebaseapp.com",
    databaseURL: "https://meditrack-59cca-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "meditrack-59cca",
    storageBucket: "meditrack-59cca.firebasestorage.app",
    messagingSenderId: "656003988692",
    appId: "1:656003988692:web:badfe96b7d830837a4cf41"
};

const app=initializeApp(firebaseConfig);

const database=getDatabase(app);

const auth = getAuth(app);

let medications=[];

let selectedTimes=[];

function calculateAdministrationTimes(){

    const frequency =
    document.getElementById("frequency").value;

    const scheduleMap = {

        "OD": ["08:00"],

        "OD HS": ["21:00"],

        "OD AC": ["05:00"],

        "OD LUNCH": ["13:00"],

        "BID": ["08:00", "18:00"],

        "TID": ["08:00", "13:00", "18:00"],

        "Q12": ["08:00", "20:00"]

    };

    selectedTimes =
    scheduleMap[frequency] || [];

    renderTimes();

}


let prescriptionItems=[];

loadPatients();

loadMedications();

async function loadPatients(){

const snapshot=

await get(ref(database,"patients"));

const patient=document.getElementById("patient");

patient.innerHTML="";

snapshot.forEach(child=>{

const p=child.val();

patient.innerHTML+=

`<option value="${child.key}">

${p.fullName}

</option>`;

});

}

onAuthStateChanged(auth, async(user)=>{

    if(!user){

        location.href="../../public/login.html";
        return;

    }

    await loadCurrentDoctor(user.uid);

});

async function loadCurrentDoctor(uid){

    const snapshot =
    await get(ref(database,"users/"+uid));

    if(!snapshot.exists()){

        alert("Doctor account not found.");
        return;

    }

    const doctor = snapshot.val();

    if(doctor.userType !== "Doctor"){

        alert("Only doctors can create prescriptions.");
        return;

    }

    document.getElementById("physician").value =
    doctor.fullName;

    document.getElementById("physicianUid").value =
    uid;

}

async function loadMedications(){

    medications=[];

    const snapshot=
    await get(ref(database,"medications"));

    snapshot.forEach(child=>{

        medications.push({

            id:child.key,

            ...child.val()

        });

    });

}

const searchInput =
document.getElementById("medicationSearch");

const results =
document.getElementById("searchResults");

searchInput.addEventListener("input", function(){

    const keyword =
    this.value
    .toLowerCase()
    .trim();

    results.innerHTML="";

    if(keyword===""){

        results.style.display="none";

        return;

    }

    const matches =
    medications.filter(m=>

        m.generic_name
        .toLowerCase()
        .includes(keyword)

        ||

        (m.brand_name||"")
        .toLowerCase()
        .includes(keyword)

    );

    if(matches.length===0){

        results.innerHTML=`

        <div
        style="padding:10px;cursor:pointer;">

        Medication not found.

        <br><br>

        <button
        id="showAddMedication">

        Add New Medication

        </button>

        </div>

        `;

        results.style.display="block";

        document
        .getElementById("showAddMedication")
        .onclick=function(){

            document
            .getElementById("newMedicationPanel")
            .style.display="block";

            document
            .getElementById("newGeneric")
            .value=
            searchInput.value;

        };

        return;

    }

    matches.forEach(m=>{

        const div=
        document.createElement("div");

        div.style.padding="10px";

        div.style.cursor="pointer";

        div.innerHTML=`

        <b>${m.generic_name}</b>

        ${m.brand_name
        ? "("+m.brand_name+")"
        : ""}

        `;

        div.onclick=function(){

            document
            .getElementById("medication")
            .value=m.id;

            searchInput.value=m.generic_name;

            results.style.display="none";

        };

        results.appendChild(div);

    });

    results.style.display="block";

});

document
.getElementById("saveMedication")
.onclick = async function () {

    // =========================================================
    // Validate Generic Name
    // =========================================================

    const genericName =
        document
            .getElementById("newGeneric")
            .value
            .trim();

    if (genericName === "") {

        alert(
            "Generic name is required."
        );

        return;
    }


    try {

        // =====================================================
        // Create Medication Reference
        // =====================================================

        const medRef =
            push(
                ref(
                    database,
                    "medications"
                )
            );


        const medicationId =
            medRef.key;


        // =====================================================
        // Create Medication Object
        // =====================================================

        const medication = {

            medication_id:
                medicationId,

            generic_name:
                genericName,

            brand_name:
                document
                    .getElementById("newBrand")
                    .value
                    .trim(),

            drug_class:
                document
                    .getElementById("newDrugClass")
                    .value
                    .trim(),

            form:
                document
                    .getElementById("newForm")
                    .value,

            created_at:
                new Date().toISOString()

        };


        // =====================================================
        // Save Medication
        // =====================================================

        await set(
            medRef,
            medication
        );


        // =====================================================
        // Log Medicine Creation
        // =====================================================

        try {

            await logMedicineCreated(
                database,
                auth,
                {

                    medicationId:
                        medicationId,

                    genericName:
                        medication.generic_name,

                    brandName:
                        medication.brand_name,

                    drugClass:
                        medication.drug_class,

                    dosageForm:
                        medication.form

                }
            );


            console.log(
                "Medicine creation activity logged."
            );

        }
        catch (logError) {

            /*
             * The medication was already saved.
             * A logging error should not make the
             * medication creation appear unsuccessful.
             */

            console.error(
                "Activity logging failed:",
                logError
            );

        }


        // =====================================================
        // Add Medication To Local Array
        // =====================================================

        medications.push({

            id:
                medicationId,

            ...medication

        });


        // =====================================================
        // Select Newly Created Medication
        // =====================================================

        document
            .getElementById("medication")
            .value =
            medicationId;


        document
            .getElementById("medicationSearch")
            .value =
            medication.generic_name;


        // =====================================================
        // Hide New Medication Panel
        // =====================================================

        document
            .getElementById("newMedicationPanel")
            .style.display =
                "none";


        // =====================================================
        // Clear Fields
        // =====================================================

        document
            .getElementById("newGeneric")
            .value = "";

        document
            .getElementById("newBrand")
            .value = "";

        document
            .getElementById("newDrugClass")
            .value = "";

        document
            .getElementById("newForm")
            .selectedIndex = 0;


        alert(
            "Medication added."
        );


    }
    catch (error) {

        console.error(
            "Error creating medication:",
            error
        );


        alert(
            "Failed to add medication: " +
            error.message
        );

    }

};

results.style.display = "none";
results.innerHTML = "";

document
.getElementById("cancelMedication")
.onclick = function(){

    document
    .getElementById("newMedicationPanel")
    .style.display = "none";

    // Clear all fields
    document.getElementById("newGenericName").value = "";
    document.getElementById("newBrandName").value = "";
    document.getElementById("newDrugClass").value = "";
    document.getElementById("newDosageForm").selectedIndex = 0;

};

function renderTimes(){

    const ul =
    document.getElementById("timeList");

    ul.innerHTML = "";

    selectedTimes.forEach(time => {

        const [h,m] =
        time.split(":").map(Number);

        const period =
        h >= 12 ? "PM" : "AM";

        const hour12 =
        h % 12 || 12;

        ul.innerHTML +=
        `<li>${hour12}:${String(m).padStart(2,"0")} ${period}</li>`;

    });

}

document
.getElementById("frequency")
.addEventListener("change", calculateAdministrationTimes);

document
.getElementById("addMedication")
.onclick=function(){

const medId =
document.getElementById("medication").value;

const med =
medications.find(
m=>m.id===medId
);

if(!med){

    alert("Select a medication first.");

    return;

}

prescriptionItems.push({

medication_id:med.id,

medication_name:med.generic_name,

dosage:

document
.getElementById("dosage")
.value,

route:

document
.getElementById("route")
.value,

frequency:

document
.getElementById("frequency")
.value,

administration_times:

[...selectedTimes],

start_date:

document
.getElementById("startDate")
.value,

end_date:

document
.getElementById("endDate")
.value

});

document.getElementById("dosage").value = ""; 
document.getElementById("frequency").value = ""; 
document.getElementById("startDate").value = ""; 
document.getElementById("endDate").value = ""; 
document.getElementById("medication").value = ""; 
document.getElementById("medicationSearch").value = "";

selectedTimes = [];

renderTimes();

renderMedications();

};

function renderMedications(){

const tbody=

document.getElementById("medicationTable");

tbody.innerHTML="";

prescriptionItems.forEach((item,index)=>{

tbody.innerHTML+=`

<tr>

<td>${item.medication_name}</td>

<td>${item.dosage}</td>

<td>${item.frequency}</td>

<td>${item.administration_times.join(", ")}</td>

<td>

<button

type="button"

onclick="removeMedication(${index})">

Remove

</button>

</td>

</tr>

`;

});

}

window.removeMedication=function(index){

prescriptionItems.splice(index,1);

renderMedications();

}

document
.getElementById("prescriptionForm")
.addEventListener(
    "submit",
    async function(e) {

        e.preventDefault();


        // =====================================================
        // Validate Medications
        // =====================================================

        if (prescriptionItems.length === 0) {

            alert(
                "Please add at least one medication."
            );

            return;
        }


        // =====================================================
        // Build Payload
        // =====================================================

        const payload = {

            patient_id:
                document
                    .getElementById("patient")
                    .value,

            physician_uid:
                document
                    .getElementById("physicianUid")
                    .value,

            physician_name:
                document
                    .getElementById("physician")
                    .value,

            notes:
                document
                    .getElementById("notes")
                    .value,

            items:
                prescriptionItems

        };


        const statusElement =
            document.getElementById("status");


        statusElement.textContent =
            "Saving prescription...";


        try {

            // =================================================
            // Save Prescription Through PHP
            // =================================================

            const response =
                await fetch(
                    "add_prescription.php",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(payload)
                    }
                );


            // =================================================
            // Read PHP Response
            // =================================================

            const result =
                await response.json();


            console.log(
                "Prescription PHP response:",
                result
            );


            // =================================================
            // Check PHP Result
            // =================================================

            if (
                !response.ok ||
                result.success !== true
            ) {

                throw new Error(
                    result.message ||
                    "Failed to save prescription."
                );

            }


            // =================================================
            // Get Prescription ID
            // =================================================

            const prescriptionId =
                result.prescription_id;


            // =================================================
            // Build Medication List For Activity Log
            // =================================================

            const medicationsForLog =
                prescriptionItems.map(item => ({

                    medicationId:
                        item.medication_id,

                    medicationName:
                        item.medication_name,

                    dosage:
                        item.dosage,

                    route:
                        item.route,

                    frequency:
                        item.frequency,

                    administrationTimes:
                        item.administration_times,

                    startDate:
                        item.start_date,

                    endDate:
                        item.end_date

                }));


            // =================================================
            // Write Activity Log
            // =================================================

            try {

                await logPrescriptionCreated(
                    database,
                    auth,
                    {

                        prescriptionId:
                            prescriptionId,

                        patientId:
                            payload.patient_id,

                        patientName:
                            document
                                .getElementById("patient")
                                .selectedOptions[0]
                                ?.textContent
                                .trim() || "",

                        physicianUid:
                            payload.physician_uid,

                        physicianName:
                            payload.physician_name,

                        medications:
                            medicationsForLog

                    }
                );


                console.log(
                    "Prescription activity logged."
                );

            }
            catch (logError) {

                /*
                 * The prescription was already saved.
                 * A logging failure should not make the
                 * user think the prescription failed.
                 */

                console.error(
                    "Activity logging failed:",
                    logError
                );

            }


            // =================================================
            // Display Success
            // =================================================

            statusElement.textContent =
                JSON.stringify(
                    result,
                    null,
                    4
                );


            // =================================================
            // Redirect
            // =================================================

            window.location.href =
                "view_prescriptions.html";


        }
        catch (error) {

            console.error(
                "Error saving prescription:",
                error
            );


            statusElement.textContent =
                "Failed to save prescription.\n\n" +
                error.message;


            alert(
                error.message
            );

        }

    }
);

</script>

</body>
</html>
