<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Edit Prescription</title>
</head>
<body>

<a href="dashboard.html">Back to Dashboard</a>

<h2>Edit Prescription</h2>

<form id="editForm">

<fieldset>
<legend><strong>Prescription Information</strong></legend>

<label>Patient</label><br>
<input type="text" id="patientName" readonly style="width:100%">

<br><br>

<label>Prescribing Physician</label><br>
<input type="text" id="physicianName" readonly style="width:100%">

<br><br>

<label>General Notes</label><br>
<textarea id="notes" rows="4" style="width:100%"></textarea>

</fieldset>

<fieldset>
<legend><strong>Add Medication</strong></legend>

<label>Medication</label><br>
<select id="newMedication" style="width:100%"></select>

<br><br>

<label>Dosage</label><br>
<input type="text" id="newDosage" style="width:100%">

<br><br>

<label>Route</label><br>
<select id="newRoute" style="width:100%">
<option value="oral">Oral</option>
<option value="iv">IV</option>
<option value="im">IM</option>
<option value="subcutaneous">Subcutaneous</option>
<option value="topical">Topical</option>
<option value="inhalation">Inhalation</option>
</select>

<br><br>

<label>Frequency</label><br>
<select id="newFrequency" style="width:100%">
<option value="OD">OD (once daily)</option>
<option value="OD HS">OD HS (once daily at bedtime)</option>
<option value="OD AC">OD AC (once daily before meals)</option>
<option value="OD LUNCH">OD (once daily) at lunch</option>
<option value="BID">BID (twice daily)</option>
<option value="TID">TID (three times daily)</option>
<option value="Q12">Q12 (every 12 hours)</option>
</select>

<br><br>

<label>Start Date</label><br>
<input type="date" id="newStartDate" style="width:100%">

<br><br>

<label>End Date</label><br>
<input type="date" id="newEndDate" style="width:100%">

<br><br>

<button type="button" id="addMedicationBtn">Add Medication</button>

</fieldset>

<fieldset>
<legend><strong>Medications</strong></legend>

<table>
<thead>
<tr>
<th>Medication</th>
<th>Dosage</th>
<th>Route</th>
<th>Frequency</th>
<th>Times</th>
<th>Start</th>
<th>End</th>
<th>Action</th>
</tr>
</thead>
<tbody id="medTable"></tbody>
</table>

</fieldset>

<button type="submit">Save Changes</button>

</form>

<pre id="status"></pre>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";

import {
    getDatabase,
    ref,
    get,
    update,
    remove,
    push,
    set
}
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyBRm3dUt3HreTquM_Ba9JfYmZD2CLVV0Gc",
    authDomain: "meditrack-59cca.firebaseapp.com",
    databaseURL: "https://meditrack-59cca-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "meditrack-59cca",
    storageBucket: "meditrack-59cca.firebasestorage.app",
    messagingSenderId: "656003988692",
    appId: "1:656003988692:web:badfe96b7d830837a4cf41"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const params = new URLSearchParams(window.location.search);
const prescriptionId = params.get("id");

let medications = [];
let prescriptionItems = [];

const scheduleMap = {
    "OD":["08:00"],
    "OD HS":["21:00"],
    "OD AC":["05:00"],
    "OD LUNCH":["13:00"],
    "BID":["08:00","18:00"],
    "TID":["08:00","13:00","18:00"],
    "Q12":["08:00","20:00"]
};

function formatTimes(times=[]){
    return times.join(", ");
}

async function loadMedications(){

    const snapshot = await get(ref(db,"medications"));

    const select = document.getElementById("newMedication");

    select.innerHTML = "";

    snapshot.forEach(child=>{

        const med = child.val();

        medications.push({
            id:child.key,
            ...med
        });

        select.innerHTML += `
            <option value="${child.key}">
                ${med.generic_name}
            </option>
        `;

    });

}

async function loadPrescription(){

    const snapshot =
    await get(ref(db,"prescriptions/"+prescriptionId));

    if(!snapshot.exists()){

        alert("Prescription not found.");

        return;

    }

    const p = snapshot.val();

    document.getElementById("patientName").value =
    p.patient_name || "";

    document.getElementById("physicianName").value =
    p.physicianName || "";

    document.getElementById("notes").value =
    p.notes || "";

    const itemsSnap =
    await get(ref(db,"prescription_items"));

    prescriptionItems = [];

    itemsSnap.forEach(child=>{

        const item = child.val();

        if(item.prescription_id === prescriptionId){

            prescriptionItems.push({
                id:child.key,
                ...item
            });

        }

    });

    renderItems();

}

function renderItems(){

    const tbody = document.getElementById("medTable");

    tbody.innerHTML = "";

    prescriptionItems.forEach((item,index)=>{

        tbody.innerHTML += `
        <tr>
            <td>${item.medication_name}</td>
            <td>
                <input type="text" value="${item.dosage || ""}"
                    onchange="window.updateField(${index},'dosage',this.value)">
            </td>
            <td>
                <select onchange="window.updateField(${index},'route',this.value)">
                    <option value="oral" ${item.route==='oral'?'selected':''}>Oral</option>
                    <option value="iv" ${item.route==='iv'?'selected':''}>IV</option>
                    <option value="im" ${item.route==='im'?'selected':''}>IM</option>
                    <option value="subcutaneous" ${item.route==='subcutaneous'?'selected':''}>Subcutaneous</option>
                    <option value="topical" ${item.route==='topical'?'selected':''}>Topical</option>
                    <option value="inhalation" ${item.route==='inhalation'?'selected':''}>Inhalation</option>
                </select>
            </td>
            <td>
                <select onchange="window.changeFrequency(${index},this.value)">
                    ${Object.keys(scheduleMap).map(f=>
                        `<option value="${f}" ${item.frequency===f?'selected':''}>${f}</option>`
                    ).join('')}
                </select>
            </td>
            <td>${formatTimes(item.administration_times)}</td>
            <td>
                <input type="date" value="${item.start_date || ""}"
                    onchange="window.updateField(${index},'start_date',this.value)">
            </td>
            <td>
                <input type="date" value="${item.end_date || ""}"
                    onchange="window.updateField(${index},'end_date',this.value)">
            </td>
            <td>
                <button type="button" onclick="window.removeItem(${index})">Remove</button>
            </td>
        </tr>
        `;

    });

}

window.updateField = function(index,field,value){

    prescriptionItems[index][field] = value;

};

window.changeFrequency = function(index,value){

    prescriptionItems[index].frequency = value;

    prescriptionItems[index].administration_times =
    scheduleMap[value] || [];

    renderItems();

};

window.removeItem = function(index){

    prescriptionItems.splice(index,1);

    renderItems();

};

document.getElementById("addMedicationBtn")
.addEventListener("click",()=>{

    const medId =
    document.getElementById("newMedication").value;

    const med =
    medications.find(m=>m.id===medId);

    if(!med) return;

    const frequency =
    document.getElementById("newFrequency").value;

    prescriptionItems.push({

        medication_id:med.id,
        medication_name:med.generic_name,
        dosage:document.getElementById("newDosage").value,
        route:document.getElementById("newRoute").value,
        frequency:frequency,
        administration_times:scheduleMap[frequency] || [],
        start_date:document.getElementById("newStartDate").value,
        end_date:document.getElementById("newEndDate").value,
        status:"Active"

    });

    renderItems();

});

document.getElementById("editForm")
.addEventListener("submit",async(e)=>{

    e.preventDefault();

    try{

        await update(ref(db,"prescriptions/"+prescriptionId),{
            notes:document.getElementById("notes").value,
            updated_at:new Date().toISOString()
        });

        const itemsSnap =
        await get(ref(db,"prescription_items"));

        const existingIds = [];

        itemsSnap.forEach(child=>{

            const item = child.val();

            if(item.prescription_id === prescriptionId){

                existingIds.push(child.key);

            }

        });

        for(const id of existingIds){

            await remove(ref(db,"prescription_items/"+id));

        }

        for(const item of prescriptionItems){

            const itemRef =
            push(ref(db,"prescription_items"));

            await set(itemRef,{
                prescription_id:prescriptionId,
                medication_id:item.medication_id,
                medication_name:item.medication_name,
                dosage:item.dosage,
                route:item.route,
                frequency:item.frequency,
                administration_times:item.administration_times,
                start_date:item.start_date,
                end_date:item.end_date,
                status:"Active"
            });

        }

        document.getElementById("status").textContent =
        "Prescription updated successfully.";

        alert("Prescription updated successfully.");

    }catch(error){

        document.getElementById("status").textContent =
        error.message;

    }

});

await loadMedications();
await loadPrescription();

</script>

</body>
</html>
