<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Inventory</title>

    <link rel="stylesheet" href="stylesheets/add_inventory.css">
</head>
<body>

<a href="dashboard.html">Back to Dashboard</a>

<h2>Medication Inventory</h2>
<label>Required fields are marked with an asterisk &#x28;<span style="color:red;">*</span>&#41;</label>
<br><br>
<form id="inventoryForm">

<fieldset>

    <legend><strong>Medication Information</strong></legend>

    <label>Select Medication <span style="color:red;">*</span></label><br>
    <select id="medication_id" required>
        <option value="">Loading medications...</option>
    </select>

    <br><br>

    <label>Generic Name</label><br>
    <input type="text" id="generic_name" readonly>

    <br><br>

    <label>Brand Name</label><br>
    <input type="text" id="brand_name" readonly>

    <br><br>

    <label>Drug Class</label><br>
    <input type="text" id="drug_class" readonly>

    <br><br>

    <label>Dosage Form</label><br>
    <input type="text" id="dosage_form" readonly>

</fieldset>

<br>

<fieldset>

<legend><strong>Inventory Details</strong></legend>

<label>Lot Number <span style="color:red;">*</span></label><br>
<input type="text" id="lot_number" required>

<br><br>

<label>Batch Number <span style="color:red;">*</span></label><br>
<input type="text" id="batch_number">

<br><br>

<label>Manufacturer <span style="color:red;">*</span></label><br>
<input type="text" id="manufacturer">

<br><br>

<label>Expiration Date <span style="color:red;">*</span></label><br>
<input type="date" id="expiration_date" required>

<br><br>

<label>Purchase Date <span style="color:red;">*</span></label><br>
<input type="date" id="purchase_date">

<br><br>

<label>Unit Cost <span style="color:red;">*</span></label><br>
<input type="number" id="unit_cost" step="0.01" min="0">

<br><br>

<label>Selling Price <span style="color:red;">*</span></label><br>
<input type="number" id="selling_price" step="0.01" min="0">

<br><br>

<label>Quantity in Stock <span style="color:red;">*</span></label><br>
<input type="number" id="quantity_in_stock" min="0" required>

<br><br>

<label>Reorder Level <span style="color:red;">*</span></label><br>
<input
type="number"
id="reorder_level"
value="10"
min="0">

<br><br>

<label>Storage Location <span style="color:red;">*</span></label><br>

<select id="storage_location" required>
    <option value="">-- Select Storage Location --</option>
    <option value="Cabinet 1">Cabinet 1</option>
    <option value="Cabinet 2">Cabinet 2</option>
    <option value="Cabinet 3">Cabinet 3</option>
    <option value="Cabinet 4">Cabinet 4</option>
    <option value="Freezer">Freezer</option>
    <option value="Refridgerator">Refridgerator</option>
</select>

</fieldset>

<br>

<button type="submit">

Save Inventory

</button>

<button type="reset">

Clear

</button>

</form>

<hr>

<pre id="status">Waiting...</pre>

<script type="module">

// ============================================================
// Activity Logging
// ============================================================

import {
    logInventoryAdded
} from "../js/activity_log.js";


// ============================================================
// Firebase SDK
// ============================================================

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";

import {
    getAuth
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";

import {
    getDatabase,
    ref,
    get
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-database.js";


// ============================================================
// Firebase Configuration
// ============================================================

const firebaseConfig = {
    apiKey: "AIzaSyBRm3dUt3HreTquM_Ba9JfYmZD2CLVV0Gc",
    authDomain: "meditrack-59cca.firebaseapp.com",
    databaseURL: "https://meditrack-59cca-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "meditrack-59cca",
    storageBucket: "meditrack-59cca.firebasestorage.app",
    messagingSenderId: "656003988692",
    appId: "1:656003988692:web:badfe96b7d830837a4cf41"
};



// ============================================================
// Initialize Firebase
// ============================================================

const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const database =
    getDatabase(app);


// ============================================================
// DOM Elements
// ============================================================

const medicationSelect =
    document.getElementById("medication_id");

const genericName =
    document.getElementById("generic_name");

const brandName =
    document.getElementById("brand_name");

const drugClass =
    document.getElementById("drug_class");

const dosageForm =
    document.getElementById("dosage_form");

const status =
    document.getElementById("status");

const inventoryForm =
    document.getElementById("inventoryForm");


let medications = {};


// ============================================================
// Load Medications
// ============================================================

async function loadMedications() {

    try {

        const snapshot =
            await get(
                ref(
                    database,
                    "medications"
                )
            );


        medicationSelect.innerHTML =
            '<option value="">-- Select Medication --</option>';


        if (!snapshot.exists()) {

            medicationSelect.innerHTML =
                '<option value="">No medications found</option>';

            return;

        }


        snapshot.forEach(child => {

            const med =
                child.val();


            medications[child.key] =
                med;


            const option =
                document.createElement("option");


            option.value =
                child.key;


            option.textContent =
                `${med.generic_name}` +
                (
                    med.brand_name
                        ? ` (${med.brand_name})`
                        : ""
                ) +
                ` - ${med.form}`;


            medicationSelect.appendChild(
                option
            );

        });

    }
    catch (error) {

        console.error(
            "Error loading medications:",
            error
        );


        status.textContent =
            "Error loading medications: " +
            error.message;

    }

}


loadMedications();


// ============================================================
// Populate Medication Details
// ============================================================

medicationSelect.addEventListener(
    "change",
    () => {

        const med =
            medications[
                medicationSelect.value
            ];


        if (!med) {

            genericName.value = "";
            brandName.value = "";
            drugClass.value = "";
            dosageForm.value = "";

            return;

        }


        genericName.value =
            med.generic_name || "";


        brandName.value =
            med.brand_name || "";


        drugClass.value =
            med.drug_class || "";


        dosageForm.value =
            med.form || "";

    }
);


// ============================================================
// Save Inventory
// ============================================================

inventoryForm.addEventListener(
    "submit",
    async function(e) {

        e.preventDefault();


        status.textContent =
            "Saving inventory...";


        // ====================================================
        // Collect Form Data
        // ====================================================

        const data = {

            medication_id:
                medicationSelect.value,

            generic_name:
                genericName.value.trim(),

            brand_name:
                brandName.value.trim(),

            drug_class:
                drugClass.value.trim(),

            dosage_form:
                dosageForm.value.trim(),

            lot_number:
                document
                    .getElementById("lot_number")
                    .value
                    .trim(),

            batch_number:
                document
                    .getElementById("batch_number")
                    .value
                    .trim(),

            manufacturer:
                document
                    .getElementById("manufacturer")
                    .value
                    .trim(),

            expiration_date:
                document
                    .getElementById("expiration_date")
                    .value,

            purchase_date:
                document
                    .getElementById("purchase_date")
                    .value,

            unit_cost:
                document
                    .getElementById("unit_cost")
                    .value,

            selling_price:
                document
                    .getElementById("selling_price")
                    .value,

            quantity_in_stock:
                document
                    .getElementById("quantity_in_stock")
                    .value,

            reorder_level:
                document
                    .getElementById("reorder_level")
                    .value,

            storage_location:
                document
                    .getElementById("storage_location")
                    .value
                    .trim()

        };


        try {

            // =================================================
            // Send Data to PHP
            // =================================================

            const response =
                await fetch(
                    "add_inventory.php",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(data)
                    }
                );


            // =================================================
            // Read PHP Response
            // =================================================

            const result =
                await response.json();


            console.log(
                "PHP response:",
                result
            );


            // =================================================
            // Check PHP Result
            // =================================================

            if (!result.success) {
                
                throw new Error(
                    result.message ||
                    "Failed to save inventory."
                );

            }


            // =================================================
            // Inventory Successfully Created
            // =================================================

            // =================================================
            // Display Success
            // =================================================

            status.textContent =
                "Inventory successfully added.\n\n" +
                JSON.stringify(
                    result,
                    null,
                    4
                );


            // =================================================
            // Redirect to Inventory List
            // =================================================

            setTimeout(() => {
                window.location.href = "view_inventory.html";
            }, 500);

            // =================================================
            // Write Activity Log
            // =================================================

            try {

                await logInventoryAdded(
                    database,
                    auth,
                    {

                        inventoryId:
                            inventoryId,

                        medicationId:
                            data.medication_id,

                        medicineName:
                            data.generic_name,

                        quantity:
                            Number(
                                data.quantity_in_stock
                            ),

                        batchNumber:
                            data.batch_number,

                        lotNumber:
                            data.lot_number

                    }
                );


                console.log(
                    "Inventory activity logged."
                );

            }
            catch (logError) {

                // Logging failure should not make
                // a successful inventory save fail.

                console.error(
                    "Activity logging failed:",
                    logError
                );

            }


            // =================================================
            // Display Success
            // =================================================

            status.textContent =
                JSON.stringify(
                    result,
                    null,
                    4
                );


            // =================================================
            // Reset Form
            // =================================================

            inventoryForm.reset();

            genericName.value = "";
            brandName.value = "";
            drugClass.value = "";
            dosageForm.value = "";


        }
        catch (error) {

            console.error(
                "Inventory save error:",
                error
            );


            status.textContent =
                "Failed to save inventory.\n\n" +
                error.message;

        }

    }
);

</script>

</body>
</html>
