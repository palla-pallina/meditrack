<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Medication</title>

    <link
        rel="stylesheet"
        href="stylesheets/add_medication.css"
    >
    <link rel="icon" type="image/x-icon" href="../../draft.png">

</head>

<body>

<a href="dashboard.html">
    Back to Dashboard
</a>

<h2>Add Medication</h2>
<label>Required fields are marked with an asterisk &#x28;<span style="color:red;">*</span>&#41;</label>
<br><br>

<form id="medicationForm">

    <fieldset>

        <legend>
            <strong>Medication Information</strong>
        </legend>


        <label for="generic_name">
            Generic Name
            <span style="color:red;">*</span>
        </label>

        <br>

        <input
            type="text"
            id="generic_name"
            name="generic_name"
            maxlength="150"
            required
        >

        <br><br>


        <label for="brand_name">
            Brand Name
        </label>

        <br>

        <input
            type="text"
            id="brand_name"
            name="brand_name"
            maxlength="150"
        >

        <br><br>


        <label for="drug_class">
            Drug Class
        </label>

        <br>

        <input
            type="text"
            id="drug_class"
            name="drug_class"
            maxlength="100"
            placeholder="e.g. Antibiotic, NSAID, Antihypertensive"
        >

        <br><br>


        <label for="form">
            Dosage Form
            <span style="color:red;">*</span>
        </label>

        <br>

        <select
            id="form"
            name="form"
            required
        >

            <option value="">
                -- Select Dosage Form --
            </option>

            <option value="tablet">
                Tablet
            </option>

            <option value="capsule">
                Capsule
            </option>

            <option value="injection">
                Injection
            </option>

            <option value="syrup">
                Syrup
            </option>

            <option value="cream">
                Cream
            </option>

            <option value="inhaler">
                Inhaler
            </option>

            <option value="other">
                Other
            </option>

        </select>

    </fieldset>


    <br>


    <input
        type="submit"
        value="Save Medication"
    >

    <input
        type="reset"
        value="Clear"
    >

</form>


<hr>

<h3>Status</h3>

<pre id="status">Waiting...</pre>


<script type="module">

// ============================================================
// IMPORT ACTIVITY LOGGER
// ============================================================

import {
    logMedicineCreated
} from "../js/activity_log.js";


// ============================================================
// FIREBASE
// ============================================================

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";

import {
    getDatabase,
    ref,
    get
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-database.js";


// ============================================================
// FIREBASE CONFIGURATION
// ============================================================

const firebaseConfig = {
    apiKey: "AIzaSyBRm3dUt3HreTquM_Ba9JfYmZD2CLVV0Gc",
    authDomain: "meditrack-59cca.firebaseapp.com",
    databaseURL: "https://meditrack-59cca-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "meditrack-59cca",
    storageBucket: "meditrack-59cca.firebasestorage.app",
    messagingSenderId: "656003988692",
    appId: "1:656003988692:web:badfe96b7d830837a4cf41"
};


// ============================================================
// INITIALIZE FIREBASE
// ============================================================

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const database = getDatabase(app);

// ============================================================
// PHARMACIST ACCESS VALIDATION
// ============================================================

document.body.style.visibility = "hidden";

async function validatePharmacistAccess() {
    try {
        const user = await new Promise((resolve, reject) => {
            const unsubscribe = onAuthStateChanged(
                auth,
                (authenticatedUser) => {
                    unsubscribe();
                    resolve(authenticatedUser);
                },
                reject
            );
        });

        if (!user) {
            console.error("Access denied: No authenticated user.");
            window.location.replace("../../index.html");
            return false;
        }

        console.log("Authenticated UID:", user.uid);

        const userSnapshot = await get(
            ref(database, `users/${user.uid}`)
        );

        console.log("User record exists:", userSnapshot.exists());

        if (!userSnapshot.exists()) {
            console.error(
                `Access denied: No record at users/${user.uid}`
            );
            window.location.replace("../../index.html");
            return false;
        }

        const userData = userSnapshot.val();

        console.log("User record:", userData);
        console.log("Stored userType:", userData.userType);

        const userType = String(userData.userType ?? "")
            .trim()
            .toLowerCase();

        if (userType !== "pharmacist") {
            console.error(
                "Access denied: Expected Pharmacist, received:",
                userData.userType
            );

            window.location.replace("../../index.html");
            return false;
        }

        document.body.style.visibility = "visible";
        return true;

    } catch (error) {
        console.error("Pharmacist validation failed:", error);

        window.location.replace("../../index.html");
        return false;
    }
}

if (!(await validatePharmacistAccess())) {
    throw new Error("Unauthorized access.");
}


// Stop execution if access is denied
if (!(await validatePharmacistAccess())) {

    throw new Error("Unauthorized access.");

}

// ============================================================
// DOM ELEMENTS
// ============================================================

const form =
    document.getElementById("medicationForm");

const status =
    document.getElementById("status");


// ============================================================
// FORM SUBMISSION
// ============================================================

form.addEventListener(
    "submit",
    async function (e) {

        e.preventDefault();


        status.textContent =
            "Saving medication...";


        // ====================================================
        // COLLECT FORM DATA
        // ====================================================

        const data = {

            generic_name:
                document
                    .getElementById("generic_name")
                    .value
                    .trim(),

            brand_name:
                document
                    .getElementById("brand_name")
                    .value
                    .trim(),

            drug_class:
                document
                    .getElementById("drug_class")
                    .value
                    .trim(),

            form:
                document
                    .getElementById("form")
                    .value

        };


        try {

            // =================================================
            // SEND TO PHP
            // =================================================

            const response =
                await fetch(
                    "add_medication.php",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(data)
                    }
                );


            // =================================================
            // READ PHP RESPONSE FIRST
            // =================================================

            const result =
                await response.json();


            console.log(
                "PHP response:",
                result
            );


            // =================================================
            // CHECK PHP RESULT
            // =================================================

            if (!result.success) {

                throw new Error(
                    result.message ||
                    "Failed to save medication."
                );

            }


            // =================================================
            // MEDICATION WAS SAVED
            // =================================================

            const medicationId =
                result.medication_id;


            console.log(
                "Medication created:",
                medicationId
            );


            // =================================================
            // ACTIVITY LOG
            // =================================================

            try {

                await logMedicineCreated(
                    database,
                    auth,
                    {

                        medicationId:
                            medicationId,

                        genericName:
                            data.generic_name,

                        brandName:
                            data.brand_name,

                        drugClass:
                            data.drug_class,

                        dosageForm:
                            data.form

                    }
                );


                console.log(
                    "Activity log created."
                );

            }
            catch (logError) {

                // Logging failure should NOT
                // cancel the medication creation.

                console.error(
                    "Activity logging failed:",
                    logError
                );

            }


            // =================================================
            // SUCCESS MESSAGE
            // =================================================

            status.textContent =
                "Medication added successfully.\n\n" +
                JSON.stringify(
                    result,
                    null,
                    4
                );


            // =================================================
            // RESET FORM
            // =================================================

            form.reset();

        }
        catch (error) {

            console.error(
                "Medication save error:",
                error
            );


            status.textContent =
                "Failed to save medication.\n\n" +
                error.message;

        }

    }
);

</script>

</body>
</html>
