<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Medication</title>
</head>
<body>

<a href="dashboard.html">Back to Dashboard</a>

<h2>Add Medication</h2>

<form id="medicationForm">

    <fieldset>
        <legend><strong>Medication Information</strong></legend>

        <label for="generic_name">Generic Name <span style="color:red;">*</span></label><br>
        <input
            type="text"
            id="generic_name"
            name="generic_name"
            maxlength="150"
            required>
        <br><br>

        <label for="brand_name">Brand Name</label><br>
        <input
            type="text"
            id="brand_name"
            name="brand_name"
            maxlength="150">
        <br><br>

        <label for="drug_class">Drug Class</label><br>
        <input
            type="text"
            id="drug_class"
            name="drug_class"
            maxlength="100"
            placeholder="e.g. Antibiotic, NSAID, Antihypertensive">
        <br><br>

        <label for="form">Dosage Form <span style="color:red;">*</span></label><br>
        <select id="form" name="form" required>
            <option value="">-- Select Dosage Form --</option>
            <option value="tablet">Tablet</option>
            <option value="capsule">Capsule</option>
            <option value="injection">Injection</option>
            <option value="syrup">Syrup</option>
            <option value="cream">Cream</option>
            <option value="inhaler">Inhaler</option>
        </select>

    </fieldset>

    <br>

    <input type="submit" value="Save Medication">
    <input type="reset" value="Clear">
</form>

<hr>

<h3>Status</h3>

<pre id="status">Waiting...</pre>

<script>

const form = document.getElementById("medicationForm");
const status = document.getElementById("status");

form.addEventListener("submit", async function(e){

    e.preventDefault();

    status.textContent = "Saving medication...";

    const data = {

        generic_name:
            document.getElementById("generic_name").value.trim(),

        brand_name:
            document.getElementById("brand_name").value.trim(),

        drug_class:
            document.getElementById("drug_class").value.trim(),

        form:
            document.getElementById("form").value

    };

    try{

        const response = await fetch("add_medication.php",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify(data)

        });

        const result = await response.json();

        status.textContent =
            JSON.stringify(result,null,4);

        if(result.success){

            form.reset();

        }

    }
    catch(error){

        status.textContent = error.message;

    }

});

</script>
</body>
</html>
