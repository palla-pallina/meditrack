<html>
<head>
<title>MediTrack Dispenser Control</title>
</head>

<body>
<form id="compartmentForm">

    <fieldset>
        <legend><strong>Dispenser Compartment</strong></legend>

        <label>Compartment Name *</label><br>
        <input
            type="text"
            id="compartmentName"
            placeholder="Carousel 1"
            required><br><br>

        <label>Medication *</label><br>
        <select id="medicationSelect" required>
            <option value="">Loading medications...</option>
        </select><br><br>

        <label>Brand Name</label><br>
        <input
            type="text"
            id="brandName"
            readonly><br><br>

        <label>Dosage Form</label><br>
        <input
            type="text"
            id="form"
            readonly><br><br>

        <label>Inventory Amount *</label><br>
        <input
            type="number"
            id="inventoryAmount"
            min="0"
            max="21"
            value="0"
            required><br><br>

        <label>Maximum Capacity</label><br>
        <input
            type="number"
            value="21"
            readonly><br><br>

    </fieldset>

    <br>

    <button type="submit">
        Save Compartment
    </button>

    <button type="reset">
        Clear
    </button>

    <button
        type="button"
        onclick="history.back()">
        Back
    </button>

</form>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";

import {
    getDatabase,
    ref,
    get,
    set,
    update
}
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";

import { requireRole }
from "../../public/auth_guard.js";

requireRole("Admin");

import {
    getAuth,
    signOut
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";

const auth = getAuth();

const firebaseConfig = {
    apiKey: "AIzaSyBRm3dUt3HreTquM_Ba9JfYmZD2CLVV0Gc",
    authDomain: "meditrack-59cca.firebaseapp.com",
    databaseURL: "https://meditrack-59cca-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "meditrack-59cca",
    storageBucket: "meditrack-59cca.firebasestorage.app",
    messagingSenderId: "656003988692",
    appId: "1:656003988692:web:badfe96b7d830837a4cf41"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const DISPENSER_UNIT = "Main Dispenser";

const compartmentForm = document.getElementById("compartmentForm");
const medicationSelect = document.getElementById("medicationSelect");

const compartmentName = document.getElementById("compartmentName");
const brandName = document.getElementById("brandName");
const dosageForm = document.getElementById("form");
const inventoryAmount = document.getElementById("inventoryAmount");

let inventoryItems = {};

// --------------------------
// Generate Compartment ID
// --------------------------

async function generateCompartmentId(){

    try{

        const snapshot = await get(
            ref(db,"dispenser_unit/" + DISPENSER_UNIT)
        );

        let count = 1;

        if(snapshot.exists()){

            count = 0;

            snapshot.forEach(()=>{
                count++;
            });

            count++;
        }

        return "MD-C" + String(count).padStart(2,"0");

    }catch(error){

        console.error(error);

        throw error;

    }

}

// --------------------------
// Load Oral Medications From Inventory
// --------------------------

async function loadMedications(){

    try{

        medicationSelect.innerHTML =
        '<option value="">Select Medication</option>';

        const snapshot =
        await get(ref(db,"inventory"));

        if(!snapshot.exists()){

            alert("No inventory items found.");

            return;

        }

        snapshot.forEach(child=>{

            const item = child.val();

            const dosage =
            (item.form || "").trim().toLowerCase();

            // Only oral solid medications
            if(
                dosage !== "tablet" &&
                dosage !== "capsule"
            ){
                return;
            }

            // Skip empty stock
            if(Number(item.quantity_in_stock || 0) <= 0){
                return;
            }

            inventoryItems[child.key] = item;

            const option =
            document.createElement("option");

            option.value = child.key;

            option.textContent =
                `${item.generic_name} (${item.brand_name}) - Stock: ${item.quantity_in_stock}`;

            medicationSelect.appendChild(option);

        });

    }catch(error){

        console.error(error);

        alert(error.message);

    }

}

// --------------------------
// Inventory Item Changed
// --------------------------

medicationSelect.addEventListener("change",()=>{

    const item =
    inventoryItems[medicationSelect.value];

    if(!item){

        brandName.value = "";
        dosageForm.value = "";

        return;

    }

    brandName.value =
    item.brand_name || "";

    dosageForm.value =
    item.form || "";

});

// --------------------------
// Save Compartment
// --------------------------

// --------------------------
// Save Compartment
// --------------------------

compartmentForm.addEventListener("submit", async (e) => {

    e.preventDefault();

    try {

        const item =
        inventoryItems[medicationSelect.value];

        if (!item) {

            alert("Please select an oral medication.");

            return;

        }

        const dosage =
        (item.form || "").trim().toLowerCase();

        if (
            dosage !== "tablet" &&
            dosage !== "capsule"
        ) {

            alert("Only Tablet and Capsule medications are allowed.");

            return;

        }

        const inventory =
        Number(inventoryAmount.value);

        if (inventory <= 0 || inventory > 21) {

            alert("Inventory must be between 1 and 21.");

            return;

        }

        // Check available stock
        const currentStock =
        Number(item.quantity_in_stock || 0);

        if (inventory > currentStock) {

            alert(
                `Insufficient stock. Available: ${currentStock}`
            );

            return;

        }

        const compartmentId =
        await generateCompartmentId();

        // Save compartment
        await set(
            ref(
                db,
                "dispenser_unit/" +
                DISPENSER_UNIT +
                "/" +
                compartmentId
            ),
            {
                dispenser_unit: DISPENSER_UNIT,

                compartment_id: compartmentId,

                compartment_name:
                    compartmentName.value.trim(),

                inventory_amount: inventory,

                inventory_id: medicationSelect.value,

                medication_id: item.medication_id,

                medication_name: item.generic_name,

                brand_name: item.brand_name,

                form: item.form,

                lot_number: item.lot_number || "",

                batch_number: item.batch_number || "",

                expiration_date: item.expiration_date || "",

                created_at: new Date().toISOString(),

                updated_at: new Date().toISOString()
            }
        );

        // Deduct stock from inventory
        const newStock =
        currentStock - inventory;

        await update(
            ref(db, "inventory/" + medicationSelect.value),
            {
                quantity_in_stock: newStock,
                updated_at: new Date().toISOString()
            }
        );

        alert(
            `Compartment created successfully.\nRemaining stock: ${newStock}`
        );

        compartmentForm.reset();

        medicationSelect.innerHTML =
        '<option value="">Select Medication</option>';

        brandName.value = "";
        dosageForm.value = "";

        await loadMedications();

        window.location.href =
        "dispenser_dashboard.html";

    }
    catch (error) {

        console.error(error);

        alert(error.message);

    }

});

// --------------------------
// Initialize Page
// --------------------------

loadMedications();

</script>
</body>
</html>
