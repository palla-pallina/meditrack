<!DOCTYPE html>
<html lang="en">
<head>
    <title>MediTrack | Edit Dispenser Compartment</title>
</head>
<body>

<a href="dispenser_dashboard.html">Dashboard</a><br><br>

<h2>Edit Dispenser Compartment</h2>

<form id="editForm">

<fieldset>

<legend><strong>Compartment Information</strong></legend>

<label>Compartment ID</label><br>
<input type="text" id="compartmentId" readonly><br><br>

<label>Compartment Name *</label><br>
<input
type="text"
id="compartmentName"
required><br><br>

<label>Medication *</label><br>
<select id="medicationSelect" required>
<option value="">Loading...</option>
</select><br><br>

<label>Medication Name</label><br>
<input
type="text"
id="medicationName"
readonly><br><br>

<label>Brand Name</label><br>
<input
type="text"
id="brandName"
readonly><br><br>

<label>Drug Class</label><br>
<input
type="text"
id="drugClass"
readonly><br><br>

<label>Dosage Form</label><br>
<input
type="text"
id="form"
readonly><br><br>

<label>Inventory Amount *</label><br>
<input
type="number"
id="inventoryAmount"
min="0"
max="10"
required><br><br>

<label>Maximum Capacity</label><br>
<input
type="number"
value="10"
readonly>

</fieldset>

<br>

<button type="submit">
Update Compartment
</button>

<button
type="button"
onclick="history.back()">
Back
</button>

</form>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";

import {
getDatabase,
ref,
get,
update
}
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyBRm3dUt3HreTquM_Ba9JfYmZD2CLVV0Gc",
    authDomain: "meditrack-59cca.firebaseapp.com",
    databaseURL: "https://meditrack-59cca-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "meditrack-59cca",
    storageBucket: "meditrack-59cca.firebasestorage.app",
    messagingSenderId: "656003988692",
    appId: "1:656003988692:web:badfe96b7d830837a4cf41"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase();

const DISPENSER_UNIT = "Main Dispenser";

const params = new URLSearchParams(window.location.search);
const id = params.get("id");

const compartmentId =
document.getElementById("compartmentId");

const compartmentName =
document.getElementById("compartmentName");

const medicationSelect =
document.getElementById("medicationSelect");

const medicationName =
document.getElementById("medicationName");

const brandName =
document.getElementById("brandName");

const drugClass =
document.getElementById("drugClass");

const form =
document.getElementById("form");

const inventoryAmount =
document.getElementById("inventoryAmount");

let medications = {};

const oralForms = [
"Tablet",
"tablet",
"Capsule",
"capsule"
];

// --------------------
// Load medications
// --------------------

async function loadMedications(){

const snapshot =
await get(ref(db,"medications"));

medicationSelect.innerHTML =
'<option value="">Select Medication</option>';

if(!snapshot.exists()) return;

snapshot.forEach(child=>{

const med = child.val();

if(!oralForms.includes(med.form))
    return;

medications[child.key]=med;

const option =
document.createElement("option");

option.value = child.key;

option.text =
`${med.generic_name} (${med.brand_name})`;

medicationSelect.appendChild(option);

});

}

// --------------------
// Load compartment
// --------------------

async function loadCompartment(){

const snapshot =
await get(ref(db,
"dispenser_unit/Main Dispenser/" + id));

if(!snapshot.exists()){

alert("Compartment not found.");

window.location.href =
"view_dispenser_compartments.html";

return;

}

const c = snapshot.val();

compartmentId.value =
c.compartment_id;

compartmentName.value =
c.compartment_name;

inventoryAmount.value =
c.inventory_amount;

medicationSelect.value =
c.medication_id;

updateMedicationInfo();

}

// --------------------
// Medication autofill
// --------------------

function updateMedicationInfo(){

const med =
medications[medicationSelect.value];

if(!med){

medicationName.value="";
brandName.value="";
drugClass.value="";
form.value="";
return;

}

medicationName.value =
med.generic_name;

brandName.value =
med.brand_name;

drugClass.value =
med.drug_class;

form.value =
med.form;

}

medicationSelect.addEventListener(
"change",
updateMedicationInfo
);

// --------------------
// Initialize
// --------------------

await loadMedications();
await loadCompartment();

// --------------------
// Save
// --------------------

document
.getElementById("editForm")
.addEventListener("submit",
async(e)=>{

e.preventDefault();

const med =
medications[medicationSelect.value];

if(!med){

alert("Please select a medication.");

return;

}

const qty =
Number(inventoryAmount.value);

if(qty>10){

alert("Maximum capacity is 10.");

return;

}

await update(

ref(
db,
"dispenser_unit/Main Dispenser/" + id
),

{

dispenser_unit:
"Main Dispenser",

compartment_id:
compartmentId.value,

compartment_name:
compartmentName.value,

inventory_amount:
qty,

brand_name:
med.brand_name,

drug_class:
med.drug_class,

form:
med.form,

medication_name:
med.generic_name,

medication_id:
medicationSelect.value,

updated_at:
new Date().toISOString()

}

);

alert("Compartment updated successfully.");

window.location.href =
"view_compartment.html?id=" + id;

});

</script>

</body>
</html>
