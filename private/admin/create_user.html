<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Create User</title>
<link rel="stylesheet" href="stylesheets/create_user.css">
<link rel="icon" type="image/x-icon" href="../../draft.png">

</head>

<body>
<button onclick="history.back()">Back</button>

<h2>Create Staff Account</h2>
<label>Required fields are marked with an asterisk &#x28;<span style="color:red;">*</span>&#41;</label>

<form id="createUserForm">

    <label>User Type</label><br> <span style="color:red;">*</span>
    <select id="userType" required>
        <option value="">Select</option>
        <option>Admin</option>
        <option>Clerk</option>
        <option>Doctor</option>
        <option>Head Nurse</option>
        <option>Nurse</option>
        <option>Pharmacist</option>
    </select>

    <br><br>

    <label>First Name</label><br> <span style="color:red;">*</span>
    <input type="text" id="firstName" required>

    <br><br>

    <label>Middle Name</label><br>
    <input type="text" id="middleName">

    <br><br>

    <label>Last Name</label><br> <span style="color:red;">*</span>
    <input type="text" id="lastName" required>

    <br><br>

    <label>Suffix</label><br>
    <input type="text" id="suffix">

    <br><br>

    <label>Email</label><br> <span style="color:red;">*</span>
    <input type="email" id="email" required>

    <br><br>

    <button>Create Account</button>

</form>

<hr>

<pre id="output"></pre>

<script type="module">

import { requireRole }
from "../js/auth_guard.js";

requireRole("Admin");

import {
    getAuth,
    signOut
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";

const auth = getAuth();

document.getElementById("logoutBtn")
.addEventListener("click", async () => {

    try {

        await signOut(auth);

        window.location.href = "../../index.html";

    }
    catch(error) {

        alert(error.message);

    }

});
</script>

<script>

const form = document.getElementById("createUserForm");

form.addEventListener("submit", async function(e){

    e.preventDefault();

    const output = document.getElementById("output");

    output.textContent = "Creating account...";

    const data = {

        userType: document.getElementById("userType").value,

        firstName: document.getElementById("firstName").value,

        middleName: document.getElementById("middleName").value,

        lastName: document.getElementById("lastName").value,

        suffix: document.getElementById("suffix").value,

        email: document.getElementById("email").value

    };

    try{

        const response = await fetch("create_user.php",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify(data)

        });

        const result = await response.json();

        output.textContent =
            JSON.stringify(result,null,4);

        if(result.success){

            form.reset();

        }

    }
    catch(error){

        output.textContent = error;

    }

});

</script>

</body>
</html>
