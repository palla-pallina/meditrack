<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MediTrack User Dashboard.">

    <title>MediTrack | User Dashboard</title>

    <!-- ======================================================
         GOOGLE FONT
    ======================================================= -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" type="image/x-icon" href="../../draft.png">

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- ======================================================
         DASHBOARD CSS
    ======================================================= -->

    <link rel="stylesheet" href="stylesheets/dashboard.css">

    <!-- ======================================================
         LUCIDE ICONS
    ======================================================= -->

    <script src="https://unpkg.com/lucide@latest"></script>

</head>

<body>

<!-- ==========================================================
     HEADER
=========================================================== -->

<header class="topbar">

    <div class="topbar__inner">

        <!-- BRAND -->

        <div class="brand" aria-label="MediTrack Dashboard">

            <img
                src="../../draft.png"
                alt="MediTrack Logo"
                class="actual-logo"
                style="height: 50px;"
            >

            <span class="brand__text">

                <strong>
                    MediTrack
                </strong>

                <span id="brandRole">
                    User Dashboard
                </span>

            </span>

        </div>


        <!-- LOGOUT -->

        <button
            id="logoutBtn"
            class="logout-btn"
            type="button"
        >

            <i
                data-lucide="log-out"
                aria-hidden="true"
            ></i>

            <span>
                Log out
            </span>

        </button>

    </div>

</header>


<!-- ==========================================================
     MAIN DASHBOARD
=========================================================== -->

<main class="dashboard">


    <!-- ======================================================
         PAGE HEADING
    ======================================================= -->

    <section
        class="page-heading"
        aria-labelledby="page-title"
    >

        <div class="page-heading__content">

            <p
                class="page-heading__eyebrow"
                id="roleLabel"
            >
                User
            </p>

            <h1 id="page-title">
                Welcome
            </h1>

            <p id="page-description">
                 Manage users, operate the medicine dispenser, and review system functions. 
            </p>

        </div>


        <!-- ==================================================
             LIVE CLOCK
        =================================================== -->

        <div
            class="dashboard-clock"
            aria-label="Current time"
        >

            <div
                class="dashboard-clock__icon"
                aria-hidden="true"
            >
                <i data-lucide="clock-3"></i>
            </div>

            <div class="dashboard-clock__content">

                <span
                    id="currentDate"
                    class="dashboard-clock__date"
                >
                    Loading date...
                </span>

                <strong
                    id="currentTime"
                    class="dashboard-clock__time"
                >
                    --:--:--
                </strong>

            </div>

        </div>

    </section>


    <!-- ======================================================
         DASHBOARD MODULES
         
         Module cards are generated by JavaScript.
         Modify the MODULES array below for each role.
    ======================================================= -->

    <section
        class="module-grid"
        aria-label="Dashboard modules"
        id="moduleGrid"
    >
        <!-- Module cards generated by JavaScript -->
    </section>


    <!-- ======================================================
         RECENT ACTIVITY
    ======================================================= -->

    <section
        class="activity-preview"
        aria-labelledby="activity-title"
    >

        <div class="activity-preview__header">

            <div>

                <p class="page-heading__eyebrow">
                    System Monitoring
                </p>

                <h2 id="activity-title">
                    Recent Activity
                </h2>

            </div>

            <a
                href="activity_logs.html"
                class="activity-preview__view-all"
            >
                View all logs
            </a>

        </div>


        <!-- LOADING -->

        <div
            id="activityPreviewLoading"
            class="activity-preview__empty"
        >
            Loading recent activity...
        </div>


        <!-- EMPTY / ERROR -->

        <div
            id="activityPreviewEmpty"
            class="activity-preview__empty"
            style="display: none;"
        >
        </div>


        <!-- ACTIVITY RECORDS -->

        <div
            id="activityPreviewList"
            class="activity-preview__list"
        >
        </div>

    </section>


    <!-- ======================================================
         FOOTER
    ======================================================= -->

    <footer class="footer">

        <span>
            MediTrack Smart Medicine Dispensing System
        </span>

        <span id="footerRole">
            User Console
        </span>

    </footer>

</main>


<!-- ==========================================================
     JAVASCRIPT
=========================================================== -->

<script type="module">

    // ========================================================
    // FIREBASE IMPORTS
    // ========================================================

    import {
        initializeApp
    } from
        "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";


    import {
        getDatabase,
        ref,
        get
    } from
        "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";


    import {
        getAuth,
        signOut
    } from
        "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";


    import {
        requireRole
    } from
        "../js/auth_guard.js";


    // ========================================================
    // USER ROLE
    // ========================================================

    const USER_ROLE = "Admin";


    // ========================================================
    // MODULE CONFIGURATION
    //
    // Modify this list depending on the user's role.
    //
    // "icon" uses Lucide icon names.
    // ========================================================

    const MODULES = [

        {
            title: "User Management",

            description:
                "Create staff accounts, manage roles, and update employee information.",

            icon: "user",

            link: "user_dashboard.html"
        },

        {
            title: "MediTrack Dispenser",

            description:
                "Access the dispensing unit and manage medicine controls.",

            icon: "monitor-cog",

            link: "dispenser_dashboard.html"
        },

        {
            title: "Activity Logs",

            description:
                "View and search system activity and medication administration records.",

            icon: "logs",

            link: "activity_logs.html"
        },





        /*
        {
            title: "Patient Records",

            description:
                "View and manage patient information.",

            icon: "users-round",

            link: "view_records.html"
        },


        {
            title: "Prescriptions",

            description:
                "Manage patient prescriptions and medication orders.",

            icon: "clipboard-list",

            link: "prescriptions.html"
        },


        {
            title: "Medication Schedule",

            description:
                "Manage medication schedules and administration times.",

            icon: "calendar-clock",

            link: "medication_schedule.html"
        }
            */

    ];


    // ========================================================
    // LIVE CLOCK
    // ========================================================

    const currentDate =
        document.getElementById("currentDate");

    const currentTime =
        document.getElementById("currentTime");


    function updateClock() {

        const now = new Date();


        // ----------------------------------------------------
        // TIME
        // ----------------------------------------------------

        currentTime.textContent =
            now.toLocaleTimeString(
                "en-PH",
                {
                    hour: "numeric",
                    minute: "2-digit",
                    second: "2-digit",
                    hour12: true
                }
            );


        // ----------------------------------------------------
        // DATE
        // ----------------------------------------------------

        currentDate.textContent =
            now.toLocaleDateString(
                "en-PH",
                {
                    weekday: "short",
                    month: "short",
                    day: "numeric",
                    year: "numeric"
                }
            );

    }


    // Start clock immediately

    updateClock();


    // Update clock every second

    setInterval(
        updateClock,
        1000
    );


    // ========================================================
    // TIME-BASED GREETING
    // ========================================================

    function getTimeGreeting() {

        const hour =
            new Date().getHours();


        if (hour < 12) {

            return "Good morning";

        }


        if (hour < 18) {

            return "Good afternoon";

        }


        return "Good evening";

    }


    // ========================================================
    // DASHBOARD INFORMATION
    // ========================================================

    const DASHBOARD_CONFIG = {

        role:
            USER_ROLE,

        title:
            `${getTimeGreeting()}, ${USER_ROLE}`,

        description:
            "Manage users, operate the medicine dispenser, and review system functions.",

        brandSubtitle:
            `${USER_ROLE} Dashboard`,

        footerLabel:
            `${USER_ROLE} Console`

    };


    // ========================================================
    // USER ACCESS
    // ========================================================

    requireRole(
        USER_ROLE
    );


    // ========================================================
    // FIREBASE CONFIGURATION
    // ========================================================

    const firebaseConfig = {
        /* firebase config */
    };


    // ========================================================
    // INITIALIZE FIREBASE
    // ========================================================

    const app =
        initializeApp(
            firebaseConfig
        );


    const auth =
        getAuth(
            app
        );


    const database =
        getDatabase(
            app
        );


    // ========================================================
    // DOM ELEMENTS
    // ========================================================

    const logoutButton =
        document.getElementById(
            "logoutBtn"
        );


    const brandRole =
        document.getElementById(
            "brandRole"
        );


    const roleLabel =
        document.getElementById(
            "roleLabel"
        );


    const pageTitle =
        document.getElementById(
            "page-title"
        );


    const pageDescription =
        document.getElementById(
            "page-description"
        );


    const footerRole =
        document.getElementById(
            "footerRole"
        );


    const moduleGrid =
        document.getElementById(
            "moduleGrid"
        );


    const activityPreviewList =
        document.getElementById(
            "activityPreviewList"
        );


    const activityPreviewLoading =
        document.getElementById(
            "activityPreviewLoading"
        );


    const activityPreviewEmpty =
        document.getElementById(
            "activityPreviewEmpty"
        );


    // ========================================================
    // RENDER DASHBOARD MODULES
    // ========================================================

    function renderModules() {

        moduleGrid.innerHTML = "";


        MODULES.forEach(
            module => {

                const card =
                    document.createElement(
                        "a"
                    );


                card.className =
                    "module-card";


                card.href =
                    module.link;


                card.innerHTML = `

                    <div
                        class="module-card__top"
                    >

                        <span
                            class="module-card__icon"
                            aria-hidden="true"
                        >

                            <i
                                data-lucide="${module.icon}"
                            ></i>

                        </span>

                    </div>


                    <div
                        class="module-card__content"
                    >

                        <h2>
                            ${module.title}
                        </h2>

                        <p>
                            ${module.description}
                        </p>

                    </div>


                    <div
                        class="module-card__link"
                    >

                        <span>
                            Open module
                        </span>

                        <i
                            data-lucide="chevron-right"
                            class="module-card__arrow"
                            aria-hidden="true"
                        ></i>

                    </div>

                `;


                moduleGrid.appendChild(
                    card
                );

            }
        );


        // Convert all data-lucide elements
        // into SVG icons.

        lucide.createIcons();

    }


    // ========================================================
    // APPLY DASHBOARD CONFIGURATION
    // ========================================================

    brandRole.textContent =
        DASHBOARD_CONFIG.brandSubtitle;


    roleLabel.textContent =
        DASHBOARD_CONFIG.role;


    pageTitle.textContent =
        DASHBOARD_CONFIG.title;


    pageDescription.textContent =
        DASHBOARD_CONFIG.description;


    footerRole.textContent =
        DASHBOARD_CONFIG.footerLabel;


    // ========================================================
    // LOGOUT
    // ========================================================

    logoutButton.addEventListener(
        "click",
        async () => {

            try {

                await signOut(
                    auth
                );


                window.location.href =
                    "../../index.html";

            }

            catch (error) {

                console.error(
                    "Logout error:",
                    error
                );


                alert(
                    error.message
                );

            }

        }
    );


    // ========================================================
    // LOAD RECENT ACTIVITY
    // ========================================================

    async function loadRecentActivity() {

        activityPreviewLoading.style.display = "block";
        activityPreviewEmpty.style.display = "none";
        activityPreviewList.innerHTML = "";

        try {

            // Fetch both Firebase nodes simultaneously
            const [activitySnapshot, dispenseSnapshot] =
                await Promise.all([
                    get(ref(database, "activity_logs")),
                    get(ref(database, "Dispense_Log"))
                ]);

            const logs = [];

            // =================================================
            // REGULAR ACTIVITY LOGS
            // =================================================

            if (activitySnapshot.exists()) {

                activitySnapshot.forEach(child => {

                    logs.push({
                        id: child.key,
                        ...child.val()
                    });

                });

            }

            // =================================================
            // DISPENSE LOGS
            // =================================================

            if (dispenseSnapshot.exists()) {

                dispenseSnapshot.forEach(child => {

                    const data = child.val();

                    // Combine Date and Time into a timestamp
                    const dispenseTimestamp =
                        data.Date && data.Time
                            ? `${data.Date}T${data.Time}`
                            : data.Date || data.Time || "";

                    const irSensor =
                        data.Ir_Sensor || "Unknown";

                    const loadCell =
                        data.Load_Cell || "Unknown";

                    const motor =
                        data.Motor || "Unknown";

                    // Flag sensor results that indicate
                    // no object or no medicine detected.
                    const hasWarning =
                        /no object/i.test(irSensor) ||
                        /no medicine/i.test(loadCell);

                    logs.push({

                        id: child.key,

                        action: "DISPENSE_LOG",

                        description:
                            `Dispenser: ${motor} · ` +
                            `IR Sensor: ${irSensor} · ` +
                            `Load Cell: ${loadCell}`,

                        userName: "System",

                        userType: "Dispenser",

                        timestamp: dispenseTimestamp,

                        status: hasWarning
                            ? "WARNING"
                            : "INFO",

                        source: "Dispense_Log"

                    });

                });

            }

            activityPreviewLoading.style.display = "none";

            // =================================================
            // NO ACTIVITY
            // =================================================

            if (logs.length === 0) {

                activityPreviewEmpty.textContent =
                    "No recent system activity.";

                activityPreviewEmpty.style.display = "block";

                return;

            }

            // =================================================
            // SORT NEWEST FIRST
            // =================================================

            logs.sort((a, b) =>
                getTimestamp(b.timestamp) -
                getTimestamp(a.timestamp)
            );

            // =================================================
            // DISPLAY LATEST 5
            // =================================================

            logs.slice(0, 5).forEach(log => {
                renderActivity(log);
            });

        }

        catch (error) {

            console.error(
                "Failed to load recent activity:",
                error
            );

            activityPreviewLoading.style.display = "none";

            activityPreviewEmpty.textContent =
                "Unable to load recent activity.";

            activityPreviewEmpty.style.display = "block";

        }

    }

    // ========================================================
    // RENDER ACTIVITY
    //
    // Activity icons intentionally remain separate from
    // Lucide Icons as requested.
    // ========================================================

    function renderActivity(
        log
    ) {

        const item =
            document.createElement(
                "article"
            );


        item.className =
            "activity-preview__item";


        // ====================================================
        // ACTIVITY ICON
        // ====================================================

        const icon =
            document.createElement(
                "div"
            );


        icon.className =
            "activity-preview__icon";


        icon.textContent =
            getActivityIcon(
                log.action
            );


        // ====================================================
        // ACTIVITY CONTENT
        // ====================================================

        const content =
            document.createElement(
                "div"
            );


        content.className =
            "activity-preview__content";


        // ====================================================
        // ACTION
        // ====================================================

        const action =
            document.createElement(
                "div"
            );


        action.className =
            "activity-preview__action";


        action.textContent =
            formatAction(
                log.action
            );


        // ====================================================
        // DESCRIPTION
        // ====================================================

        const description =
            document.createElement(
                "div"
            );


        description.className =
            "activity-preview__description";


        description.textContent =
            log.description ||
            "-";


        // ====================================================
        // META
        // ====================================================

        const meta =
            document.createElement(
                "div"
            );


        meta.className =
            "activity-preview__meta";


        const userName =
            log.userName ||
            "Unknown User";


        const userType =
            log.userType ||
            "";


        const date =
            formatDateTime(
                log.timestamp
            );


        meta.textContent =
            userType
                ? `${userName} · ${userType} · ${date}`
                : `${userName} · ${date}`;


        // ====================================================
        // STATUS
        // ====================================================

        const status =
            document.createElement(
                "span"
            );


        status.className =
            "activity-preview__status";


        status.classList.add(
            getStatusClass(
                log.status
            )
        );


        status.textContent =
            log.status ||
            "UNKNOWN";


        // ====================================================
        // BUILD ACTIVITY ITEM
        // ====================================================

        content.appendChild(
            action
        );


        content.appendChild(
            description
        );


        content.appendChild(
            meta
        );


        item.appendChild(
            icon
        );


        item.appendChild(
            content
        );


        item.appendChild(
            status
        );


        activityPreviewList.appendChild(
            item
        );

    }


    // ========================================================
    // FORMAT ACTION
    // ========================================================

    function formatAction(
        action
    ) {

        if (!action) {

            return "System Activity";

        }


        return action

            .replace(
                /_/g,
                " "
            )

            .replace(
                /\b\w/g,
                letter =>
                    letter.toUpperCase()
            );

    }


    // ========================================================
    // ACTIVITY ICONS
    // ========================================================

    function getActivityIcon(
        action
    ) {

        switch (action) {

            
            case "LOGIN":
                return "↪";


            case "MEDICINE_CREATED":
                return "✚";


            case "INVENTORY_ADDED":
                return "+";


            case "INVENTORY_DEDUCTED":
                return "−";


            case "INVENTORY_ADJUSTED":
                return "↕";


            case "PRESCRIPTION_CREATED":
                return "Rx";


            case "DISPENSER_ASSIGNED":
                return "◉";


            case "DISPENSER_REFILLED":
                return "↻";

            case "DISPENSE_LOG":
                return "💊";

            default:
                return "•";

        }

    }


    // ========================================================
    // STATUS CLASS
    // ========================================================

    function getStatusClass(
        status
    ) {

        const value =
            String(
                status || ""
            ).toLowerCase();


        if (
            value === "success"
        ) {

            return "is-success";

        }


        if (
            value === "failed"
        ) {

            return "is-failed";

        }


        if (
            value === "warning"
        ) {

            return "is-warning";

        }


        return "is-neutral";

    }


    // ========================================================
    // TIMESTAMP
    // ========================================================

    function getTimestamp(
        timestamp
    ) {

        if (
            typeof timestamp === "number"
        ) {

            return timestamp;

        }


        if (!timestamp) {

            return 0;

        }


        const parsed =
            new Date(
                timestamp
            ).getTime();


        return isNaN(
            parsed
        )
            ? 0
            : parsed;

    }


    // ========================================================
    // FORMAT DATE/TIME
    // ========================================================

    function formatDateTime(
        timestamp
    ) {

        const time =
            getTimestamp(
                timestamp
            );


        if (!time) {

            return "-";

        }


        return new Date(
            time
        ).toLocaleString(
            "en-PH",
            {
                dateStyle: "medium",
                timeStyle: "short"
            }
        );

    }


    // ========================================================
    // INITIALIZE DASHBOARD
    // ========================================================

    // Initialize static Lucide icons:
    // brand, logout, and clock.

    lucide.createIcons();


    // Generate dashboard module cards.

    renderModules();


    // Load recent activity.

    loadRecentActivity();

</script>

</body>
</html>
