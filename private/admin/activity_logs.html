<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MediTrack | Activity Logs</title>
    <link rel="icon" type="image/x-icon" href="../../draft.png">

    <link
        rel="stylesheet"
        href="stylesheets/activity_logs.css"
    >

</head>


<body>

    <!-- ======================================================
         HEADER
    ======================================================= -->

    <header class="topbar">

        <div class="topbar-left">
            <div class="brand" aria-label="MediTrack Dashboard">

                <img
                    src="../../draft.png"
                    alt="MediTrack Logo"
                    class="actual-logo"
                    style="height: 50px;"
                >

                <span class="brand__text">

                    <strong>
                        MediTrack
                    </strong>

                    <span id="brandRole">
                        Activity Logs
                    </span>

                </span>
            </div>
        </div>


        <div class="topbar-right">

            <a href="dashboard.html">
                Dashboard
            </a>

            <button
                id="refreshBtn"
                type="button"
            >
                Refresh
            </button>

        </div>

    </header>


    <!-- ======================================================
         MAIN CONTENT
    ======================================================= -->

    <main class="container">

        <section class="page-header">

            <div>

                <h2>
                    Activity Logs
                </h2>

                <p>
                    Review system activities performed in MediTrack.
                </p>

            </div>

        </section>


        <!-- ==================================================
             FILTER PANEL
        =================================================== -->

        <section class="filter-panel">

            <div class="filter-group search-group">

                <label for="searchInput">
                    Search
                </label>

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search activity logs..."
                >

            </div>


            <div class="filter-group">

                <label for="actionFilter">
                    Action
                </label>

                <select id="actionFilter">

                    <option value="">
                        All Actions
                    </option>

                    <option value="LOGIN">
                        Login
                    </option>

                    <option value="MEDICINE_CREATED">
                        Medicine Created
                    </option>

                    <option value="INVENTORY_ADDED">
                        Inventory Added
                    </option>

                    <option value="INVENTORY_DEDUCTED">
                        Inventory Deducted
                    </option>

                    <option value="INVENTORY_ADJUSTED">
                        Inventory Adjusted
                    </option>

                    <option value="PRESCRIPTION_CREATED">
                        Prescription Created
                    </option>

                    <option value="MEDICINE_DISPENSE">
                        Medicine Dispense
                    </option>

                    <option value="DISPENSER_ASSIGNED">
                        Dispenser Assigned
                    </option>

                    <option value="DISPENSER_REFILLED">
                        Dispenser Refilled
                    </option>

                </select>

            </div>


            <div class="filter-group">

                <label for="roleFilter">
                    User Type
                </label>

                <select id="roleFilter">

                    <option value="">
                        All User Types
                    </option>

                    <option value="System">
                        System
                    </option>

                    <option value="Admin">
                        Admin
                    </option>

                    <option value="Doctor">
                        Doctor
                    </option>

                    <option value="Clerk">
                        Clerk
                    </option>

                    <option value="Head Nurse">
                        Head Nurse
                    </option>

                    <option value="Nurse">
                        Nurse
                    </option>

                    <option value="Pharmacist">
                        Pharmacist
                    </option>

                </select>

            </div>


            <div class="filter-group">

                <label for="statusFilter">
                    Status
                </label>

                <select id="statusFilter">

                    <option value="">
                        All Statuses
                    </option>

                    <option value="SUCCESS">
                        Success
                    </option>

                    <option value="FAILED">
                        Failed
                    </option>

                    <option value="WARNING">
                        Warning
                    </option>

                </select>

            </div>


            <div class="filter-group">

                <label for="sortSelect">
                    Sort By
                </label>

                <select id="sortSelect">
                    <option value="timestamp-desc">Newest First</option>
                    <option value="timestamp-asc">Oldest First</option>
                    <option value="user-asc">User A-Z</option>
                    <option value="user-desc">User Z-A</option>
                    <option value="action-asc">Action A-Z</option>
                    <option value="action-desc">Action Z-A</option>
                    <option value="source-asc">Source A-Z</option>
                    <option value="source-desc">Source Z-A</option>
                    <option value="target-asc">Target A-Z</option>
                    <option value="target-desc">Target Z-A</option>
                    <option value="status-asc">Status A-Z</option>
                    <option value="status-desc">Status Z-A</option>
                </select>

            </div>


            <div class="filter-group">

                <label for="limitSelect">
                    Rows
                </label>

                <select id="limitSelect">

                    <option value="25">
                        25
                    </option>

                    <option value="50" selected>
                        50
                    </option>

                    <option value="100">
                        100
                    </option>

                    <option value="250">
                        250
                    </option>

                    <option value="all">
                        All
                    </option>

                </select>

            </div>

        </section>


        <!-- ==================================================
             SUMMARY
        =================================================== -->

        <section class="summary-panel">

            <div class="summary-card">

                <span class="summary-label">
                    Total Logs
                </span>

                <strong
                    id="totalLogs"
                    class="summary-value"
                >
                    0
                </strong>

            </div>


            <div class="summary-card">

                <span class="summary-label">
                    Visible Logs
                </span>

                <strong
                    id="visibleLogs"
                    class="summary-value"
                >
                    0
                </strong>

            </div>


            <div class="summary-card">

                <span class="summary-label">
                    Successful
                </span>

                <strong
                    id="successLogs"
                    class="summary-value success-text"
                >
                    0
                </strong>

            </div>


            <div class="summary-card">

                <span class="summary-label">
                    Failed
                </span>

                <strong
                    id="failedLogs"
                    class="summary-value failed-text"
                >
                    0
                </strong>

            </div>

            <div class="summary-card">

                <span class="summary-label">
                    Warnings
                </span>

                <strong
                    id="warningLogs"
                    class="summary-value warning-text"
                >
                    0
                </strong>

            </div>

        </section>


        <!-- ==================================================
             TABLE
        =================================================== -->

        <section class="table-card">

            <div
                id="loadingMessage"
                class="loading-message"
            >
                Loading activity logs...
            </div>


            <div
                id="emptyMessage"
                class="empty-message hidden"
            >
                No activity logs found.
            </div>


            <div class="table-wrapper">

                <table id="activityTable">

                    <thead>

                        <tr>

                            <th>Date / Time</th>

                            <th>User</th>

                            <th>Role</th>

                            <th>Source</th>

                            <th>Action</th>

                            <th>Description</th>

                            <th>Target</th>

                            <th>Status</th>

                            <th>Details</th>

                        </tr>

                    </thead>


                    <tbody
                        id="activityTableBody"
                    >
                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <!-- ======================================================
         DETAILS MODAL
    ======================================================= -->

    <div
        id="detailsModal"
        class="modal hidden"
    >

        <div class="modal-content">

            <div class="modal-header">

                <h3>
                    Activity Details
                </h3>

                <button
                    id="closeModal"
                    type="button"
                    class="close-btn"
                >
                    &times;
                </button>

            </div>


            <div
                id="modalBody"
                class="modal-body"
            >
            </div>

        </div>

    </div>


    <!-- ======================================================
         FIREBASE + JAVASCRIPT
    ======================================================= -->

<script type="module">

// ============================================================
// FIREBASE
// ============================================================

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";


import {
    getDatabase,
    ref,
    get,
    onValue
}
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";


import {
    getAuth,
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";


import {
    requireRole
}
from "../js/auth_guard.js";


// ============================================================
// ADMIN ACCESS
// ============================================================

requireRole("Admin");


// ============================================================
// FIREBASE CONFIGURATION
// ============================================================

const firebaseConfig = {
	/* firebase config */
};


// ============================================================
// INITIALIZE FIREBASE
// ============================================================

const app =
    initializeApp(firebaseConfig);


const db =
    getDatabase(app);


const auth =
    getAuth(app);


// ============================================================
// DOM ELEMENTS
// ============================================================

const searchInput =
    document.getElementById("searchInput");

const actionFilter =
    document.getElementById("actionFilter");

const roleFilter =
    document.getElementById("roleFilter");

const statusFilter =
    document.getElementById("statusFilter");

const sortSelect =
    document.getElementById("sortSelect");

const limitSelect =
    document.getElementById("limitSelect");

const refreshBtn =
    document.getElementById("refreshBtn");

const tableBody =
    document.getElementById("activityTableBody");

const loadingMessage =
    document.getElementById("loadingMessage");

const emptyMessage =
    document.getElementById("emptyMessage");

const totalLogs =
    document.getElementById("totalLogs");

const visibleLogs =
    document.getElementById("visibleLogs");

const successLogs =
    document.getElementById("successLogs");

const failedLogs =
    document.getElementById("failedLogs");

const warningLogs =
    document.getElementById("warningLogs");

const detailsModal =
    document.getElementById("detailsModal");

const modalBody =
    document.getElementById("modalBody");

const closeModal =
    document.getElementById("closeModal");


// ============================================================
// DATA
// ============================================================

let activityLogs = [];

let usersByUid = {};

let stopActivityListener = null;

let stopMedicationListener = null;

let stopDispenseListener = null;


// ============================================================
// AUTHENTICATION CHECK
// ============================================================

onAuthStateChanged(
    auth,
    user => {

        if (!user) {

            window.location.href =
                "../../index.html";

        }

    }
);


// ============================================================
// LOAD USERS
//
// Used to resolve nurse_uid, uid, etc. into actual
// MediTrack user information.
// ============================================================

async function loadUsers() {

    usersByUid = {};


    try {

        const snapshot =
            await get(
                ref(
                    db,
                    "users"
                )
            );


        if (!snapshot.exists()) {

            return;

        }


        snapshot.forEach(
            child => {

                const user =
                    child.val();


                usersByUid[
                    child.key
                ] = {

                    uid:
                        child.key,

                    userName:
                        user.fullName ||
                        buildUserName(user),

                    userType:
                        user.userType || "",

                    email:
                        user.email || ""

                };

            }
        );

    }
    catch (error) {

        console.error(
            "Error loading users:",
            error
        );

    }

}


// ============================================================
// LOAD ALL ACTIVITY SOURCES
// ============================================================

function loadActivityLogs() {

    loadingMessage.classList.remove(
        "hidden"
    );

    emptyMessage.classList.add(
        "hidden"
    );


    // --------------------------------------------------------
    // Remove old listeners before creating new ones
    // --------------------------------------------------------

    if (stopActivityListener) {

        stopActivityListener();

        stopActivityListener = null;

    }


    if (stopMedicationListener) {

        stopMedicationListener();

        stopMedicationListener = null;

    }

    if (stopDispenseListener) {

        stopDispenseListener();

        stopDispenseListener = null;

    }


    let normalActivityLogs = [];

    let medicationLogs = [];

    let dispenseLogs = [];


    // ========================================================
    // PROCESS COMBINED LOGS
    // ========================================================

    function processLogs() {

        const combinedLogs = [

            ...normalActivityLogs,

            ...medicationLogs,

            ...dispenseLogs

        ];


        // ----------------------------------------------------
        // Resolve user information
        // ----------------------------------------------------

        combinedLogs.forEach(
            log => {

                const user =
                    usersByUid[
                        log.uid
                    ];


                if (user) {

                    log.userName =
                        user.userName ||
                        log.userName;

                    log.userType =
                        user.userType ||
                        log.userType;

                    log.email =
                        user.email ||
                        log.email;

                }

            }
        );


        // ----------------------------------------------------
        // Save final data
        // ----------------------------------------------------

        activityLogs =
            combinedLogs;


        totalLogs.textContent =
            activityLogs.length;


        loadingMessage.classList.add(
            "hidden"
        );


        renderLogs();

    }

    // ========================================================
    // ACTIVITY LOGS
    // ========================================================

    const activityRef =
        ref(
            db,
            "activity_logs"
        );


    stopActivityListener =
        onValue(
            activityRef,
            snapshot => {

                normalActivityLogs = [];


                if (
                    snapshot.exists()
                ) {

                    snapshot.forEach(
                        child => {

                            const log =
                                child.val();


                            normalActivityLogs.push({

                                id:
                                    child.key,

                                source:
                                    "Activity Log",

                                logType:
                                    "activity",

                                uid:
                                    log.uid || "",

                                userName:
                                    log.userName || "",

                                userType:
                                    log.userType || "",

                                email:
                                    log.email || "",

                                action:
                                    log.action || "",

                                description:
                                    log.description || "",

                                targetType:
                                    log.targetType || "",

                                targetId:
                                    log.targetId || "",

                                status:
                                    log.status || "",

                                timestamp:
                                    normalizeTimestamp(
                                        log.timestamp
                                    ),

                                details:
                                    log.details || {}

                            });

                        }
                    );

                }


                processLogs();

            },
            error => {

                console.error(
                    "Error reading activity_logs:",
                    error
                );


                loadingMessage.classList.add(
                    "hidden"
                );


                emptyMessage.textContent =
                    "Failed to load activity logs: " +
                    error.message;


                emptyMessage.classList.remove(
                    "hidden"
                );

            }
        );


    // ========================================================
    // MEDICATION LOGS
    // ========================================================

    const medicationRef =
        ref(
            db,
            "medication_logs"
        );


    stopMedicationListener =
        onValue(
            medicationRef,
            snapshot => {

                medicationLogs = [];


                if (
                    snapshot.exists()
                ) {

                    snapshot.forEach(
                        child => {

                            const log =
                                child.val();


                            const nurseUid =
                                log.nurse_uid ||
                                "";


                            medicationLogs.push({

                                id:
                                    child.key,

                                source:
                                    "Medication Log",

                                logType:
                                    "medication",

                                uid:
                                    nurseUid,

                                userName:
                                    "",

                                userType:
                                    "Nurse",

                                email:
                                    "",

                                action:
                                    buildMedicationAction(
                                        log
                                    ),

                                description:
                                    buildMedicationDescription(
                                        log
                                    ),

                                targetType:
                                    "Patient",

                                targetId:
                                    log.schedule_id ||
                                    "",

                                status:
                                    log.administration_status ||
                                    "",

                                timestamp:
                                    normalizeTimestamp(
                                        log.timestamp ||
                                        log.administered_at
                                    ),

                                details: {

                                    medicationName:
                                        log.medication_name ||
                                        "",

                                    patientName:
                                        log.patient_name ||
                                        "",

                                    scheduleId:
                                        log.schedule_id ||
                                        "",

                                    administrationStatus:
                                        log.administration_status ||
                                        "",

                                    timingStatus:
                                        log.timing_status ||
                                        "",

                                    administeredAt:
                                        log.administered_at ||
                                        "",

                                    nurseUid:
                                        nurseUid

                                }

                            });

                        }
                    );

                }


                processLogs();

            },
            error => {

                console.error(
                    "Error reading medication_logs:",
                    error
                );

            }
        );

    // ========================================================
    // DISPENSE LOGS
    // ========================================================

    const dispenseRef = ref(
        db,
        "Dispense_Log"
    );

    stopDispenseListener = onValue(
        dispenseRef,

        snapshot => {

            dispenseLogs = [];

            if (snapshot.exists()) {

                snapshot.forEach(child => {

                    const log = child.val();

                    const date =
                        log.Date || "";

                    const time =
                        log.Time || "";

                    // Combine the date and time into a timestamp.
                    // The Firebase values are interpreted as local time.
                    const timestamp = normalizeTimestamp(
                        date && time
                            ? `${date}T${time}`
                            : date || time
                    );

                    const motor =
                        log.Motor || "Unknown Motor";

                    const irSensor =
                        log.Ir_Sensor || "Unknown";

                    const loadCell =
                        log.Load_Cell || "Unknown";

                    dispenseLogs.push({

                        id: child.key,

                        source: "Dispense Log",

                        logType: "dispense",

                        uid: "",

                        userName: "Dispensing System",

                        userType: "System",

                        email: "",

                        action: "MEDICINE_DISPENSE",

                        description:
                            `Dispensing attempt using ${motor}. ` +
                            `IR Sensor: ${irSensor}; ` +
                            `Load Cell: ${loadCell}.`,

                        targetType: "Dispenser",

                        targetId: motor,

                        // The supplied record does not contain
                        // an explicit success/failure status.
                        status: "WARNING",

                        timestamp: timestamp,

                        details: {

                            dispenseId: child.key,

                            date: date,

                            time: time,

                            motor: motor,

                            irSensor: irSensor,

                            loadCell: loadCell

                        }

                    });

                });

            }

            processLogs();

        },

        error => {

            console.error(
                "Error reading Dispense_Log:",
                error
            );

        }
    );

}

// ============================================================
// RENDER LOGS
// ============================================================

function renderLogs() {

    let filteredLogs =
        [...activityLogs];


    // ========================================================
    // SEARCH
    // ========================================================

    const keyword =
        searchInput.value
            .toLowerCase()
            .trim();


    if (keyword !== "") {

        filteredLogs =
            filteredLogs.filter(
                log => {

                    const searchableText = [

                        log.userName,

                        log.userType,

                        log.email,

                        log.source,

                        log.action,

                        log.description,

                        log.targetType,

                        log.targetId,

                        log.uid,

                        log.details?.medicationName,

                        log.details?.patientName,

                        log.details?.scheduleId,

                        log.details?.timingStatus,

                        log.details?.administrationStatus,

                        log.details?.dispenseId,

                        log.details?.date,

                        log.details?.time,

                        log.details?.motor,

                        log.details?.irSensor,

                        log.details?.loadCell

                    ]
                    .map(
                        value =>
                            String(
                                value || ""
                            )
                            .toLowerCase()
                    )
                    .join(" ");


                    return searchableText
                        .includes(keyword);

                }
            );

    }


    // ========================================================
    // ACTION FILTER
    // ========================================================

    if (
        actionFilter.value !== ""
    ) {

        filteredLogs =
            filteredLogs.filter(
                log =>
                    log.action ===
                    actionFilter.value
            );

    }


    // ========================================================
    // USER TYPE FILTER
    // ========================================================

    if (
        roleFilter.value !== ""
    ) {

        filteredLogs =
            filteredLogs.filter(
                log =>
                    log.userType ===
                    roleFilter.value
            );

    }


    // ========================================================
    // STATUS FILTER
    // ========================================================

    if (
        statusFilter.value !== ""
    ) {

        filteredLogs =
            filteredLogs.filter(
                log => {

                    return normalizeStatus(
                        log
                    ) ===
                    statusFilter.value;

                }
            );

    }


    // ========================================================
    // SORT
    // ========================================================

    const sortValue =
        sortSelect.value;


    filteredLogs.sort(
        (a, b) => {

            switch (sortValue) {

                case "timestamp-desc":

                    return (
                        getTimestamp(b) -
                        getTimestamp(a)
                    );


                case "timestamp-asc":

                    return (
                        getTimestamp(a) -
                        getTimestamp(b)
                    );


                case "user-asc":

                    return compareStrings(
                        a.userName,
                        b.userName
                    );


                case "user-desc":

                    return compareStrings(
                        b.userName,
                        a.userName
                    );


                case "action-asc":

                    return compareStrings(
                        a.action,
                        b.action
                    );


                case "action-desc":

                    return compareStrings(
                        b.action,
                        a.action
                    );


                case "source-asc":

                    return compareStrings(
                        a.source,
                        b.source
                    );


                case "source-desc":

                    return compareStrings(
                        b.source,
                        a.source
                    );


                case "target-asc":

                    return compareStrings(
                        buildTarget(a),
                        buildTarget(b)
                    );


                case "target-desc":

                    return compareStrings(
                        buildTarget(b),
                        buildTarget(a)
                    );


                case "status-asc":

                    return compareStrings(
                        normalizeStatus(a),
                        normalizeStatus(b)
                    );


                case "status-desc":

                    return compareStrings(
                        normalizeStatus(b),
                        normalizeStatus(a)
                    );


                default:

                    return (
                        getTimestamp(b) -
                        getTimestamp(a)
                    );

            }

        }
    );


    // ========================================================
    // SUMMARY
    // ========================================================

    visibleLogs.textContent =
        filteredLogs.length;


    const successfulCount =
        filteredLogs.filter(
            log =>
                normalizeStatus(log) ===
                "SUCCESS"
        ).length;


    const failedCount =
        filteredLogs.filter(
            log =>
                normalizeStatus(log) ===
                "FAILED"
        ).length;


    const warningCount =
        filteredLogs.filter(
            log =>
                normalizeStatus(log) ===
                "WARNING"
        ).length;


    const unknownCount =
        filteredLogs.filter(
            log =>
                normalizeStatus(log) ===
                "UNKNOWN"
        ).length;


    successLogs.textContent =
        successfulCount;


    failedLogs.textContent =
        failedCount;


    warningLogs.textContent =
        warningCount;

    // ========================================================
    // ROW LIMIT
    // ========================================================

    let displayLogs =
        filteredLogs;


    if (
        limitSelect.value !== "all"
    ) {

        displayLogs =
            filteredLogs.slice(
                0,
                Number(
                    limitSelect.value
                )
            );

    }


    // ========================================================
    // CLEAR TABLE
    // ========================================================

    tableBody.innerHTML = "";


    if (
        displayLogs.length === 0
    ) {

        emptyMessage.classList.remove(
            "hidden"
        );

        return;

    }


    emptyMessage.classList.add(
        "hidden"
    );


    // ========================================================
    // CREATE TABLE ROWS
    // ========================================================

    displayLogs.forEach(
        log => {

            const row =
                document.createElement(
                    "tr"
                );


            // ------------------------------------------------
            // Date / Time
            // ------------------------------------------------

            const dateCell =
                document.createElement(
                    "td"
                );


            dateCell.textContent =
                formatDateTime(
                    log.timestamp
                );


            // ------------------------------------------------
            // User
            // ------------------------------------------------

            const userCell =
                document.createElement(
                    "td"
                );


            userCell.innerHTML = `

                <div class="user-name">

                    ${escapeHTML(
                        log.userName ||
                        "Unknown User"
                    )}

                </div>

                <div class="user-email">

                    ${escapeHTML(
                        log.email ||
                        ""
                    )}

                </div>

            `;


            // ------------------------------------------------
            // Role
            // ------------------------------------------------

            const roleCell =
                document.createElement(
                    "td"
                );


            roleCell.textContent =
                log.userType ||
                "-";


            // ------------------------------------------------
            // Source
            // ------------------------------------------------

            const sourceCell =
                document.createElement(
                    "td"
                );


            const sourceClass =
                log.logType === "medication"
                    ? "source-medication"
                    : log.logType === "dispense"
                        ? "source-dispense"
                        : "source-activity";


            sourceCell.innerHTML = `

                <span
                    class="source-badge ${sourceClass}"
                >

                    ${escapeHTML(
                        log.source ||
                        "-"
                    )}

                </span>

            `;


            // ------------------------------------------------
            // Action
            // ------------------------------------------------

            const actionCell =
                document.createElement(
                    "td"
                );


            actionCell.innerHTML = `

            // ------------------------------------------------

            // ------------------------------------------------

            const statusCell =

// ============================================================
// MEDICATION ACTION
// ============================================================

function buildMedicationAction(
    log
) {

    const administrationStatus =
        String(
            log.administration_status ||
            ""
        )
        .toLowerCase();


    if (
        administrationStatus ===
        "given"
    ) {

        return "MEDICATION_DISPENSED";

    }


    if (
        administrationStatus ===
        "missed"
    ) {

        return "MEDICATION_MISSED";

    }


    if (
        administrationStatus ===
        "refused"
    ) {

        return "MEDICATION_REFUSED";

    }


    return "MEDICATION_ADMINISTRATION";

}


// ============================================================
// MEDICATION DESCRIPTION
// ============================================================

function buildMedicationDescription(
    log
) {

    const medication =
        log.medication_name ||
        "Unknown Medication";


    const patient =
        log.patient_name ||
        "Unknown Patient";


    const administrationStatus =
        log.administration_status ||
        "Unknown Status";


    const timingStatus =
        log.timing_status ||
        "";


    let description =
        `${medication} administered to ${patient} (${administrationStatus})`;


    if (timingStatus) {

        description +=
            ` - ${timingStatus}`;

    }


    return description;

}


// ============================================================
// NORMALIZE MEDICATION STATUS
//
// Medication logs use:
// Given / Missed / Refused
//
// Normal activity logs use:
// SUCCESS / FAILED / WARNING
//
// This converts them for the dashboard summary/filter.
// ============================================================

function normalizeStatus(log) {

    // ========================================================
    // MEDICATION LOGS
    // ========================================================

    if (log.logType === "medication") {

        const value =
            String(
                log.status || ""
            )
            .trim()
            .toLowerCase();


        if (value === "given") {
            return "SUCCESS";
        }


        if (
            value === "missed" ||
            value === "refused"
        ) {
            return "FAILED";
        }


        return "WARNING";
    }


    // ========================================================
    // DISPENSE LOGS
    // ========================================================

    if (log.logType === "dispense") {

        const value =
            String(
                log.status || ""
            )
            .trim()
            .toUpperCase();


        if (value === "SUCCESS") {
            return "SUCCESS";
        }


        if (value === "FAILED") {
            return "FAILED";
        }


        return "WARNING";
    }


    // ========================================================
    // STANDARD ACTIVITY LOGS
    // ========================================================

    const value =
        String(
            log.status || ""
        )
        .trim()
        .toUpperCase();


    if (value === "SUCCESS") {
        return "SUCCESS";
    }


    if (value === "FAILED") {
        return "FAILED";
    }


    if (value === "WARNING") {
        return "WARNING";
    }


    // Any old/missing/unrecognized status
    // is treated as a warning rather than
    // disappearing from the summary.

    return "WARNING";
}

// ============================================================
// TIMESTAMP NORMALIZATION
// ============================================================

function normalizeTimestamp(value) {

    if (typeof value === "number") {
        return value;
    }

    if (typeof value !== "string" || !value) {
        return 0;
    }

    const parsed = new Date(value).getTime();

    return !isNaN(parsed) ? parsed : 0;

}

// ============================================================
// GET TIMESTAMP
// ============================================================

function getTimestamp(
    log
) {

    return normalizeTimestamp(
        log.timestamp
    );

}


// ============================================================
// FORMAT DATE
// ============================================================

function formatDateTime(
    timestamp
) {

    if (!timestamp) {

        return "-";

    }


    const date =
        new Date(
            timestamp
        );


    if (
        isNaN(
            date.getTime()
        )
    ) {

        return String(
            timestamp
        );

    }


    return date.toLocaleString();

}


// ============================================================
// COMPARE STRINGS
// ============================================================

function compareStrings(
    a,
    b
) {

    return String(
        a || ""
    )
    .localeCompare(
        String(
            b || ""
        )
    );

}


// ============================================================
// BUILD TARGET
// ============================================================

function buildTarget(
    log
) {

    return [

        log.targetType,

        log.targetId

    ]
    .filter(
        Boolean
    )
    .join(" ");

}


// ============================================================
// FORMAT ACTION
// ============================================================

function formatAction(
    action
) {

    if (!action) {

        return "-";

    }


    return action

        .replace(
            /_/g,
            " "
        )

        .replace(
            /\b\w/g,
            letter =>
                letter.toUpperCase()
        );

}


// ============================================================
// BUILD USER NAME
// ============================================================

function buildUserName(
    user
) {

    return [

        user.fname,
        user.mname,
        user.lname,
        user.suffix

    ]

    .filter(
        value =>
            value &&
            String(
                value
            ).trim() !== ""
    )

    .map(
        value =>
            String(
                value
            ).trim()
    )

    .join(" ")

    .trim();

}

// ============================================================
// ESCAPE HTML
// ============================================================

function escapeHTML(
    value
) {

    return String(
        value
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}
