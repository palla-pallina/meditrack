<!DOCTYPE html>
<html lang="en">
<head>
    <title>MediTrack | Patient Admission Form</title>
</head>
<body>

<a href="view_records.html">Dashboard</a><br>

<h2>Edit Patient Admission Form</h2>

<form action="save_patient.php" method="POST" enctype="multipart/form-data">

    <!-- ========================= -->
    <!-- ADMISSION INFORMATION -->
    <!-- ========================= -->
    <fieldset>
        <legend><strong>Admission Information</strong></legend>

        <label>Admission Number</label><br>
        <input
            type="text"
            id="admissionNumber"
            readonly><br><br>

        <label>Date of Admission</label><br>
        <input
            type="date"
            id="admissionDate"
            readonly><br><br>

        <label>Time of Admission</label><br>
        <input
            type="time"
            id="admissionTime"><br><br>

        <label>Assigned Area</label><br>
        <select id="assignedArea">

            <option value="">Select Ward</option>

            <option>Ward 1</option>
            <option>Ward 2</option>
            <option>Ward 3</option>
            <option>Ward 4</option>
            <option>Ward 5</option>
            <option>Ward 6</option>
            <option>Ward 7</option>
            <option>Ward 8</option>

        </select><br><br>

        <label>Room</label><br>

        <input
            type="text"
            id="room">

    </fieldset>

    <br>

    <!-- ========================= -->
    <!-- PATIENT INFORMATION -->
    <!-- ========================= -->
    <fieldset>
        <legend><strong>Patient Information</strong></legend>

        <label>First Name <span style="color:red;">*</span></label><br>
        <input type="text" id="fName" required><br><br>

        <label>Middle Name</label><br>
        <input type="text" id="mName"><br><br>

        <label>Last Name <span style="color:red;">*</span></label><br>
        <input type="text" id="lName" required><br><br>

        <label>Suffix</label><br>
        <input type="text" id="suffix"><br><br>

        <label>Date of Birth <span style="color:red;">*</span></label><br>
        <input type="date" id="dob" required><br><br>

        <label>Age</label><br>
        <input type="number" id="age" readonly><br><br>

        <label>Sex <span style="color:red;">*</span></label><br>
        <select id="sex" required>
            <option value="">Select</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Intersex">Intersex</option>
            <option value="Other">Other</option>
        </select><br><br>

        <label>Contact Number <span style="color:red;">*</span></label><br>
        <input type="tel" id="contactNumber" placeholder="(+63) 09xx xxx xxxx" pattern="09[0-9]{9}" required><br><br>

        <label>Occupation<br>
        <input type="text" id="occupation"><br><br>

        <label>Marital Status<br>
        <select id="marital_status">
            <option value="">Select</option>
            <option value="Single">Single</option>
            <option value="Married">Married</option>
            <option value="Widowed">Widowed</option>
            <option value="Separated">Separated</option>
            <option value="Divorced">Divorced</option>
        </select><br><br>

        <label>Patient ID Picture <span style="color:red;">*</span></label><br>
        <input type="file" id="id_pic" accept="image/*"><br><br>

        <label>Occupying Individual <span style="color:red;">*</span></label><br>
        <input type="text" id="occupyingIndiv" required><br><br>
    </fieldset>

    <br>

    <!-- ========================= -->
    <!-- ADDRESS -->
    <!-- ========================= -->
    <fieldset>
        <legend><strong>Address</strong></legend>

        <label>Street / House No. <span style="color:red;">*</span></label><br>
        <input type="text" id="streetNo" required><br><br>

        <label>Barangay <span style="color:red;">*</span></label><br>
        <input type="text" id="barangay" required><br><br>

        <label>City / Municipality <span style="color:red;">*</span></label><br>
        <input type="text" id="city" required><br><br>

        <label>Province <span style="color:red;">*</span></label><br>
        <input type="text" id="province" required><br><br>

    </fieldset>

    <br>

    <!-- ========================= -->
    <!-- CHIEF COMPLAINT -->
    <!-- ========================= -->
    <fieldset>
        <legend><strong>Chief Complaint</strong></legend>

        <label>Chief Complaint <span style="color:red;">*</span></label><br>
        <textarea id="chiefComplaint" rows="4" cols="60" required></textarea><br><br>

        <label>Symptoms <span style="color:red;">*</span></label><br>
        <textarea id="symptoms" rows="4" cols="60" required></textarea><br><br>

        <label>Medication Used Before Admission <span style="color:red;">*</span></label><br>
        <textarea id="medicationUsed" rows="4" cols="60" required></textarea>
    </fieldset>

    <br>

    <!-- ========================= -->
    <!-- FAMILY HISTORY -->
    <!-- ========================= -->
    <fieldset>
        <legend><strong>Family History of Illness</strong></legend>

        <label>Condition Type</label><br>
        <select id="family_condition_type">
            <option value="">Select</option>
            <option value="Chronic Disease">Chronic Disease</option>
            <option value="Infectious Disease">Infectious Disease</option>
            <option value="Mental Health">Mental Health</option>
            <option value="Metabolic">Metabolic</option>
            <option value="Cardiovascular">Cardiovascular</option>
            <option value="Respiratory">Respiratory</option>
            <option value="Neurologic">Neurologic</option>
            <option value="Oncologic">Oncologic</option>
            <option value="Other">Other</option>
        </select><br><br>

        <label>Notes</label><br>
        <textarea id="family_history_note" rows="5" cols="60"></textarea>
    </fieldset>

    <br>

    <!-- ========================= -->
    <!-- HISTORY OF PRESENT ILLNESS -->
    <!-- ========================= -->
    <fieldset>
        <legend><strong>History of Present Illness</strong></legend>

        <label>Onset</label><br>
        <textarea id="onsetDesc" rows="3" cols="60"></textarea><br><br>

        <label>Provocation</label><br>
        <textarea id="provocationDesc" rows="3" cols="60"></textarea><br><br>

        <label>Quality</label><br>
        <textarea id="qualityDescn" rows="3" cols="60"></textarea><br><br>

        <label>Radiation</label><br>
        <textarea id="radiationDesc" rows="3" cols="60"></textarea><br><br>

        <label>Severity (0-10)</label><br>
        <input type="number" id="severityScore" min="0" max="10" default="0"><br><br>

    </fieldset>

    <br>

    <!-- ========================= -->
    <!-- PAST ILLNESS -->
    <!-- ========================= -->
    <fieldset>
        <legend><strong>Past Illness</strong></legend>

        <label>Condition Name</label><br>
        <input type="text" id="conditionName"><br><br>

        <label>Condition Type</label><br>
        <select id="conditionType">
            <option value="">Select</option>
            <option value="Chronic Disease">Chronic Disease</option>
            <option value="Infectious Disease">Infectious Disease</option>
            <option value="Mental Health">Mental Health</option>
            <option value="Metabolic">Metabolic</option>
            <option value="Cardiovascular">Cardiovascular</option>
            <option value="Respiratory">Respiratory</option>
            <option value="Neurologic">Neurologic</option>
            <option value="Oncologic">Oncologic</option>
            <option value="Other">Other</option>
        </select><br><br>

        <label>Notes</label><br>
        <textarea id="pmhNote" rows="5" cols="60"></textarea>

    </fieldset>

    <br>

    <!-- ========================= -->
    <!-- MEDICATION HISTORY -->
    <!-- ========================= -->
    <fieldset>
        <legend><strong>Past Medications</strong></legend>

        <label>Medication Name</label><br>
        <input type="text" id="medicationName"><br><br>

        <label>Dosage</label><br>
        <input type="text" id="dose"><br><br>

        <label>Frequency</label><br>
        <input type="text" id="frequency"><br><br>

        <label>Route</label><br>
        <select id="route">
            <option value="">Select</option>
            <option value="Oral">Oral</option>
            <option value="IV">IV</option>
            <option value="IM">IM</option>
            <option value="Subcutaneous">Subcutaneous</option>
            <option value="Topical">Topical</option>
            <option value="Inhalation">Inhalation</option>
            <option value="Other">Other</option>
        </select><br><br>

        <label>Status</label><br>
        <select id="status">
            <option value="">Select</option>
            <option value="Active">Active</option>
            <option value="Stopped">Stopped</option>
            <option value="Paused">Paused</option>
            <option value="Completed">Completed</option>
        </select><br><br>

        <label>Reason for Medication</label><br>
        <textarea id="prescriptionReason" rows="4" cols="60"></textarea>

    </fieldset>

    <br>

    <button type="button" id="update">
        Update
    </button>

    <button type="reset">
        Reset
    </button>
    
    <button onclick="history.back()">Back</button>
    </form>

    <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBRm3dUt3HreTquM_Ba9JfYmZD2CLVV0Gc",
        authDomain: "meditrack-59cca.firebaseapp.com",
        databaseURL: "https://meditrack-59cca-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "meditrack-59cca",
        storageBucket: "meditrack-59cca.firebasestorage.app",
        messagingSenderId: "656003988692",
        appId: "1:656003988692:web:badfe96b7d830837a4cf41"
    };

    import {getDatabase, ref, get, update}
    from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js"     

    const app = initializeApp(firebaseConfig);
    const db = getDatabase();
    
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");

    var insertBtn = document.querySelector("#insert");
    var clearBtn = document.querySelector("#clear");

    // Patient Information
    var admissionNumber = document.querySelector("#admissionNumber");
    var admissionDate = document.querySelector("#admissionDate");
    var admissionTime = document.querySelector("#admissionTime");
    var assignedArea = document.querySelector("#assignedArea");
    var room = document.querySelector("#room");
    var firstName = document.querySelector("#fName");
    var middleName = document.querySelector("#mName");
    var lastName = document.querySelector("#lName");
    var suffix = document.querySelector("#suffix");
    var dob = document.querySelector("#dob");
    var age = document.querySelector("#age");
    var sex = document.querySelector("#sex");
    var contactNumber = document.querySelector("#contactNumber");
    var occupation = document.querySelector("#occupation");
    var maritalStatus = document.querySelector("#marital_status");
    var idPic = document.querySelector("#id_pic");
    var occupyingIndiv = document.querySelector("#occupyingIndiv");

    // Address
    var streetNo = document.querySelector("#streetNo");
    var barangay = document.querySelector("#barangay");
    var city = document.querySelector("#city");
    var province = document.querySelector("#province");

    // Chief Complaint
    var chiefComplaint = document.querySelector("#chiefComplaint");
    var symptoms = document.querySelector("#symptoms");
    var medicationUsed = document.querySelector("#medicationUsed");

    // Family History
    var familyConditionType = document.querySelector("#family_condition_type");
    var familyHistoryNote = document.querySelector("#family_history_note");

    // History of Present Illness
    var onsetDesc = document.querySelector("#onsetDesc");
    var provocationDesc = document.querySelector("#provocationDesc");
    var qualityDescn = document.querySelector("#qualityDescn");
    var radiationDesc = document.querySelector("#radiationDesc");
    var severityScore = document.querySelector("#severityScore");

    // Past Illness
    var conditionName = document.querySelector("#conditionName");
    var conditionType = document.querySelector("#conditionType");
    var pmhNote = document.querySelector("#pmhNote");

    // Medication History
    var medicationName = document.querySelector("#medicationName");
    var dose = document.querySelector("#dose");
    var frequency = document.querySelector("#frequency");
    var route = document.querySelector("#route");
    var status = document.querySelector("#status");
    var prescriptionReason = document.querySelector("#prescriptionReason");

    function computeAge() {
    if (!dob.value) {
        age.value = "";
        return;
    }

    const birthDate = new Date(dob.value);
    const today = new Date();

    let years = today.getFullYear() - birthDate.getFullYear();

    const monthDifference = today.getMonth() - birthDate.getMonth();

    if (
        monthDifference < 0 ||
        (monthDifference === 0 && today.getDate() < birthDate.getDate())
    ) {
        years--;
    }

    age.value = years;
    }
    dob.addEventListener("change", computeAge);

    function InsertData() {
        // Generate a unique key
        const patientRef = push(ref(db, "patients"));
        const patientId = patientRef.key;
        const fullName = [

            firstName.value.trim(),

            middleName.value.trim(),

            lastName.value.trim(),

            suffix.value.trim()

        ]
        .filter(part => part !== "")
        .join(" ");

        set(patientRef, {
            // Patient Information
            patient_id: patientId,
            fullName: fullName,
            firstName: firstName.value,
            middleName: middleName.value,
            lastName: lastName.value,
            suffix: suffix.value,
            dateOfBirth: dob.value,
            age: Number(age.value),
            sex: sex.value,
            contactNumber: contactNumber.value,
            occupation: occupation.value,
            maritalStatus: maritalStatus.value,
            occupyingIndividual: occupyingIndiv.value,

            // Address
            streetNo: streetNo.value,
            barangay: barangay.value,
            city: city.value,
            province: province.value,

            // Chief Complaint
            chiefComplaint: chiefComplaint.value,
            symptoms: symptoms.value,
            medicationUsed: medicationUsed.value,

            // Family History
            familyConditionType: familyConditionType.value,
            familyHistoryNote: familyHistoryNote.value,

            // History of Present Illness
            onset: onsetDesc.value,
            provocation: provocationDesc.value,
            quality: qualityDescn.value,
            radiation: radiationDesc.value,
            severityScore: severityScore.value,

            // Past Illness
            conditionName: conditionName.value,
            conditionType: conditionType.value,
            pmhNote: pmhNote.value,

            // Medication History
            medicationName: medicationName.value,
            dose: dose.value,
            frequency: frequency.value,
            route: route.value,
            status: status.value,
            prescriptionReason: prescriptionReason.value,

            // Timestamp
            createdAt: new Date().toISOString()
        })
        .then(() => {
            alert("Patient record added successfully!");
            document.querySelector("form").reset();
        })
        .catch((error) => {
            alert("Error: " + error.message);
        });
    }

    get(ref(db, "patients/" + id))
    .then((snapshot)=>{

        if(snapshot.exists()){

            const p = snapshot.val();
            admissionNumber.value = p.admissionNumber || "";
            admissionDate.value = p.admissionDate || "";
            admissionTime.value = p.admissionTime || "";
            assignedArea.value = p.assignedArea || "";
            room.value = p.room || "";

            firstName.value = p.firstName || "";
            middleName.value = p.middleName || "";
            lastName.value = p.lastName || "";
            suffix.value = p.suffix || "";

            dob.value = p.dateOfBirth || "";
            age.value = p.age || "";

            sex.value = p.sex || "";

            contactNumber.value = p.contactNumber || "";

            occupation.value = p.occupation || "";

            maritalStatus.value = p.maritalStatus || "";

            occupyingIndiv.value = p.occupyingIndividual || "";

            streetNo.value = p.streetNo || "";
            barangay.value = p.barangay || "";
            city.value = p.city || "";
            province.value = p.province || "";

            chiefComplaint.value = p.chiefComplaint || "";
            symptoms.value = p.symptoms || "";
            medicationUsed.value = p.medicationUsed || "";

            familyConditionType.value = p.familyConditionType || "";
            familyHistoryNote.value = p.familyHistoryNote || "";

            onsetDesc.value = p.onset || "";
            provocationDesc.value = p.provocation || "";
            qualityDescn.value = p.quality || "";
            radiationDesc.value = p.radiation || "";
            severityScore.value = p.severityScore || "";

            conditionName.value = p.conditionName || "";
            conditionType.value = p.conditionType || "";
            pmhNote.value = p.pmhNote || "";

            medicationName.value = p.medicationName || "";
            dose.value = p.dose || "";
            frequency.value = p.frequency || "";
            route.value = p.route || "";
            status.value = p.status || "";
            prescriptionReason.value = p.prescriptionReason || "";

        }

    });

    function UpdateData(){

        const fullName = [

            firstName.value.trim(),
            middleName.value.trim(),
            lastName.value.trim(),
            suffix.value.trim()

        ]
        .filter(part => part !== "")
        .join(" ");

        update(ref(db,"patients/" + id),{
            admissionNumber: admissionNumber.value,
            admissionDate: admissionDate.value,
            admissionTime: admissionTime.value,
            assignedArea: assignedArea.value,
            room: room.value,
            
            patient_id: id,
            fullName: fullName,
            
            firstName: firstName.value,
            middleName: middleName.value,
            lastName: lastName.value,
            suffix: suffix.value,

            dateOfBirth: dob.value,
            age: Number(age.value),

            sex: sex.value,
            contactNumber: contactNumber.value,
            occupation: occupation.value,
            maritalStatus: maritalStatus.value,
            occupyingIndividual: occupyingIndiv.value,

            streetNo: streetNo.value,
            barangay: barangay.value,
            city: city.value,
            province: province.value,

            chiefComplaint: chiefComplaint.value,
            symptoms: symptoms.value,
            medicationUsed: medicationUsed.value,

            familyConditionType: familyConditionType.value,
            familyHistoryNote: familyHistoryNote.value,

            onset: onsetDesc.value,
            provocation: provocationDesc.value,
            quality: qualityDescn.value,
            radiation: radiationDesc.value,
            severityScore: severityScore.value,

            conditionName: conditionName.value,
            conditionType: conditionType.value,
            pmhNote: pmhNote.value,

            medicationName: medicationName.value,
            dose: dose.value,
            frequency: frequency.value,
            route: route.value,
            status: status.value,
            prescriptionReason: prescriptionReason.value,

            updatedAt: new Date().toISOString()

        })
        .then(()=>{

            alert("Patient record updated successfully.");

            window.location.href =
                "view_patient.html?id=" + id;

        })
        .catch((error)=>{

            alert(error.message);

        });

    }

    const updateBtn = document.querySelector("#update");

    updateBtn.addEventListener("click",(e)=>{

        e.preventDefault();

        computeAge();

        UpdateData();

    });
    </script>
</body>
</html>
