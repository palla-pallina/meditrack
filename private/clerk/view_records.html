<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Patient Records Dashboard</title>

        <link rel="stylesheet" href="stylesheets/view_records.css">
    </head>
    

<body>

<header>

    <div class="logo">

        <h2>MediTrack</h2>
        <span>Patient Admission Records</span>

    </div>

    <button id="logoutBtn" class="logout-btn">
        Log Out
    </button>

</header>

<main>

    <section class="page-header">

        <div>

            <h1>Patient Records</h1>

            <p>
                Manage patient admission records and demographic information.
            </p>

        </div>

        <div class="actions">

            <a href="add_patient.html" class="btn btn-primary">
                + Add Patient
            </a>

            <button id="refreshBtn" class="btn btn-secondary">
                Refresh
            </button>

        </div>

    </section>

    <section class="toolbar">

        <input
            type="text"
            id="searchInput"
            placeholder="Search patient...">

        <select id="statusFilter">
            <option value="Admitted" selected>Admitted</option>
            <option value="Discharged">Discharged</option>
            <option value="All">All Patients</option>
        </select>

        <select id="sortOrder">
            <option value="recent">Recent</option>
            <option value="oldest">Oldest</option>
        </select>

    </section>

    <section class="table-card">

        <table>

            <thead>

                <tr>

                    <th>Name</th>
                    <th>Age</th>
                    <th>Sex</th>
                    <th>Contact Number</th>
                    <th>City</th>
                    <th>Chief Complaint</th>
                    <th>Actions</th>

                </tr>

            </thead>

            <tbody id="patientTable">

            </tbody>

        </table>

    </section>
        <script type="module">

        import { requireRole }
        from "../../public/auth_guard.js";

        requireRole("Clerk");

        import {
            getAuth,
            signOut
        } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";

        const auth = getAuth();

        document.getElementById("logoutBtn")
        .addEventListener("click", async () => {

            try {

                await signOut(auth);

                window.location.href = "../../public/login.html";

            }
            catch(error) {

                alert(error.message);

            }

        });
        </script>

        <script type="module">
            import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";

            import {
                getDatabase,
                ref,
                get,
                remove
            } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";

            const firebaseConfig = {
                apiKey: "AIzaSyBRm3dUt3HreTquM_Ba9JfYmZD2CLVV0Gc",
                authDomain: "meditrack-59cca.firebaseapp.com",
                databaseURL: "https://meditrack-59cca-default-rtdb.asia-southeast1.firebasedatabase.app",
                projectId: "meditrack-59cca",
                storageBucket: "meditrack-59cca.firebasestorage.app",
                messagingSenderId: "656003988692",
                appId: "1:656003988692:web:badfe96b7d830837a4cf41"
            };

            const app = initializeApp(firebaseConfig);
            const db = getDatabase(app);

            const table = document.querySelector("#patientTable");
            let patients = [];
            const refreshBtn = document.querySelector("#refreshBtn");

            function loadPatients() {

                table.innerHTML = "";

                get(ref(db, "patients"))

                .then((snapshot) => {

                    patients = [];

                    if (!snapshot.exists()) {

                        table.innerHTML = `
                            <tr>
                                <td colspan="7">
                                    No patient records found.
                                </td>
                            </tr>
                        `;

                        return;
                    }

                    snapshot.forEach((child) => {

                        patients.push({

                            id: child.key,

                            ...child.val()

                        });

                    });

                    renderPatients();

                })

                .catch((error)=>{

                    alert(error.message);

                });

            }

            function renderPatients() {

                table.innerHTML = "";

                const status =
                    document.getElementById("statusFilter").value;

                const sort =
                    document.getElementById("sortOrder").value;

                const search =
                    document
                    .getElementById("searchInput")
                    .value
                    .trim()
                    .toLowerCase();

                let filtered = [...patients];

                // Filter

                if(status !== "All"){

                    filtered = filtered.filter(patient =>
                        patient.admissionStatus === status
                    );

                }

                if(search){

                    filtered = filtered.filter(patient => {

                        const fullName = [
                            patient.firstName,
                            patient.middleName,
                            patient.lastName,
                            patient.suffix
                        ]
                        .filter(Boolean)
                        .join(" ")
                        .toLowerCase();

                        return (

                            fullName.includes(search) ||

                            (patient.admissionNumber || "")
                                .toLowerCase()
                                .includes(search) ||

                            (patient.contactNumber || "")
                                .toLowerCase()
                                .includes(search) ||

                            (patient.city || "")
                                .toLowerCase()
                                .includes(search) ||

                            (patient.chiefComplaint || "")
                                .toLowerCase()
                                .includes(search)

                        );

                    });

                }

                // Sort

                filtered.sort((a,b)=>{

                    const dateA =
                        new Date(
                            (a.createdAt || "") + ""
                        );

                    const dateB =
                        new Date(
                            (b.createdAt || "") + ""
                        );

                    if(sort === "recent"){

                        return dateB - dateA;

                    }

                    return dateA - dateB;

                });

                if(filtered.length === 0){

                    table.innerHTML = `
                        <tr>
                            <td colspan="7">
                                No patient records found.
                            </td>
                        </tr>
                    `;

                    return;

                }

                filtered.forEach(patient=>{

                    table.innerHTML += `

                    <tr>

                        <td>${patient.firstName ?? ""} ${patient.middleName ?? ""} ${patient.lastName ?? ""}</td>

                        <td>${patient.age ?? ""}</td>

                        <td>${patient.sex ?? ""}</td>

                        <td>${patient.contactNumber ?? ""}</td>

                        <td>${patient.city ?? ""}</td>

                        <td>${patient.chiefComplaint ?? ""}</td>

                        <td>

                            <a href="view_patient.html?id=${patient.id}">
                                <button class="action-btn view">
                                    View
                                </button>
                            </a>

                            <a href="edit_patient.html?id=${patient.id}">
                                <button class="action-btn edit">
                                    Edit
                                </button>
                            </a>

                            <button
                                class="action-btn delete deleteBtn"
                                data-id="${patient.id}">
                                Delete
                            </button>

                        </td>

                    </tr>

                    `;

                });

                addDeleteListeners();

            }

            function addDeleteListeners() {
                const deleteButtons = document.querySelectorAll(".deleteBtn");

                deleteButtons.forEach((button) => {
                    button.addEventListener("click", () => {
                        const id = button.dataset.id;

                        if (!confirm("Delete this patient record?")) {
                            return;
                        }

                        remove(ref(db, "patients/" + id))
                            .then(() => {
                                alert("Patient record deleted successfully.");
                                loadPatients(); // Refresh the table
                            })
                            .catch((error) => {
                                alert(error.message);
                            });
                    });
                });
            }

            refreshBtn.addEventListener("click", loadPatients);
            loadPatients();

            document
            .getElementById("searchInput")
            .addEventListener("input", renderPatients);

            document
            .getElementById("statusFilter")
            .addEventListener("change", renderPatients);

            document
            .getElementById("sortOrder")
            .addEventListener("change", renderPatients);
        </script>

</main>

</body>
